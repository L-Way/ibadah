/* ============ TOKENS ============ */
:root{
  --paper:#FBF6EA; --paper-2:#F4EDDC; --ink:#17251F; --ink-soft:#4A5A52; --ink-faint:#8A978F;
  --emerald:#0B3A34; --emerald-2:#11564B; --emerald-3:#1C7A67; --mint:#DCEDE6;
  --gold:#B08324; --gold-2:#E3C778; --ruby:#9E1B32; --ruby-soft:#C64A5E;
  --surface:#FFFFFF; --surface-2:#F6F2E8; --line:rgba(23,37,31,.10); --line-2:rgba(23,37,31,.06);
  --shadow-s:0 1px 2px rgba(11,58,52,.06), 0 4px 14px rgba(11,58,52,.05);
  --shadow-m:0 2px 6px rgba(11,58,52,.07), 0 14px 34px rgba(11,58,52,.09);
  --shadow-l:0 30px 70px rgba(11,58,52,.18);
  --r-s:12px; --r-m:18px; --r-l:26px; --r-xl:34px;
  --nav-h:66px;
  --ease:cubic-bezier(.22,1,.36,1); --ease-2:cubic-bezier(.34,1.56,.64,1);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ar-size:26px; --ar-lh:2.3;
  --font-ui:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-ar:'LPMQ','Scheherazade New','Amiri','Traditional Arabic','Geeza Pro',serif;
}
html[data-theme="dark"]{
  --paper:#0E1614; --paper-2:#121E1A; --ink:#E7F0EB; --ink-soft:#A9BCB3; --ink-faint:#6F827A;
  --emerald:#0A2A26; --emerald-2:#0F3D36; --emerald-3:#3FBFA3; --mint:#143029;
  --gold:#D8B569; --gold-2:#8A6A22; --ruby:#D8637A; --ruby-soft:#8E2A3C;
  --surface:#16241F; --surface-2:#1B2C26; --line:rgba(231,240,235,.12); --line-2:rgba(231,240,235,.07);
  --shadow-s:0 1px 2px rgba(0,0,0,.3), 0 6px 16px rgba(0,0,0,.28);
  --shadow-m:0 3px 10px rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.4);
  --shadow-l:0 30px 70px rgba(0,0,0,.6);
}
html[data-theme="sepia"]{
  --paper:#F3E7D0; --paper-2:#EBDCC0; --surface:#FBF3E3; --surface-2:#F0E4CC;
  --ink:#3A2C17; --ink-soft:#6B5836; --ink-faint:#9A886A; --line:rgba(58,44,23,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font-ui); background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  font-size:15px; line-height:1.55; letter-spacing:-.005em;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
::-webkit-scrollbar{width:0;height:0}
:focus-visible{outline:2px solid var(--emerald-3);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============ APP SHELL ============ */
#app{min-height:100%;position:relative;isolation:isolate}
.page{
  display:none; padding:calc(var(--sat) + 8px) 0 calc(var(--nav-h) + var(--sab) + 26px);
  min-height:100dvh; animation:pageIn .42s var(--ease) both;
}
.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(10px) scale(.994)}to{opacity:1;transform:none}}
.wrap{padding:0 18px;max-width:720px;margin:0 auto}

/* ============ TOP BAR ============ */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 18px 4px;max-width:720px;margin:0 auto}
.topbar h1{font-size:23px;font-weight:800;margin:0;letter-spacing:-.03em}
.topbar .sub{font-size:12.5px;color:var(--ink-faint);margin-top:1px}
.icon-btn{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  background:var(--surface);box-shadow:var(--shadow-s);transition:transform .25s var(--ease-2),background .2s;
  flex:none;
}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ============ CARD ============ */
.card{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow-s);padding:18px;position:relative;overflow:hidden}
.card+.card{margin-top:14px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;padding:0 4px}
.sec-title h2{font-size:16px;font-weight:700;margin:0;letter-spacing:-.02em}
.sec-title .more{font-size:12.5px;color:var(--emerald-3);font-weight:600}

/* ============ HERO / PRAYER ============ */
.hero{
  position:relative;border-radius:var(--r-xl);overflow:hidden;color:#fff;padding:22px 20px 20px;
  background:
    radial-gradient(120% 90% at 82% 8%, rgba(226,199,120,.32), transparent 55%),
    radial-gradient(100% 120% at 8% 100%, rgba(63,191,163,.32), transparent 60%),
    linear-gradient(155deg,#0E4B41 0%,#0B3A34 52%,#092B28 100%);
  box-shadow:0 18px 44px rgba(11,58,52,.32);
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;
  background-image:
    repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 1px,transparent 1px 16px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.5) 0 1px,transparent 1px 16px);
  mask-image:radial-gradient(120% 90% at 100% 0%,#000,transparent 62%);
}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:1}
.hero .loc{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;opacity:.85;font-weight:500}
.hero .loc svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.hero .next-label{font-size:12.5px;opacity:.8;margin-top:14px;font-weight:500}
.hero .next-name{font-size:31px;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin-top:2px}
.hero .next-time{font-size:15px;font-weight:600;opacity:.92;margin-top:3px}
.hero .countdown{
  font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:600;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);
  padding:7px 13px;border-radius:999px;display:inline-flex;gap:7px;align-items:center;margin-top:14px;
  backdrop-filter:blur(6px)
}
.hero .countdown .dot{width:6px;height:6px;border-radius:50%;background:var(--gold-2);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.hijri{text-align:right;font-size:12.5px;max-width:120px;line-height:1.5;opacity:.9;font-weight:500}
.hijri b{display:block;font-size:14px;font-weight:700}

.ptrack{display:flex;gap:7px;margin-top:18px;position:relative;z-index:1}
.ptrack .p{
  flex:1;text-align:center;padding:9px 3px;border-radius:15px;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.08);transition:all .35s var(--ease)
}
.ptrack .p.now{background:rgba(255,255,255,.95);color:var(--emerald);box-shadow:0 8px 22px rgba(0,0,0,.24);transform:translateY(-3px)}
.ptrack .p.past{opacity:.5}
.ptrack .n{font-size:10.5px;font-weight:600;opacity:.9}
.ptrack .t{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}

/* ============ CONTINUE READING ============ */
.continue{
  display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-l);
  background:linear-gradient(120deg,var(--surface),var(--surface));
  box-shadow:var(--shadow-s);position:relative;overflow:hidden;width:100%;text-align:left
}
.continue::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(176,131,36,.1),transparent 55%)}
.continue .ribbon{
  width:46px;height:56px;flex:none;position:relative;z-index:1;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:15px;filter:drop-shadow(0 6px 8px rgba(158,27,50,.3))
}
.continue .ribbon::before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(160deg,var(--ruby),#7A1326);
  clip-path:path("M10 0H36Q46 0 46 10V51Q46 55 42.6 53.4L26.2 45.6Q23 44.2 19.8 45.6L3.4 53.4Q0 55 0 51V10Q0 0 10 0Z")
}
.continue .meta{flex:1;min-width:0;position:relative;z-index:1}
.continue .k{font-size:11.5px;color:var(--ink-faint);font-weight:600}
.continue .v{font-size:16.5px;font-weight:700;letter-spacing:-.02em;margin-top:1px}
.continue .d{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.continue .go{width:36px;height:36px;border-radius:12px;background:var(--mint);display:grid;place-items:center;position:relative;z-index:1;flex:none}
.continue .go svg{width:17px;height:17px;stroke:var(--emerald-3);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ============ QUICK GRID ============ */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick button{
  background:var(--surface);border-radius:20px;padding:13px 6px 11px;box-shadow:var(--shadow-s);
  display:flex;flex-direction:column;align-items:center;gap:7px;transition:transform .3s var(--ease-2)
}
.quick button:active{transform:scale(.93)}
.quick .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--mint)}
.quick .ic svg{width:20px;height:20px;stroke:var(--emerald-3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.quick span{font-size:11px;font-weight:600;color:var(--ink-soft);text-align:center;line-height:1.25}

/* ============ PROGRESS RING ============ */
.ring{position:relative;width:74px;height:74px;flex:none}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-linecap:round}
.ring .bg{stroke:var(--line);stroke-width:7}
.ring .fg{stroke:url(#ringGrad);stroke-width:7;transition:stroke-dashoffset 1.1s var(--ease)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:800;letter-spacing:-.04em}

/* ============ BOTTOM NAV ============ */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;padding:0 12px calc(var(--sab) + 9px);
  background:linear-gradient(to top,var(--paper) 62%,transparent);
  transition:transform .4s var(--ease),opacity .3s
}
.nav.hide{transform:translateY(130%);opacity:0;pointer-events:none}
.nav-inner{
  max-width:520px;margin:0 auto;display:flex;background:var(--surface);border-radius:24px;
  box-shadow:var(--shadow-m);padding:7px;position:relative;border:1px solid var(--line-2)
}
.nav-pill{position:absolute;top:7px;bottom:7px;border-radius:18px;background:var(--mint);transition:left .42s var(--ease),width .42s var(--ease)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;position:relative;z-index:1;border-radius:18px}
.nav svg{width:21px;height:21px;stroke:var(--ink-faint);fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s,transform .4s var(--ease-2)}
.nav span{font-size:9.5px;font-weight:600;color:var(--ink-faint);transition:color .3s}
.nav button.on svg{stroke:var(--emerald-3);transform:translateY(-1px) scale(1.06)}
.nav button.on span{color:var(--emerald-3);font-weight:700}

/* ============ SURAH LIST ============ */
.seg{display:flex;background:var(--surface-2);border-radius:16px;padding:4px;position:relative;margin:4px 0 14px}
.seg button{flex:1;padding:9px;font-size:13px;font-weight:600;color:var(--ink-faint);border-radius:13px;position:relative;z-index:1;transition:color .3s}
.seg button.on{color:var(--emerald);font-weight:700}
html[data-theme="dark"] .seg button.on{color:#fff}
.seg .thumb{position:absolute;top:4px;bottom:4px;background:var(--surface);border-radius:13px;box-shadow:var(--shadow-s);transition:left .4s var(--ease),width .4s var(--ease)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:17px;padding:12px 15px;box-shadow:var(--shadow-s);margin-bottom:12px}
.search svg{width:17px;height:17px;stroke:var(--ink-faint);fill:none;stroke-width:2}
.search input{flex:1;border:0;background:none;outline:none;font-size:14.5px}
.search input::placeholder{color:var(--ink-faint)}

.slist{display:flex;flex-direction:column;gap:8px}
.srow{
  display:flex;align-items:center;gap:13px;background:var(--surface);border-radius:20px;padding:13px 15px;
  box-shadow:var(--shadow-s);width:100%;text-align:left;transition:transform .28s var(--ease-2);
  animation:rowIn .5s var(--ease) both
}
@keyframes rowIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.srow:active{transform:scale(.975)}
.snum{width:42px;height:42px;flex:none;display:grid;place-items:center;position:relative;font-size:12.5px;font-weight:700;color:var(--gold)}
.snum svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--gold);stroke-width:1.3;opacity:.65}
.snum b{position:relative;z-index:1;font-weight:700}
.sinfo{flex:1;min-width:0}
.sinfo .nm{font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.sinfo .dt{font-size:11.5px;color:var(--ink-faint);margin-top:1px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sinfo .dt i{width:3px;height:3px;border-radius:50%;background:var(--ink-faint);display:inline-block;font-style:normal}
.sar{font-family:var(--font-ar);font-size:23px;color:var(--emerald-3);line-height:1;flex:none;direction:rtl;padding-left:6px}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--surface-2);color:var(--ink-soft)}
.tag.mk{background:rgba(176,131,36,.14);color:var(--gold)}
.tag.md{background:rgba(28,122,103,.14);color:var(--emerald-3)}
.tag.rb{background:rgba(158,27,50,.14);color:var(--ruby)}
.tag{display:inline-flex;align-items:center;gap:4px}
.tag svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.opt>svg{width:16px;height:16px;stroke:var(--ink-faint);fill:none;stroke-width:2;flex:none}
.wjam{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--surface-2);border-radius:12px;padding:8px 10px 8px 12px;cursor:pointer;font-family:inherit;transition:background .2s}
.wjam:active{background:var(--line)}
.wjam .wj-jam{font-size:12.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.wjam .tag{margin-left:auto;font-size:11px;padding:4px 9px;border-radius:8px}
.wjam .wj-edit{font-size:11px;color:var(--emerald-3);font-weight:700;white-space:nowrap}

/* ============ MUSHAF READER ============ */
#reader{
  position:fixed;inset:0;z-index:100;background:var(--paper);display:none;
  flex-direction:column;overscroll-behavior:contain
}
#reader.open{display:flex;animation:readerIn .45s var(--ease) both}
@keyframes readerIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
html[data-theme="light"] #reader,html[data-theme="sepia"] #reader{
  background:radial-gradient(130% 100% at 50% 0%,#FFFDF6,var(--paper) 70%)
}
.rhead{
  position:relative;z-index:5;padding:calc(var(--sat) + 8px) 14px 10px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(to bottom,var(--paper) 72%,transparent);transition:transform .38s var(--ease),opacity .3s
}
.rhead.hide{transform:translateY(-110%);opacity:0;pointer-events:none}
.rhead .ttl{flex:1;min-width:0;text-align:center}
.rhead .ttl b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.rhead .ttl span{font-size:11px;color:var(--ink-faint)}
#rMode{display:block;margin:3px auto 0;font-family:inherit;cursor:pointer}
.pill.khatam{border-color:var(--emerald-3);color:var(--emerald-3);background:color-mix(in srgb,var(--emerald-3) 9%,transparent)}
.pill.simak{border-color:var(--ink-faint);color:var(--ink-faint);background:transparent}
.rbody{flex:1;min-height:0;overflow:hidden;position:relative;overscroll-behavior:contain}
.pstage{height:100%;perspective:1500px;padding:2px 12px calc(var(--sab) + 92px);max-width:660px;margin:0 auto}
.pcard{height:100%;transform-origin:50% 50%;transition:transform .4s var(--ease),opacity .4s var(--ease);will-change:transform;backface-visibility:hidden}
.pcard .mushaf{height:100%;display:flex}
.pcard .mushaf-in{flex:1;display:flex;flex-direction:column;min-height:0}
.pgtop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:7px}
.pgtop .pill{padding:2px 11px;font-size:10.5px}
.pgbody{flex:1;min-height:0;overflow:hidden;font-size:var(--ar-size);line-height:var(--ar-lh)}
.pgbody .bismillah{font-size:.95em;line-height:1.9;padding:4px 0 10px;margin-bottom:9px}
.pgbody .sheader{padding:4px 0 9px}
.pgbody .sheader .orn{height:26px;margin-bottom:2px}
.pgbody .sheader .nm-ar{font-size:1.08em;line-height:1.45}
.pgbody .sheader .nm-id{font-size:11px}
.pgbody.bisaGulir{overflow-y:auto;overscroll-behavior:contain}
.pgbot{text-align:center;padding-top:9px;margin-top:7px;border-top:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.pnum{font-family:var(--font-ar);color:var(--ruby);font-size:18px;line-height:1;display:inline-grid;place-items:center;width:34px;height:34px;border:1.4px solid var(--ruby);border-radius:50%}
.tpage{height:100%;overflow-y:auto;overscroll-behavior:contain;padding-bottom:18px}
@keyframes masukKiri{from{opacity:0;transform:translateX(-42%) rotateY(16deg) scale(.96)}to{opacity:1;transform:none}}
@keyframes masukKanan{from{opacity:0;transform:translateX(42%) rotateY(-16deg) scale(.96)}to{opacity:1;transform:none}}
.pcard.masukKiri{animation:masukKiri .44s var(--ease) both}
.pcard.masukKanan{animation:masukKanan .44s var(--ease) both}
.pgbody .flow{margin:0}
input[type=range]{accent-color:var(--emerald-3);height:26px}
.heat.kh-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rpage{max-width:640px;margin:0 auto;padding:6px 12px 0}

.pagebar{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 14px;flex-wrap:wrap}
.pill{
  border:1.4px solid var(--gold);color:var(--gold);border-radius:999px;padding:3px 14px;font-size:11px;font-weight:600;
  background:color-mix(in srgb,var(--gold) 7%,transparent)
}
.pagenum{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;
  border:1.5px solid var(--ruby);color:var(--ruby);position:relative
}

/* ornamental mushaf frame */
.mushaf{
  border:1.6px solid var(--gold);border-radius:6px;padding:4px;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.15));
  box-shadow:0 10px 34px rgba(11,58,52,.10)
}
html[data-theme="dark"] .mushaf{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01))}
.mushaf::before{
  content:"";position:absolute;inset:-6px;border:1.2px solid color-mix(in srgb,var(--gold) 45%,transparent);
  border-radius:9px;pointer-events:none
}
.mushaf-in{border:1px solid color-mix(in srgb,var(--ruby) 55%,transparent);border-radius:3px;padding:16px 13px}
.sheader{text-align:center;padding:10px 0 14px;position:relative}
.sheader .orn{display:block;width:100%;max-width:330px;margin:0 auto 4px;height:34px}
.sheader .nm-ar{font-family:var(--font-ar);font-size:31px;font-weight:700;color:var(--ruby);line-height:1.5;direction:rtl}
.sheader .nm-id{font-size:12px;color:var(--ink-faint);margin-top:2px;letter-spacing:.02em}
.bismillah{
  font-family:var(--font-ar);font-size:27px;text-align:center;direction:rtl;color:var(--ink);
  padding:8px 0 16px;line-height:2;border-bottom:1px solid var(--line-2);margin-bottom:14px
}

/* flowing mushaf text */
.flow{
  direction:rtl;text-align:justify;text-align-last:center;font-family:var(--font-ar);
  font-size:inherit;line-height:inherit;color:var(--ink);word-spacing:.02em
}
.ayah{border-radius:8px;padding:1px 2px;transition:background .45s var(--ease),color .3s;cursor:pointer}
.ayah.sel{background:color-mix(in srgb,var(--gold) 24%,transparent)}
.ayah.playing{background:color-mix(in srgb,var(--emerald-3) 20%,transparent)}
.ayah.lastread{background:color-mix(in srgb,var(--ruby) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ruby) 35%,transparent)}
.anum{
  font-family:var(--font-ar);color:var(--ruby);font-size:.85em;padding:0 .12em;
  display:inline-block;position:relative;white-space:nowrap
}
@keyframes markPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}

/* translation mode */
.tlist{display:flex;flex-direction:column;gap:12px}
.tcard{background:var(--surface);border-radius:var(--r-m);padding:16px;box-shadow:var(--shadow-s);position:relative}
.tcard .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tcard .bdg{
  min-width:30px;height:30px;padding:0 9px;border-radius:10px;background:var(--mint);color:var(--emerald-3);
  display:grid;place-items:center;font-size:12px;font-weight:800
}
.tcard .acts{display:flex;gap:4px}
.tcard .acts button{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;transition:background .2s}
.tcard .acts button:active{background:var(--surface-2)}
.tcard .acts svg{width:16px;height:16px;stroke:var(--ink-faint);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tcard .acts button.on svg{stroke:var(--ruby);fill:var(--ruby)}
.tcard .ar{font-family:var(--font-ar);font-size:var(--ar-size);line-height:var(--ar-lh);direction:rtl;text-align:right;margin-bottom:10px}
.tcard .lt{font-size:12.5px;color:var(--emerald-3);font-style:italic;line-height:1.7;margin-bottom:8px}
.tcard .id{font-size:14px;color:var(--ink-soft);line-height:1.75}
.tcard.lastread{box-shadow:0 0 0 1.6px var(--ruby),var(--shadow-s)}

/* reader footer */
.rfoot{
  position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 14px calc(var(--sab) + 12px);
  background:linear-gradient(to top,var(--paper) 62%,transparent);
  display:flex;gap:9px;align-items:center;justify-content:center;transition:transform .38s var(--ease),opacity .3s
}
.rfoot.hide{transform:translateY(130%);opacity:0;pointer-events:none}
.rfoot .bar{display:flex;gap:6px;background:var(--surface);border-radius:20px;padding:6px;box-shadow:var(--shadow-m);border:1px solid var(--line-2);align-items:center}
.rfoot .bar button{padding:9px 12px;border-radius:15px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;transition:background .25s}
.rfoot .bar button:active{background:var(--surface-2)}
.rfoot .bar button.primary{background:var(--emerald);color:#fff}
html[data-theme="dark"] .rfoot .bar button.primary{background:var(--emerald-3);color:#06120F}
.rfoot svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rprog{position:fixed;top:0;left:0;height:2.5px;background:linear-gradient(90deg,var(--gold),var(--emerald-3));z-index:110;transition:width .2s linear;width:0}

/* ============ SHEET ============ */
.scrim{position:fixed;inset:0;background:rgba(9,25,22,.42);backdrop-filter:blur(3px);z-index:120;opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:130;background:var(--surface);
  border-radius:30px 30px 0 0;box-shadow:var(--shadow-l);transform:translateY(102%);
  transition:transform .48s var(--ease);max-height:86dvh;display:flex;flex-direction:column;
  padding-bottom:calc(var(--sab) + 14px)
}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:4.5px;border-radius:99px;background:var(--line);margin:11px auto 4px;flex:none}
.sheet .sh-hd{padding:6px 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.sheet .sh-hd h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
.sheet .sh-bd{overflow-y:auto;padding:4px 20px 8px}
.opt{display:flex;align-items:center;gap:13px;padding:14px 4px;width:100%;text-align:left;border-bottom:1px solid var(--line-2)}
.opt:last-child{border-bottom:0}
.opt .oi{width:38px;height:38px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.opt .oi svg{width:18px;height:18px;stroke:var(--emerald-3);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.opt .ot{flex:1}
.opt .ot b{display:block;font-size:14.5px;font-weight:600}
.opt .ot span{font-size:12px;color:var(--ink-faint)}

/* ============ TOAST ============ */
#toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--sab) + 26px);transform:translate(-50%,24px);
  background:var(--emerald);color:#fff;padding:11px 18px;border-radius:16px;font-size:13px;font-weight:600;
  z-index:200;opacity:0;pointer-events:none;transition:all .4s var(--ease);box-shadow:var(--shadow-m);
  max-width:86vw;text-align:center
}
html[data-theme="dark"] #toast{background:var(--emerald-3);color:#06120F}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.reading #toast{bottom:calc(var(--sab) + 104px)}

/* ============ PRAYER PAGE ============ */
.prow{
  display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:20px;background:var(--surface);
  box-shadow:var(--shadow-s);margin-bottom:9px;position:relative;overflow:hidden;
  animation:rowIn .5s var(--ease) both
}
.prow.now::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--gold),var(--emerald-3))}
.prow.now{background:linear-gradient(100deg,color-mix(in srgb,var(--mint) 55%,var(--surface)),var(--surface))}
.prow .pic{width:40px;height:40px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.prow .pic svg{width:19px;height:19px;stroke:var(--emerald-3);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.prow .pn{flex:1}
.prow .pn b{font-size:15px;font-weight:700}
.prow .pn span{display:block;font-size:11.5px;color:var(--ink-faint)}
.prow .pt{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.prow .chk{width:34px;height:34px;border-radius:12px;border:1.6px solid var(--line);display:grid;place-items:center;flex:none;margin-left:4px;transition:all .3s var(--ease-2)}
.prow .chk svg{width:17px;height:17px;stroke:var(--ink-faint);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.prow .chk.on{background:var(--emerald-3);border-color:var(--emerald-3);transform:scale(1.04)}
.prow .chk.on svg{stroke:#fff}

/* ============ QIBLA ============ */
.compass-wrap{display:grid;place-items:center;padding:8px 0 4px}
.compass{width:clamp(200px,min(78vw,50vh),310px);aspect-ratio:1;position:relative;display:grid;place-items:center;margin-top:10px}
.compass::after{content:"";position:absolute;left:50%;top:-11px;margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:11px solid var(--emerald-3);z-index:2;pointer-events:none}
.compass.aligned .kaaba-needle{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--emerald-3) 70%,transparent))}
.dial{position:absolute;inset:0;will-change:transform}
.dial svg{width:100%;height:100%;overflow:visible}
.kaaba-needle{position:absolute;inset:0;will-change:transform;pointer-events:none}
.qinfo{text-align:center;margin-top:10px}
.qdeg{font-size:42px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1}
.qdeg span{font-size:20px;font-weight:600;color:var(--ink-faint)}
.qhint{font-size:12.5px;color:var(--ink-faint);margin-top:6px}
.qalign{color:var(--emerald-3);font-weight:700}

/* ============ TRACKER ============ */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:20px;padding:14px 12px;box-shadow:var(--shadow-s);text-align:center}
.stat .n{font-size:22px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.stat .l{font-size:10.5px;color:var(--ink-faint);font-weight:600;margin-top:3px;line-height:1.3}
.stat .n.gold{color:var(--gold)} .stat .n.em{color:var(--emerald-3)} .stat .n.rb{color:var(--ruby)}

.dsel{display:flex;gap:7px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x mandatory}
.dsel button{
  flex:none;width:52px;padding:9px 0;border-radius:17px;background:var(--surface);box-shadow:var(--shadow-s);
  display:flex;flex-direction:column;align-items:center;gap:3px;scroll-snap-align:center;transition:all .3s var(--ease)
}
.dsel button .dd{font-size:10px;font-weight:600;color:var(--ink-faint)}
.dsel button .dn{font-size:16px;font-weight:700}
.dsel button .dot{width:5px;height:5px;border-radius:50%;background:var(--line)}
.dsel button.on{background:var(--emerald);color:#fff;transform:scale(1.05)}
.dsel button.on .dd{color:rgba(255,255,255,.75)}
html[data-theme="dark"] .dsel button.on{background:var(--emerald-3);color:#06120F}

.track-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-s);margin-bottom:8px}
.track-item .ti{flex:1;min-width:0}
.track-item .ti b{font-size:14px;font-weight:600;display:block}
.track-item .ti span{font-size:11.5px;color:var(--ink-faint)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  padding:6px 11px;border-radius:12px;font-size:11.5px;font-weight:600;background:var(--surface-2);
  color:var(--ink-soft);transition:all .28s var(--ease-2);border:1px solid transparent
}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--emerald-3);color:#fff;box-shadow:0 5px 14px color-mix(in srgb,var(--emerald-3) 40%,transparent)}
.chip.on.gold{background:var(--gold);box-shadow:0 5px 14px color-mix(in srgb,var(--gold) 40%,transparent)}
.chip.on.ruby{background:var(--ruby);box-shadow:0 5px 14px color-mix(in srgb,var(--ruby) 40%,transparent)}
.chip.dis{opacity:.4;pointer-events:none}
.opsi{display:flex;flex-direction:column;gap:6px}
.opsi-lbl{font-size:11px;font-weight:700;color:var(--ink-faint)}
.opsi-lbl em{font-style:normal;font-weight:500}
.chips.g2,.chips.g3{display:grid;gap:6px}
.chips.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.chips.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.chips.g2 .chip,.chips.g3 .chip{text-align:center;padding:9px 4px;white-space:nowrap}
.opsi-hint{font-size:11.5px;color:var(--ink-faint);line-height:1.5}
.stepper{display:flex;align-items:center;gap:9px;background:var(--surface-2);border-radius:13px;padding:4px}
.stepper button{width:29px;height:29px;border-radius:9px;background:var(--surface);display:grid;place-items:center;font-size:17px;font-weight:700;line-height:1;box-shadow:var(--shadow-s)}
.stepper .v{min-width:26px;text-align:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}

.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding:10px 2px 0}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .fill{width:100%;max-width:30px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,var(--emerald-3),color-mix(in srgb,var(--emerald-3) 45%,transparent));transition:height .9s var(--ease);min-height:5px}
.bars .lb{font-size:10px;color:var(--ink-faint);font-weight:600}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat .c{aspect-ratio:1;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:9.5px;color:var(--ink-faint);font-weight:600}
.heat .c.l1{background:color-mix(in srgb,var(--emerald-3) 22%,transparent)}
.heat .c.l2{background:color-mix(in srgb,var(--emerald-3) 45%,transparent);color:var(--ink)}
.heat .c.l3{background:color-mix(in srgb,var(--emerald-3) 72%,transparent);color:#fff}
.heat .c.l4{background:var(--emerald-3);color:#fff}
.heat .hd{font-size:9.5px;color:var(--ink-faint);text-align:center;font-weight:700;padding-bottom:2px}
.hm{display:grid;grid-template-rows:repeat(7,var(--cs,13px));grid-auto-flow:column;grid-auto-columns:var(--cs,13px);gap:3px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.hm .c{border-radius:4px;background:var(--surface-2)}
.hm .c.l1{background:color-mix(in srgb,var(--emerald-3) 22%,transparent)}.hm .c.l2{background:color-mix(in srgb,var(--emerald-3) 45%,transparent)}
.hm .c.l3{background:color-mix(in srgb,var(--emerald-3) 72%,transparent)}.hm .c.l4{background:var(--emerald-3)}
.stk{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin-top:6px}.stk i{display:block;height:100%}
.lgd{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:var(--ink-faint);font-weight:600;margin-top:8px}
.lgd b{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:4px;vertical-align:baseline}
.rng{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.rng .chip{flex:none}
.ins{display:flex;gap:10px;padding:10px 0;font-size:13px;line-height:1.55;color:var(--ink-soft)}.ins+.ins{border-top:1px solid var(--line-2)}
.ins em{font-style:normal;flex:none;width:22px;height:22px;border-radius:8px;background:var(--mint);display:grid;place-items:center;font-size:12px}
.pl{padding:9px 0}.pl+.pl{border-top:1px solid var(--line-2)}.pl .r{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:600}.pl .r span:last-child{color:var(--ink-soft);font-variant-numeric:tabular-nums;text-align:right}
.pl .sub{font-size:11px;color:var(--ink-faint);font-weight:500;margin-top:2px}
.tb{display:flex;align-items:flex-end;gap:3px;height:118px;padding-top:10px}.tb .b{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.tb .fill{width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--emerald-3),color-mix(in srgb,var(--emerald-3) 45%,transparent))}
.tb .lb{font-size:9.5px;color:var(--ink-faint);font-weight:600;white-space:nowrap}.tb .vl{font-size:9px;color:var(--ink-soft);font-weight:700}

/* ============ TASBIH ============ */
.tasbih{display:grid;place-items:center;gap:16px;padding:8px 0}
.beadbtn{
  width:min(62vw,236px);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,#17705F,#0B3A34 62%,#072320);
  box-shadow:0 22px 50px rgba(11,58,52,.38),inset 0 -8px 22px rgba(0,0,0,.35),inset 0 8px 18px rgba(255,255,255,.14);
  color:#fff;transition:transform .16s var(--ease-2)
}
.beadbtn:active{transform:scale(.955)}
.beadbtn .cnt{font-size:60px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.beadbtn .lb{font-size:12px;opacity:.75;margin-top:2px;font-weight:600}
.beadbtn::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--gold) 55%,transparent);animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:rip .75s var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1.28);opacity:0}}

/* ============ DZIKIR ============ */
.dz{background:var(--surface);border-radius:var(--r-m);padding:16px;box-shadow:var(--shadow-s);margin-bottom:10px}
.dz .ar{font-family:var(--font-ar);font-size:25px;line-height:2.1;direction:rtl;text-align:right;margin-bottom:9px}
.dz .lt{font-size:12.5px;color:var(--emerald-3);font-style:italic;margin-bottom:6px;line-height:1.65}
.dz .id{font-size:13px;color:var(--ink-soft);line-height:1.7}
.dz .ft{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-2)}
.dz .ct{font-size:11.5px;color:var(--ink-faint);font-weight:600}
.dz .btn-c{padding:8px 15px;border-radius:13px;background:var(--mint);color:var(--emerald-3);font-size:12.5px;font-weight:700}
.dz.done{opacity:.6}

/* ============ SETTINGS ============ */
.set{display:flex;align-items:center;gap:13px;padding:15px 4px;border-bottom:1px solid var(--line-2)}
.set:last-child{border-bottom:0}
.set .st{flex:1}
.set .st b{font-size:14.5px;font-weight:600;display:block}
.set .st span{font-size:11.5px;color:var(--ink-faint)}
.switch{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .3s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:var(--shadow-s);transition:transform .34s var(--ease-2)}
.switch.on{background:var(--emerald-3)}
.switch.on::after{transform:translateX(20px)}
select,input[type=text],input[type=number]{
  background:var(--surface-2);border:1px solid var(--line-2);border-radius:13px;padding:10px 12px;
  font-size:13.5px;outline:none;max-width:190px
}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:17px;
  background:var(--emerald);color:#fff;font-size:14.5px;font-weight:700;transition:transform .25s var(--ease-2)
}
html[data-theme="dark"] .btn{background:var(--emerald-3);color:#06120F}
.btn:active{transform:scale(.975)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}
.btn.danger{background:color-mix(in srgb,var(--ruby) 13%,transparent);color:var(--ruby)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============ MISC ============ */
.sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line-2) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:shim 1.5s infinite;border-radius:14px}
@keyframes shim{0%{background-position:100% 0}100%{background-position:-100% 0}}
.empty{text-align:center;padding:44px 22px;color:var(--ink-faint)}
.empty .em{font-size:40px;margin-bottom:10px;opacity:.55}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}
.empty p{font-size:13px;margin:0 0 14px;line-height:1.6}
.load{display:grid;place-items:center;padding:52px 0;gap:12px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--emerald-3);animation:spin .85s linear infinite}
.note{font-size:12px;color:var(--ink-faint);line-height:1.6;padding:10px 4px}
.divider{height:1px;background:var(--line-2);margin:16px 0}
.fade-in{animation:pageIn .45s var(--ease) both}
#splash{position:fixed;inset:0;z-index:300;background:linear-gradient(160deg,#0E4B41,#092B28);display:grid;place-items:center;transition:opacity .6s var(--ease),visibility .6s}
#splash.gone{opacity:0;visibility:hidden}
#splash .l{text-align:center;color:#fff}
#splash .ar{font-family:var(--font-ar);font-size:52px;color:var(--gold-2);animation:sp 1.6s var(--ease) both}
#splash .nm{font-size:19px;font-weight:700;letter-spacing:.16em;margin-top:6px;animation:sp 1.6s .15s var(--ease) both}
#splash .tg{font-size:12px;opacity:.6;margin-top:4px;animation:sp 1.6s .3s var(--ease) both}
@keyframes sp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.imsak-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.imsak{border-collapse:collapse;width:100%;min-width:560px;font-size:12px;font-variant-numeric:tabular-nums}
.imsak th,.imsak td{padding:8px 7px;text-align:center;white-space:nowrap;border-top:1px solid var(--line-2)}
.imsak th{font-size:10.5px;color:var(--ink-faint);font-weight:700;border-top:0}
.imsak td:first-child,.imsak th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;font-weight:700}
.imsak td.kunci{font-weight:700;color:var(--emerald-3)}
.imsak tr.hari-ini td{background:var(--mint)}
@media(min-width:640px){:root{--ar-size:32px}}
</style>
</head>

const HIJRI_BULAN=["Muharram","Safar","Rabiul Awal","Rabiul Akhir","Jumadil Awal","Jumadil Akhir","Rajab","Sya'ban","Ramadhan","Syawal","Dzulkaidah","Dzulhijjah"];
let HIJRI_CAL=null;
function kalenderHijri(){
  if(HIJRI_CAL)return HIJRI_CAL;
  for(const ca of ["islamic-umalqura","islamic"]){
    try{new Intl.DateTimeFormat("en-US-u-ca-"+ca,{day:"numeric",month:"numeric",year:"numeric"}).format(new Date());HIJRI_CAL=ca;return ca;}
    catch(e){}
  }
  return (HIJRI_CAL="islamic-umalqura");
}
/** Pecah tanggal Masehi menjadi {y,m,d} Hijriah (m: 1=Muharram … 12=Dzulhijjah). null jika kalender tak didukung peramban. */
function hijriYMD(date){
  try{
    const k=(typeof SET!=="undefined"&&SET.koreksiHijri)||0; // koreksi -2..+2 hari agar cocok dengan penetapan pemerintah
    if(k)date=new Date(date.getTime()+k*864e5);
    const parts=new Intl.DateTimeFormat("en-US-u-ca-"+kalenderHijri(),{day:"numeric",month:"numeric",year:"numeric"}).formatToParts(date);
    const g=t=>+((parts.find(p=>p.type===t)||{}).value||0);
    const y=g("year"),m=g("month"),d=g("day");
    return (y&&m&&d)?{y,m,d}:null;
  }catch(e){return null;}
}
function hijri(d){
  const h=hijriYMD(d);
  return h?`${h.d} ${HIJRI_BULAN[h.m-1]} ${h.y} H`:"";
}
/** Cari tanggal Masehi yang jatuh pada Hijriah {yTarget,mTarget,dTarget}, dimulai pencarian dari sekitar 'mulaiDari'.
    Dipoles dengan menggeser hari demi hari memakai kalender Hijriah asli peramban, bukan tabel perkiraan,
    supaya konsisten dengan tanggal Hijriah yang ditampilkan di aplikasi. */
function tanggalDariHijri(yTarget,mTarget,dTarget,mulaiDari){
  let acuan=new Date((mulaiDari||new Date()).getTime());
  for(let it=0;it<8;it++){
    const h=hijriYMD(acuan); if(!h)return null;
    if(h.y===yTarget&&h.m===mTarget&&h.d===dTarget)return acuan;
    const bedaBulan=(yTarget-h.y)*12+(mTarget-h.m);
    const bedaHari=bedaBulan*29.53+(dTarget-h.d);
    if(Math.abs(bedaHari)<0.5)break;
    acuan=new Date(acuan.getTime()+Math.round(bedaHari)*864e5);
  }
  for(let k=-4;k<=4;k++){
    const cand=new Date(acuan.getTime()+k*864e5);
    const h=hijriYMD(cand);
    if(h&&h.y===yTarget&&h.m===mTarget&&h.d===dTarget)return cand;
  }
  return acuan; // perkiraan cadangan bila pemolesan gagal (sangat jarang)
}
/** Status Ramadhan/hari besar untuk sebuah tanggal Masehi. */
function statusHijriTanggal(date){
  const h=hijriYMD(date); if(!h)return {h:null};
  const dalamRamadhan=h.m===9, isIdulFitri=h.m===10&&h.d===1, isIdulAdha=h.m===12&&h.d===10,
        isTasyrik=h.m===12&&h.d>=11&&h.d<=13, isArafah=h.m===12&&h.d===9,
        isTasua=h.m===1&&h.d===9, isAsyura=h.m===1&&h.d===10;
  const puasaHaram=isIdulFitri||isIdulAdha||isTasyrik;
  const labelHaram=isIdulFitri?"Idul Fitri":isIdulAdha?"Idul Adha":isTasyrik?"hari Tasyrik":"";
  return {h,dalamRamadhan,hariKeRamadhan:dalamRamadhan?h.d:0,isIdulFitri,isIdulAdha,isTasyrik,isArafah,isTasua,isAsyura,puasaHaram,labelHaram};
}

/* IndexedDB cache surat */
/** Setiap operasi dibatasi waktu: peramban yang memblokir IndexedDB
    (Safari mode berkas, atau basis data lama yang terkunci tab lain)
    tidak boleh membuat antarmuka ikut membeku. */
function batasWaktu(pr,ms,cadangan){
  return Promise.race([Promise.resolve(pr).catch(()=>cadangan),new Promise(r=>setTimeout(()=>r(cadangan),ms))]);
}
const IDB=(()=>{
  let dbp=null;
  function open(){
    if(dbp)return dbp;
    dbp=new Promise((res,rej)=>{
      if(!("indexedDB" in window))return rej("no-idb");
      let r;
      try{r=indexedDB.open("nuur-db",2);}catch(e){return rej("idb-error");}
      const batal=setTimeout(()=>rej("idb-timeout"),4000);
      r.onupgradeneeded=e=>{const db=e.target.result;
        if(!db.objectStoreNames.contains("surah"))db.createObjectStore("surah");
        if(!db.objectStoreNames.contains("tafsir"))db.createObjectStore("tafsir");
        if(!db.objectStoreNames.contains("meta"))db.createObjectStore("meta");};
      r.onblocked=()=>{clearTimeout(batal);rej("idb-blocked");};
      r.onsuccess=e=>{clearTimeout(batal);res(e.target.result);};
      r.onerror=()=>{clearTimeout(batal);rej("idb-error");};
    });
    dbp.catch(()=>{});
    return dbp;
  }
  function jalan(store,mode,fn,cadangan){
    return batasWaktu((async()=>{
      try{
        const db=await open();
        return await new Promise(res=>{
          let tx;
          try{tx=fn(db.transaction(store,mode).objectStore(store));}catch(e){return res(cadangan);}
          tx.onsuccess=()=>res(tx.result===undefined?cadangan:tx.result);
          tx.onerror=()=>res(cadangan);
        });
      }catch(e){return cadangan;}
    })(),3000,cadangan);
  }
  return {
    get:(store,key)=>jalan(store,"readonly",o=>o.get(String(key)),null),
    set:(store,key,val)=>jalan(store,"readwrite",o=>o.put(val,String(key)),false),
    keys:store=>jalan(store,"readonly",o=>o.getAllKeys(),[]),
    clear:store=>jalan(store,"readwrite",o=>o.clear(),false)
  };
})();

const D2R=Math.PI/180,R2D=180/Math.PI;
const dsin=d=>Math.sin(d*D2R),dcos=d=>Math.cos(d*D2R),dtan=d=>Math.tan(d*D2R);
const dasin=x=>R2D*Math.asin(x),dacos=x=>R2D*Math.acos(x),datan2=(y,x)=>R2D*Math.atan2(y,x),dacot=x=>R2D*Math.atan(1/x);
const fixA=a=>{a=a-360*Math.floor(a/360);return a<0?a+360:a;};
const fixH=a=>{a=a-24*Math.floor(a/24);return a<0?a+24:a;};
function julian(y,m,d){if(m<=2){y--;m+=12;}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;}
function sunPos(jd){
  const D=jd-2451545.0;
  const g=fixA(357.529+0.98560028*D), q=fixA(280.459+0.98564736*D);
  const L=fixA(q+1.915*dsin(g)+0.020*dsin(2*g));
  const e=23.439-0.00000036*D;
  const dec=dasin(dsin(e)*dsin(L));
  let RA=fixH(datan2(dcos(e)*dsin(L),dcos(L))/15);
  return {dec,eqt:q/15-RA};
}
/** Hitung waktu salat untuk tanggal & koordinat tertentu. Kembalian: {key: jam desimal lokal} */
function hitungJadwalLokal(date,lat,lng,opt){
  const m=METHODS[opt.method]||METHODS.kemenag;
  const tz=-date.getTimezoneOffset()/60;
  const jd0=julian(date.getFullYear(),date.getMonth()+1,date.getDate())-lng/(15*24);
  const midDay=t=>fixH(12-sunPos(jd0+t/24).eqt);
  function angleTime(t,angle,ccw){
    const dec=sunPos(jd0+t/24).dec;
    let v=(-dsin(angle)-dsin(dec)*dsin(lat))/(dcos(dec)*dcos(lat));
    v=clamp(v,-1,1);
    const V=dacos(v)/15;
    return midDay(t)+(ccw?-V:V);
  }
  function asrTime(t,factor){
    const dec=sunPos(jd0+t/24).dec;
    return angleTime(t,-dacot(factor+dtan(Math.abs(lat-dec))),false);
  }
  let t={fajr:5,sunrise:6,dhuhr:12,asr:13,sunset:18,isha:18};
  for(let i=0;i<3;i++){
    t.fajr=angleTime(t.fajr,m.fajr,true);
    t.sunrise=angleTime(t.sunrise,0.833,true);
    t.dhuhr=midDay(t.dhuhr);
    t.asr=asrTime(t.asr,opt.asrFactor||1);
    t.sunset=angleTime(t.sunset,0.833,false);
    t.isha=(m.isha!=null)?angleTime(t.isha,m.isha,false):t.sunset+(m.ishaMin/60);
  }
  const adj=tz-lng/15, ih=(opt.ihtiyati==null?m.ihtiyati:opt.ihtiyati)/60;
  const out={
    imsak:t.fajr+adj-10/60+ih, subuh:t.fajr+adj+ih, syuruq:t.sunrise+adj-ih,
    dhuha:t.sunrise+adj+(opt.dhuhaMin||20)/60, zuhur:t.dhuhr+adj+ih,
    ashar:t.asr+adj+ih, maghrib:t.sunset+adj+ih, isya:t.isha+adj+ih
  };
  const night=(out.subuh+24)-out.maghrib;
  out.tengahMalam=fixH(out.maghrib+night/2);
  out.sepertigaAkhir=fixH(out.maghrib+night*2/3);
  return out;
}

async function eqApi(path,body){
  const coba=async m=>{
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
    try{
      const r=await fetch(EQ_API+path,m==="POST"?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{}),signal:ctl.signal}:{signal:ctl.signal});
      if(!r.ok)throw new Error("HTTP "+r.status);
      const j=await r.json(); if(j.code&&j.code!==200)throw new Error(j.message||"gagal"); return j;
    }finally{clearTimeout(to);}
  };
  if(body)return coba("POST");
  try{return await coba("GET");}catch(e){return await coba("POST");}
}
const _STOP=new Set(["daerah","khusus","ibukota","istimewa","d","i","dki","di","provinsi","kabupaten","kab","kota","adm","administrasi"]);

const tipeNama=n=>/^\s*kota/i.test(n)?"kota":"kab";
function cariNama(daftar,raw){
  const key=nrmWil(raw); if(!key)return null;
  return daftar.find(n=>nrmWil(n)===key)||daftar.find(n=>{const k=nrmWil(n);return k.length>=4&&key.length>=4&&(k.includes(key)||key.includes(k));})||null;
}
/** Koordinat -> (provinsi, kabupaten/kota) sesuai penamaan Bimas Islam. */
async function cocokWilayah(lat,lng){
  const d=await reverseOSM(lat,lng);
  if(!d||!d.address)throw new Error("Nama wilayah tidak terbaca. Periksa internet atau pilih wilayah manual.");
  const a=d.address;
  if(!LIST_PROV)LIST_PROV=(await eqApi("/provinsi")).data;
  const prov=cariNama(LIST_PROV,a.state||a.province);
  if(!prov)throw new Error("Provinsi tidak cocok, pilih wilayah manual.");
  if(!LIST_KAB[prov])LIST_KAB[prov]=(await eqApi("/kabkota",{provinsi:prov})).data;
  const daftar=LIST_KAB[prov];
  const cands=[[a.county,"kab"],[a.regency,"kab"],[a.city,"kota"],[a.state_district,"kab"],[a.municipality,"kota"],[a.city_district,"kota"]].filter(c=>c[0]);
  for(const pass of [0,1]) for(const [raw,def] of cands){
    const t=/^\s*kota\b/i.test(raw)?"kota":/^\s*kab/i.test(raw)?"kab":def, key=nrmWil(raw); if(!key)continue;
    const m=daftar.filter(n=>{const k=nrmWil(n);return pass===0?k===key:(k.length>=4&&key.length>=4&&(k.includes(key)||key.includes(k)));});
    if(m.length)return {prov,kab:m.find(n=>tipeNama(n)===t)||m[0]};
  }
  throw new Error("Kabupaten/kota tidak cocok, pilih wilayah manual.");
}

    const skr=lokasi(); if(Math.abs(skr.lat-L.lat)>1e-6||Math.abs(skr.lng-L.lng)>1e-6)return; // lokasi keburu diganti

}

function salatBerikutnya(){
  const now=new Date(), hNow=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
  const j=jadwalHariIni(now);
  const urut=PRAYERS.map(p=>({k:p.k,nama:p.nama,h:j[p.k]}));
  for(const p of urut) if(p.h>hNow) return {...p,sisa:(p.h-hNow)*3600,besok:false};
  const bsk=new Date(now.getTime()+864e5);
  const j2=hitungJadwal(bsk,lokasi().lat,lokasi().lng,{method:SET.method,asrFactor:SET.asrFactor,ihtiyati:SET.ihtiyati,dhuhaMin:SET.dhuhaMin});

}

  const j=jadwalHariIni(now); let cur="isya";

/** Rentang [mulai,selesai] (jam desimal, bisa >24 utk Isya yg tembus tengah malam) untuk salat k pada tanggal dt. */
function jendelaSalat(k,dt){
  const j=jadwalHariIni(dt);
  const urut=["subuh","zuhur","ashar","maghrib","isya"];
  const i=urut.indexOf(k), mulai=j[k];
  let selesai;
  if(k==="subuh")selesai=j.syuruq;
  else if(k==="isya"){
    const L=lokasi(), bsk=new Date(dt.getTime()+864e5);
    const j2=hitungJadwal(bsk,L.lat,L.lng,{method:SET.method,asrFactor:SET.asrFactor,ihtiyati:SET.ihtiyati,dhuhaMin:SET.dhuhaMin});
    selesai=j2.subuh+24;
  }else selesai=j[urut[i+1]];
  return {mulai,selesai};
}

  {k:"awal",label:"Di awal waktu",cls:"md"},
  {k:"tepat",label:"Tepat waktu",cls:""},

/** Tentukan level ketepatan berdasar jam pelaksanaan (desimal) dibanding jendela waktu salat k pada tanggal dt. */
function levelKetepatan(k,jamDesimal,dt){
  const {mulai,selesai}=jendelaSalat(k,dt);
  let jam=jamDesimal;
  if(k==="isya"&&jam<mulai)jam+=24; // catat lewat tengah malam
  if(jam<mulai)jam=mulai; // jaga-jaga: tak mungkin sebelum masuk waktu
  const total=Math.max(selesai-mulai,1/60), lewat=jam-mulai;
  if(lewat>total)return LEVEL_WAKTU[3];
  const frac=lewat/total;
  if(lewat<=0.25||frac<=0.12)return LEVEL_WAKTU[0];
  if(frac<=0.75)return LEVEL_WAKTU[1];
  return LEVEL_WAKTU[2];
}

const KAABA={lat:21.4225,lng:39.8262};
function arahKiblat(lat,lng){
  const dL=(KAABA.lng-lng)*D2R, la1=lat*D2R, la2=KAABA.lat*D2R;
  const y=Math.sin(dL), x=Math.cos(la1)*Math.tan(la2)-Math.sin(la1)*Math.cos(dL);
  return fixA(Math.atan2(y,x)*R2D);
}
function jarakKaabah(lat,lng){
  const R=6371, dLat=(KAABA.lat-lat)*D2R, dLng=(KAABA.lng-lng)*D2R;
  const a=Math.sin(dLat/2)**2+Math.cos(lat*D2R)*Math.cos(KAABA.lat*D2R)*Math.sin(dLng/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(a)));
}

const memCache={};
async function ambilSurat(n){
  n=+n;
  if(memCache[n])return memCache[n];
  const cached=await IDB.get("surah",n);
  if(cached&&cached.ayat&&cached.ayat.length){memCache[n]=cached;return cached;}
  let last=null;
  for(const s of SOURCES){
    try{
      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch(s.url(n),{signal:ctl.signal}); clearTimeout(to);
      if(!r.ok)throw new Error("HTTP "+r.status);
      const data=s.parse(await r.json());
      if(data&&data.ayat&&data.ayat.length){memCache[n]=data;IDB.set("surah",n,data);return data;}
    }catch(e){last=e;}
  }
  if(FALLBACK[n]){memCache[n]=FALLBACK[n];return FALLBACK[n];}
  throw last||new Error("Gagal memuat");
}

function go(id,silent){
  if(!$("#pg-"+id))return;

  const el=$("#pg-"+id); el.classList.add("active");
  $$("#navInner button").forEach(b=>b.classList.toggle("on",b.dataset.tab===id));

  $("#nav").classList.toggle("hide",!inNav&&!["kiblat","statistik","pengaturan","dzikir","tasbih","khatam","ramadhan"].includes(id));

function ringHTML(p){
  const c=2*Math.PI*30;
  return `<div class="ring"><svg viewBox="0 0 74 74"><circle class="bg" cx="37" cy="37" r="30"/><circle class="fg" cx="37" cy="37" r="30" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}"/></svg><div class="val">${Math.round(p)}%</div></div>`;
}
function waktuLalu(ts){
  const d=Math.floor((Date.now()-ts)/1000);
  if(d<60)return "baru saja"; if(d<3600)return Math.floor(d/60)+" menit lalu";
  if(d<86400)return Math.floor(d/3600)+" jam lalu"; return Math.floor(d/86400)+" hari lalu";
}
let cdTimer;
function tickCountdown(){
  clearInterval(cdTimer);
  const upd=()=>{
    const el=$("#cd"); if(!el){clearInterval(cdTimer);return;}
    const nx=salatBerikutnya(); let s=Math.max(0,Math.floor(nx.sisa));
    el.textContent=`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)} lagi`;
    if(s<=0){setTimeout(()=>{if(CUR==="beranda")RENDER.beranda();},1500);}
  };
  upd(); cdTimer=setInterval(upd,1000);
}

function fromG(g){g=clamp(g,0,AYAT_TOTAL-1);for(let i=113;i>=0;i--)if(g>=CUM[i])return[i+1,g-CUM[i]+1];return[1,1];}

function petaPerkiraan(){
  const p=new Array(HAL_TOTAL);
  for(let j=0;j<30;j++){
    const awal=JUZ_HAL[j], akhir=(j<29?JUZ_HAL[j+1]-1:HAL_TOTAL), n=akhir-awal+1;
    const g0=gIdx(JUZ[j][0],JUZ[j][1]), g1=(j<29?gIdx(JUZ[j+1][0],JUZ[j+1][1]):AYAT_TOTAL);
    for(let k=0;k<n;k++)p[awal-1+k]=fromG(Math.round(g0+(g1-g0)*k/n));
  }
  return p;
}
/** Peta perkiraan langsung dipakai supaya aplikasi tidak pernah menunggu.
    Peta mushaf asli menyusul di latar belakang lalu dipasang saat aman. */
function muatPeta(){
  if(!PAGES)PAGES=petaPerkiraan();
  if(petaJanji)return petaJanji;
  petaJanji=(async()=>{
    try{
      const c=await IDB.get("meta","pages");
      if(c&&c.peta&&c.peta.length===HAL_TOTAL){pasangPeta(c.peta,!!c.tepat);return PAGES;}
    }catch(e){}
    try{
      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),8000);
      const r=await fetch("https://api.alquran.cloud/v1/meta",{signal:ctl.signal}); clearTimeout(to);
      const j=await r.json();
      const ref=(((j.data||{}).pages||{}).references)||[];
      if(ref.length===HAL_TOTAL){
        const peta=ref.map(x=>[+x.surah,+x.ayah]);
        IDB.set("meta","pages",{peta,tepat:true});
        pasangPeta(peta,true);
      }
    }catch(e){}
    return PAGES;
  })();
  return petaJanji;
}
function pasangPeta(peta,tepat){
  if(!peta||peta.length!==HAL_TOTAL)return;
  if($("#reader")&&$("#reader").classList.contains("open")){petaMenunggu={peta,tepat};return;}
  PAGES=peta; PAGES_TEPAT=tepat; petaMenunggu=null;
}
function petaTertunda(){ if(petaMenunggu){PAGES=petaMenunggu.peta;PAGES_TEPAT=petaMenunggu.tepat;petaMenunggu=null;} }
const halAwal=p=>PAGES[clamp(p,1,HAL_TOTAL)-1];
function halDari(s,a){
  const g=gIdx(s,a||1);
  for(let p=HAL_TOTAL;p>=1;p--){const[ps,pa]=PAGES[p-1];if(gIdx(ps,pa)<=g)return p;}
  return 1;
}
function rentangHal(p){
  const g0=gIdx(...halAwal(p));
  const g1=(p<HAL_TOTAL?gIdx(...halAwal(p+1))-1:AYAT_TOTAL-1);
  return [g0,g1];
}
const juzHal=p=>{let j=1;for(let i=0;i<30;i++)if(p>=JUZ_HAL[i])j=i+1;return j;};
const hizbHal=p=>clamp(Math.floor((p-1)/(HAL_TOTAL/60))+1,1,60);

  R.tujuan=tujuan||"biasa"; R.dariKhatam=R.tujuan==="khatam"; perbaruiLencana();

function keHalaman(p,arah){

function bingkai(p,isi){
  const atas=`<div class="pgtop"><span class="pill">Juz ${juzHal(p)}</span><span class="pill">${R.mode==="mushaf"?"Hizb "+hizbHal(p):"Halaman "+p}</span></div>`;

const sedangMuat=`<div class="load"><div class="spin"></div><div id="muatHint" style="font-size:12.5px;color:var(--ink-faint);text-align:center;max-width:250px"></div></div>`;
async function gambarHalaman(p,arah){
  const stage=$("#pstage"); if(!stage)return;
  R.page=p; R.ayat=[]; hentikanHitungBaca(); perbaruiTombolTandai();
  $("#rprog").style.width=(p/HAL_TOTAL*100)+"%";
  const [g0,g1]=rentangHal(p);
  const sAwal=fromG(g0)[0], sAkhir=fromG(g1)[0];
  $("#rTitle").textContent=SURAH[sAwal-1].nama+(sAkhir!==sAwal?" – "+SURAH[sAkhir-1].nama:"");
  $("#rSub").textContent=`Halaman ${p} • Juz ${juzHal(p)} • Hizb ${hizbHal(p)}`;
  // rangka halaman muncul seketika; isinya menyusul
  stage.innerHTML=`<div class="pcard ${arah>0?"masukKanan":arah<0?"masukKiri":""}" id="pcard">${bingkai(p,sedangMuat)}</div>`;
  pasangGeser();
  const sesi=++R.sesi;
  const hint=setTimeout(()=>{const h=$("#muatHint");if(h)h.textContent="Masih mengunduh surat di halaman ini — pastikan internet aktif.";},2500);
  let data={};
  try{ for(let x=sAwal;x<=sAkhir;x++) data[x]=await ambilSurat(x); }
  catch(e){
    clearTimeout(hint); if(sesi!==R.sesi)return;
    const body=$("#pgBody"); if(!body)return;
    body.innerHTML=`<div class="empty"><div class="em">📡</div><b>Halaman ${p} belum tersimpan</b>
      <p>Sambungkan internet sekali agar surat di halaman ini terunduh, lalu bisa dibaca kapan saja tanpa internet.</p>
      <button class="btn" style="max-width:220px;margin:0 auto" onclick="gambarHalaman(${p},0)">Coba lagi</button></div>`;
    return;
  }
  clearTimeout(hint); if(sesi!==R.sesi)return;
  for(let g=g0;g<=g1;g++){
    const [x,a]=fromG(g); const d=data[x]; if(!d)continue;
    const ay=d.ayat.find(v=>+v.nomorAyat===a); if(ay)R.ayat.push({s:x,a,...ay});
  }
  const body=$("#pgBody"); if(!body)return;
  body.innerHTML=isiHalaman();
  if(R.mode==="mushaf")requestAnimationFrame(paskanTeks);
  tandaiLastReadDOM();
  if(R.target){const t=fromG(R.target);const el=$(`#ay-${t[0]}-${t[1]}`);if(el){el.classList.add("sel");setTimeout(()=>el.classList.remove("sel"),2400);}}
  mulaiHitungBaca(p);
}
/** Hitung detik halaman terbuka. Hanya berjalan saat layar aplikasi terlihat, dan mulai dari nol tiap pindah halaman. */
function hentikanHitungBaca(){clearInterval(R.timerBaca);R.timerBaca=null;}
function mulaiHitungBaca(p){
  hentikanHitungBaca(); R.detikBaca=0;
  if(R.tujuan==="simak")return; // menyimak: tidak ada yang dicatat
  R.timerBaca=setInterval(()=>{
    if(document.hidden||R.page!==p||R.tujuan==="simak")return;
    R.detikBaca++;
    if(R.detikBaca>=WAKTU_BACA_OTOMATIS){
      hentikanHitungBaca();
      if(R.tujuan==="khatam")catatBaca(p,false,"khatam");
      else{catatBaca(p,false,"biasa");simpanPosisiHal();}
      perbaruiTombolTandai();
    }
  },1000);
}
function isiHalaman(){
  let html="";
  if(R.mode==="mushaf"){
    let buf="";
    R.ayat.forEach(ay=>{
      const baru=(ay.a===1);
      if(baru){
        if(buf){html+=`<div class="flow">${buf}</div>`;buf="";}
        html+=kepalaSurat(ay.s);
        if(ay.s!==1&&ay.s!==9)html+=`<div class="bismillah">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</div>`;
      }
      let t=ay.teksArab;
      if(baru&&ay.s!==1&&ay.s!==9)t=t.replace(/^\s*بِسْمِ\s*اللّٰهِ\s*الرَّحْمٰنِ\s*الرَّحِيْمِ\s*/,"");
      buf+=`<span class="ayah" id="ay-${ay.s}-${ay.a}" data-s="${ay.s}" data-a="${ay.a}" onclick="ketukAyat(${ay.s},${ay.a})">${esc(t)}<span class="anum">﴿${toAr(ay.a)}﴾</span></span> `;
    });
    if(buf)html+=`<div class="flow">${buf}</div>`;
    return html;
  }
  R.ayat.forEach(ay=>{
    if(ay.a===1){html+=`<div style="text-align:center;padding:10px 0 4px"><div style="font-family:var(--font-ar);font-size:24px;color:var(--ruby)">سُورَةُ ${esc(SURAH[ay.s-1].ar)}</div>
      <div style="font-size:11.5px;color:var(--ink-faint)">${esc(SURAH[ay.s-1].nama)} — ${esc(SURAH[ay.s-1].arti)}</div></div>`;
      if(ay.s!==1&&ay.s!==9)html+=`<div class="bismillah" style="border:0;padding-bottom:8px">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</div>`;}
    const marked=MARKS.some(m=>m.s===ay.s&&m.a===ay.a);
    html+=`<div class="tcard" id="ay-${ay.s}-${ay.a}" data-s="${ay.s}" data-a="${ay.a}">
      <div class="hd"><span class="bdg">${ay.s}:${ay.a}</span><div class="acts">
        <button onclick="putarAyat(${ay.s},${ay.a})">${svg(IC.play)}</button>
        <button class="${marked?"on":""}" onclick="toggleTanda(${ay.s},${ay.a},this)">${svg(IC.bookmark)}</button>
        <button onclick="salinAyat(${ay.s},${ay.a})">${svg(IC.copy)}</button>
        <button onclick="ketukAyat(${ay.s},${ay.a})">${svg(IC.list)}</button></div></div>
      <div class="ar" onclick="ketukAyat(${ay.s},${ay.a})">${esc(ay.teksArab)}</div>
      ${SET.showLatin&&ay.teksLatin?`<div class="lt">${esc(ay.teksLatin)}</div>`:""}
      ${SET.showTrans?`<div class="id">${esc(ay.teksIndonesia)}</div>`:""}</div>`;
  });
  return html;
}
function kepalaSurat(s){
  const i=SURAH[s-1];
  return `<div class="sheader">${ornamenHead()}
    <div class="nm-ar">سُورَةُ ${esc(i.ar)}</div>
    <div class="nm-id">${esc(i.nama)} — ${esc(i.arti)} • ${esc(i.tempat)} • ${i.ayat} ayat</div></div>`;
}
function paskanTeks(){
  const body=$("#pgBody"); if(!body)return;
  let size=SET.arSize+2, lh=SET.arLine, guard=0;
  const pasang=()=>{body.style.fontSize=size+"px";body.style.lineHeight=String(lh);};
  pasang();
  while(body.scrollHeight>body.clientHeight+1&&guard++<90){
    if(size>13)size-=1; else if(lh>1.7)lh=+(lh-0.08).toFixed(2); else break;
    pasang();
  }
  guard=0;
  while(body.scrollHeight<=body.clientHeight-16&&size<SET.arSize+10&&guard++<24){
    size+=1;pasang();
    if(body.scrollHeight>body.clientHeight+1){size-=1;pasang();break;}
  }
  body.classList.toggle("bisaGulir",body.scrollHeight>body.clientHeight+1);
}
/* ---------- geser halaman ---------- */
function pasangGeser(){
  const stage=$("#pstage"), card=$("#pcard"); if(!stage||!card)return;
  let x0=null,y0=null,dx=0,geser=false;
  const bisaGulirVertikal=()=>R.mode!=="mushaf"||card.querySelector(".bisaGulir");
  stage.ontouchstart=e=>{if(e.touches.length!==1)return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;geser=false;};
  stage.ontouchmove=e=>{
    if(x0==null)return;
    const cx=e.touches[0].clientX,cy=e.touches[0].clientY;
    if(!geser&&Math.abs(cx-x0)>14&&Math.abs(cx-x0)>Math.abs(cy-y0)*1.4)geser=true;
    if(!geser)return;
    dx=cx-x0; card.style.transition="none";
    card.style.transform=`translateX(${dx*.55}px) rotateY(${-dx*.014}deg)`;
    card.style.opacity=String(clamp(1-Math.abs(dx)/520,.45,1));
  };
  stage.ontouchend=()=>{
    if(x0==null)return; const d=dx; x0=null;
    card.style.transition=""; card.style.transform=""; card.style.opacity="";
    if(geser&&Math.abs(d)>56){ if(d<0)keHalaman(R.page+1,1); else keHalaman(R.page-1,-1); }
  };
}

/* ---------- AUDIO ---------- */
const player=$("#player"); let queue=[],qi=0;
function putarAyat(s,a){queue=[[s,a]];qi=0;mainkan();}
function togglePlay(){
  if(!player.paused){stopAudio();return;}
  queue=R.ayat.map(x=>[x.s,x.a]); qi=0; mainkan();
}
function mainkan(){
  if(qi>=queue.length){
    stopAudio();
    if(SET.autoScrollAudio&&R.page<HAL_TOTAL&&queue.length>1){keHalaman(R.page+1,1).then(()=>setTimeout(togglePlay,500));}
    return;
  }
  const [s,a]=queue[qi];
  const ay=R.ayat.find(x=>x.s===s&&x.a===a);
  player.src=(ay&&ay.audio&&ay.audio["05"])?(ay.audio[SET.qari]||ay.audio["05"]):audioUrl(s,a);
  player.play().then(()=>{
    $$(".playing").forEach(e=>e.classList.remove("playing"));
    const el=$(`#ay-${s}-${a}`); if(el)el.classList.add("playing");
    $("#playLbl").textContent="Jeda"; $("#btnPlay").firstElementChild.innerHTML=IC.pause;
  }).catch(()=>{toast("Audio perlu internet");stopAudio();});
}
player.addEventListener("ended",()=>{qi++;mainkan();});
function stopAudio(){
  try{player.pause();}catch(e){}
  $$(".playing").forEach(e=>e.classList.remove("playing"));
  const l=$("#playLbl"); if(l){l.textContent="Putar"; $("#btnPlay").firstElementChild.innerHTML=IC.play;}
}

/* ======================= KHATAM ======================= */
let KHATAM=LS.get("khatam",null);
if(!KHATAM)KHATAM={mulai:today(),targetHari:30,read:{},riwayat:[]};
const khSimpan=()=>LS.set("khatam",KHATAM);
/* KHATAM.read[halaman] = tanggal baca (YYYY-MM-DD) atau "pra" bila ditandai selesai dari bacaan sebelum memakai aplikasi.
   Halaman "pra" ikut menghitung kemajuan khatam, tetapi bukan jatah hari ini dan bukan statistik tilawah. */
function khProgress(){
  const vals=Object.values(KHATAM.read), done=vals.length, pra=vals.filter(v=>v==="pra").length;
  const mulai=new Date(KHATAM.mulai+"T00:00:00");
  const lewat=Math.max(1,Math.floor((new Date(today()+"T00:00:00")-mulai)/864e5)+1);
  const sisaHari=Math.max(0,KHATAM.targetHari-lewat+1);
  const sisaHal=HAL_TOTAL-done;
  const hariIni=vals.filter(v=>v===today()).length;
  const kuota=sisaHari>0?Math.ceil((sisaHal+hariIni)/sisaHari):sisaHal+hariIni; // dihitung dari sisa di awal hari, jadi tidak menyusut saat membaca
  return {done,pra,sisaHal,lewat,sisaHari,kuota,hariIni,persen:done/HAL_TOTAL*100};
}
const khAdaBacaanNyata=()=>Object.values(KHATAM.read).some(v=>v!=="pra");
function khArsipParsial(){
  if(khAdaBacaanNyata()){const pr=khProgress();KHATAM.riwayat.unshift({mulai:KHATAM.mulai,selesai:today(),hari:pr.lewat,parsial:true,awal:pr.pra});}
}
/** Catat halaman p yang dibaca. Tilawah harian: sekali per halaman per hari (tujuan khatam dan biasa).
    Khatam: hanya bila tujuan "khatam", sekali per halaman per putaran. Mode menyimak tidak pernah sampai sini. */
function catatBaca(p,manual,tujuan){
  const k=today(), d=getDay(k);
  const sudahHariIni=d.halaman.includes(p)||KHATAM.read[p]===k;
  if(!sudahHariIni){d.halaman.push(p);d.tilawah=(d.tilawah||0)+1;simpanDay(k,d);}
  if(tujuan==="khatam"){
    const baru=!KHATAM.read[p];
    if(baru)KHATAM.read[p]=k;
    KHATAM.posisi=p; khSimpan();
    const pr=khProgress();
    if(pr.done>=HAL_TOTAL){selesaiKhatam();return;}
    if(baru&&pr.hariIni===pr.kuota&&pr.kuota>0){buzz([20,60,20]);toast(`Target khatam hari ini tercapai: ${pr.hariIni} halaman`);return;}
    if(manual||baru)toast(baru?`Halaman ${p} dicatat untuk khatam • ${pr.done}/${HAL_TOTAL}`:`Halaman ${p} sudah tercatat di khatam`);
    return;
  }
  if(manual)toast(sudahHariIni?`Halaman ${p} sudah tercatat hari ini`:`Halaman ${p} dicatat terbaca • ${d.tilawah} halaman hari ini`);
  else if(!sudahHariIni)toast(`Halaman ${p} tercatat terbaca`);
}
function selesaiKhatam(){
  KHATAM.riwayat.unshift({mulai:KHATAM.mulai,selesai:today(),hari:khProgress().lewat,awal:khProgress().pra});
  KHATAM.read={}; KHATAM.posisi=0; KHATAM.mulai=today(); khSimpan(); buzz([40,80,40,80,40]);
  toast("Alhamdulillah, khatam! Putaran baru dimulai.");
}
RENDER.khatam=function(){

    juzs.push({j:j+1,n,t:b-a+1,a});
  }
  const nyata=pr.done-pr.pra; // laju hanya dari halaman yang benar-benar dibaca di aplikasi
  const laju=nyata/Math.max(1,pr.lewat);

  $("#pg-khatam").innerHTML=backHeader("Target khatam",`Mulai ${tglID(new Date(KHATAM.mulai+"T00:00:00"))}`,"lainnya")+
  `<div class="wrap">

        ${pr.pra?`<div style="font-size:11.5px;color:var(--ink-faint);margin-top:4px">Termasuk ${pr.pra} halaman bacaan sebelumnya</div>`:""}
        ${perkiraan?`<div style="font-size:11.5px;color:var(--ink-faint);margin-top:4px">Dengan laju ${laju.toFixed(1)} halaman/hari, khatam sekitar ${perkiraan} hari lagi</div>`:""}
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div><div style="font-size:12px;color:var(--ink-faint);font-weight:600">Jatah hari ini</div>
          <div style="font-size:26px;font-weight:800;letter-spacing:-.04em">${pr.hariIni} / ${pr.kuota} halaman</div></div>
        <button class="chip on" onclick="lanjutKhatam()">Lanjut baca • hal. ${khHalamanLanjut()}</button>
      </div>
      <div style="height:9px;border-radius:99px;background:var(--surface-2);margin-top:10px;overflow:hidden">
        <div style="height:100%;width:${clamp(pr.hariIni/Math.max(1,pr.kuota)*100,0,100)}%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--emerald-3));transition:width 1s var(--ease)"></div></div>
      <div class="note" style="padding:8px 0 0">Hanya halaman yang dibaca lewat tombol Lanjut baca di sini yang masuk khatam. Membaca dari tab Qur'an dihitung bacaan biasa, dan mode Menyimak tidak mencatat apa pun. Halaman tercatat otomatis setelah terbuka 90 detik, atau langsung lewat tombol Tandai.</div>
    </div>
    <div class="sec-title"><h2>Atur target</h2></div>
    <div class="card">
      <div class="set"><div class="st"><b>Lama khatam</b><span>${KHATAM.targetHari} hari • ${Math.ceil((HAL_TOTAL-pr.pra)/KHATAM.targetHari)} halaman sehari</span></div>
        <select onchange="setTargetKhatam(+this.value)">
          ${[7,10,15,20,30,40,60,90,120,180,365].map(v=>`<option value="${v}" ${KHATAM.targetHari===v?"selected":""}>${v} hari</option>`).join("")}</select></div>
      <div class="set"><div class="st"><b>Mulai dari tengah</b><span>Sudah membaca sebagian di luar aplikasi</span></div>
        <button class="chip on" onclick="bukaKhatamTengah()">Atur</button></div>
      <div class="set"><div class="st"><b>Mulai putaran baru</b><span>Progres sekarang disimpan ke riwayat</span></div>
        <button class="chip ruby on" onclick="mulaiKhatamBaru()">Mulai</button></div>
    </div>
    <div class="sec-title"><h2>Peta juz</h2></div>
    <div class="card"><div class="heat kh-grid">
      ${juzs.map(x=>{const p=x.n/x.t;const l=p>=1?"l4":p>=.66?"l3":p>=.33?"l2":p>0?"l1":"";
        return `<button class="c ${l}" style="border-radius:12px;font-size:12.5px;font-weight:700" onclick="bukaHalaman(${x.a},'khatam')">${x.j}</button>`;}).join("")}
    </div><div class="note" style="padding:10px 0 0">Ketuk nomor juz untuk membuka halaman awalnya. Warna makin pekat berarti makin banyak halaman terbaca.</div></div>
    ${KHATAM.riwayat.length?`<div class="sec-title"><h2>Riwayat khatam</h2></div>
      <div class="card">${KHATAM.riwayat.map((r,i)=>`<div style="display:flex;justify-content:space-between;padding:10px 0;${i?"border-top:1px solid var(--line-2)":""}">
        <div><b style="font-size:14px">Khatam ke-${KHATAM.riwayat.length-i}</b>
          <div style="font-size:11.5px;color:var(--ink-faint)">${r.mulai} → ${r.selesai}${r.awal?` • mulai dari halaman ${r.awal+1}`:""}</div></div>
        <span class="tag md">${r.hari} hari</span></div>`).join("")}</div>`:""}
  </div>`;
};
function setTargetKhatam(v){KHATAM.targetHari=v;khSimpan();RENDER.khatam();toast(`Target ${v} hari • ${Math.ceil((HAL_TOTAL-khProgress().pra)/v)} halaman sehari`);}
function mulaiKhatamBaru(){
  khArsipParsial();
  KHATAM.read={};KHATAM.posisi=0;KHATAM.mulai=today();khSimpan();RENDER.khatam();toast("Putaran khatam baru dimulai");
}
/* ---------- mulai khatam dari tengah ---------- */
let KHT={mode:"halaman",hal:1,juz:1,surat:1,ayat:1};
/** Semua cara input diubah menjadi satu angka: halaman tempat Anda melanjutkan. Halaman sebelumnya = sudah selesai. */
function halamanLanjutKh(){
  if(KHT.mode==="halaman")return clamp(Math.round(+KHT.hal)||1,1,HAL_TOTAL);
  if(KHT.mode==="juz")return JUZ_HAL[clamp(+KHT.juz||1,1,30)-1];
  const s=clamp(+KHT.surat||1,1,114), a=clamp(Math.round(+KHT.ayat)||1,1,SURAH[s-1].ayat);
  muatPeta(); return halDari(s,a);
}
function bukaKhatamTengah(){
  muatPeta();
  let p=1; while(p<HAL_TOTAL&&KHATAM.read[p])p++;
  KHT={mode:"halaman",hal:p,juz:1,surat:1,ayat:1};
  const nyata=khAdaBacaanNyata();
  openSheet("Mulai khatam dari tengah",
   `<div style="font-size:13px;line-height:1.7;color:var(--ink-soft);padding-bottom:10px">Sudah membaca sebagian di luar aplikasi? Tentukan dari mana Anda melanjutkan. Semua halaman sebelumnya ditandai selesai untuk khatam, tetapi tidak dihitung sebagai tilawah hari ini.</div>
    <div class="opsi"><div class="opsi-lbl">Tentukan lewat</div>
      <div class="chips g3" id="khMode">
        <button class="chip on" data-m="halaman" onclick="setModeKh('halaman')">Halaman</button>
        <button class="chip" data-m="juz" onclick="setModeKh('juz')">Juz</button>
        <button class="chip" data-m="surat" onclick="setModeKh('surat')">Surat</button></div></div>
    <div id="khField" style="padding:12px 0 4px"></div>
    <div class="note" id="khPrev" style="padding:6px 2px 10px"></div>
    <div style="display:grid;gap:9px">
      <button class="btn" onclick="terapkanKhTengah(false)">${nyata?"Tambahkan ke putaran ini":"Tandai selesai dan mulai dari sini"}</button>
      ${nyata?`<button class="btn ghost" onclick="terapkanKhTengah(true)">Mulai putaran baru dari sini</button>`:""}
    </div>`);
  isiFieldKh(); pratinjauKhTengah();
}
function setModeKh(m){
  KHT.mode=m; $$("#khMode .chip").forEach(c=>c.classList.toggle("on",c.dataset.m===m));
  isiFieldKh(); pratinjauKhTengah();
}
function isiFieldKh(){
  const box=$("#khField"); if(!box)return;
  const lbl=t=>`<div class="opsi-lbl" style="margin-bottom:6px">${t}</div>`;
  if(KHT.mode==="halaman"){
    box.innerHTML=lbl("Lanjut dari halaman (1–"+HAL_TOTAL+")")+
      `<input type="number" inputmode="numeric" min="1" max="${HAL_TOTAL}" value="${esc(KHT.hal)}" style="width:100%;max-width:none" oninput="KHT.hal=this.value;pratinjauKhTengah()">`;
  }else if(KHT.mode==="juz"){
    box.innerHTML=lbl("Lanjut dari awal juz")+
      `<select style="width:100%;max-width:none" onchange="KHT.juz=+this.value;pratinjauKhTengah()">${Array.from({length:30},(_,i)=>`<option value="${i+1}" ${KHT.juz===i+1?"selected":""}>Juz ${i+1}</option>`).join("")}</select>`;
  }else{
    const mx=SURAH[KHT.surat-1].ayat;
    box.innerHTML=lbl("Lanjut dari surat dan ayat")+
      `<div style="display:flex;gap:8px">
        <select style="flex:1;min-width:0;max-width:none" onchange="KHT.surat=+this.value;KHT.ayat=1;isiFieldKh();pratinjauKhTengah()">${SURAH.map(s=>`<option value="${s.n}" ${KHT.surat===s.n?"selected":""}>${s.n}. ${esc(s.nama)}</option>`).join("")}</select>
        <input type="number" inputmode="numeric" min="1" max="${mx}" value="${esc(KHT.ayat)}" style="width:88px;max-width:none" oninput="KHT.ayat=this.value;pratinjauKhTengah()"></div>
       <div class="note" style="padding:6px 0 0">Ayat 1–${mx}</div>`;
  }
}
function pratinjauKhTengah(){
  const el=$("#khPrev"); if(!el)return;
  const P=halamanLanjutKh();
  if(P<=1){el.textContent="Belum ada halaman yang ditandai. Pilih posisi lanjutan setelah halaman 1.";return;}
  let baru=0,sisa=0;
  for(let p=1;p<=HAL_TOTAL;p++){ if(!KHATAM.read[p]){ if(p<P)baru++; else sisa++; } }
  const [s,a]=halAwal(P);
  el.innerHTML=`Halaman 1–${P-1} ditandai selesai${baru<P-1?` (${baru} halaman baru, sisanya sudah tercatat)`:""}.<br>Anda lanjut dari halaman <b>${P}</b>: ${esc(SURAH[s-1].nama)} ayat ${a}, Juz ${juzHal(P)}. Sisa ${sisa} halaman menuju khatam.${PAGES_TEPAT?"":"<br>Batas halaman masih perkiraan sampai peta mushaf terunduh."}`;
}
function terapkanKhTengah(putaranBaru){
  const P=halamanLanjutKh();
  if(P<=1){toast("Mulai dari halaman 1: belum ada yang perlu ditandai");return;}
  if(putaranBaru){khArsipParsial();KHATAM.read={};KHATAM.mulai=today();}
  else if(!khAdaBacaanNyata())KHATAM.mulai=today(); // belum ada bacaan nyata: jadwal target dihitung mulai hari ini
  for(let p=1;p<P;p++)if(!KHATAM.read[p])KHATAM.read[p]="pra";
  KHATAM.posisi=P-1; // "Lanjut baca" langsung menuju halaman P // halaman yang sudah tercatat tanggalnya tidak ditimpa
  khSimpan(); closeSheet(); RENDER.khatam();
  toast(`Halaman 1–${P-1} ditandai selesai • lanjut dari halaman ${P}`); buzz(14);
}
/** Lanjut khatam: halaman belum terbaca berikutnya setelah posisi khatam terakhir (berputar ke awal bila perlu).
    Tidak terkait "terakhir dibaca" milik bacaan biasa. */
function khHalamanLanjut(){
  const mulai=KHATAM.posisi||0;
  for(let i=1;i<=HAL_TOTAL;i++){const p=((mulai+i-1)%HAL_TOTAL)+1; if(!KHATAM.read[p])return p;}
  return 1;
}
function lanjutKhatam(){muatPeta(); petaTertunda(); bukaHalaman(khHalamanLanjut(),"khatam");}

async function cariWilayah(q){

/** Ubah koordinat menjadi nama desa/kelurahan, kecamatan, kabupaten/kota, provinsi
    lewat reverse-geocoding OpenStreetMap Nominatim. Perlu internet; gagal-diam ke null
    kalau offline/diblokir supaya jadwal salat (yang cuma butuh angka lat/lng) tetap jalan. */
/** Susun "desa, kecamatan, kabupaten/kota, provinsi" dari alamat OpenStreetMap. */
function susunNamaAlamat(a,display){
  const desa=a.village||a.hamlet||a.suburb||a.neighbourhood||a.town||a.quarter;
  const kec=a.city_district||a.subdistrict||a.district||a.municipality||a.town_district;
  const kab=a.county||a.regency||a.city||a.state_district;
  const bagian=[desa,kec,kab,a.state].filter((v,i,arr)=>v&&arr.indexOf(v)===i);
  if(bagian.length)return bagian.join(", ");
  return display?display.split(",").slice(0,4).join(",").trim():null;
}
const _rev={};
function reverseOSM(lat,lng){
  const k=lat+","+lng;
  if(!_rev[k])_rev[k]=(async()=>{
    try{
      const ctrl=new AbortController(); const batal=setTimeout(()=>ctrl.abort(),9000);
      const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=16&addressdetails=1&accept-language=id`,{signal:ctrl.signal,headers:{"Accept":"application/json"}});
      clearTimeout(batal); if(!res.ok)return null; return await res.json();
    }catch(e){return null;}
  })().then(d=>{if(!d)delete _rev[k];return d;});
  return _rev[k];
}
async function namaWilayah(lat,lng){const d=await reverseOSM(lat,lng);return d?susunNamaAlamat(d.address||{},d.display_name):null;}
function deteksiLokasi(){
  if(!navigator.geolocation){toast("Perangkat tidak mendukung GPS");return;}
  if(location.protocol==="file:"){toast("Deteksi GPS tidak jalan saat berkas dibuka langsung — buka lewat https:// atau pasang sebagai aplikasi, lalu coba lagi");return;}
  const btn=$("#btnDeteksi"); if(btn)btn.style.opacity=".6";
  toast("Mencari sinyal GPS…");
  let terbaik=null, watchId=null, selesai=false;
  const berhenti=()=>{if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;} if(btn)btn.style.opacity="";};
  const pakaiHasil=(pos)=>{
    if(selesai)return; selesai=true; berhenti();
    const lat=pos.coords.latitude, lng=pos.coords.longitude, akurasi=pos.coords.accuracy;
    SET.coords={lat,lng,nama:"Lokasi saat ini",akurasi}; SET.lokasiOtomatis=false; saveSet(); closeSheet(); segarkanSemua(); ambilJadwalResmi();
    toast(akurasi?`Lokasi didapat (±${Math.round(akurasi)} m) — mencari nama wilayah…`:"Lokasi didapat — mencari nama wilayah…");
    namaWilayah(lat,lng).then(nama=>{
      if(!SET.coords||SET.coords.lat!==lat||SET.coords.lng!==lng)return; // lokasi sudah diganti user
      if(nama){SET.coords.nama=nama;saveSet();segarkanSemua();toast("Lokasi: "+nama);}
      else toast("Koordinat tersimpan, tapi nama wilayah tidak terbaca (mungkin koneksi internet terputus)");
    });
  };
  const gagal=(err)=>{
    if(selesai)return; selesai=true; berhenti(); if(CUR==="pengaturan")RENDER.pengaturan();
    const pesan={1:"Izin lokasi ditolak — aktifkan izin lokasi untuk halaman ini di peramban lalu coba lagi",
                 2:"Lokasi tidak terbaca — pastikan GPS & internet perangkat aktif",
                 3:"Pencarian lokasi lama — coba lagi di ruang terbuka dengan sinyal GPS lebih baik"};
    toast((err&&pesan[err.code])||"Lokasi gagal dideteksi — pilih kota saja");
  };
  // Pantau beberapa pembacaan GPS beberapa detik dan pakai yang paling akurat,
  // supaya tidak berhenti di titik pertama yang meleset jauh.
  try{
    watchId=navigator.geolocation.watchPosition(pos=>{
      if(!terbaik||pos.coords.accuracy<terbaik.coords.accuracy)terbaik=pos;
      if(pos.coords.accuracy<=30)pakaiHasil(pos); // sudah cukup akurat (≤30 m), langsung pakai
    },gagal,{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  }catch(e){gagal(null);return;}
  setTimeout(()=>{ if(!selesai){ if(terbaik)pakaiHasil(terbaik); else gagal({code:3}); } },10000);
}
function segarkanSemua(){if(RENDER[CUR])RENDER[CUR]();}
/** Ikuti lokasi perangkat secara otomatis: saat aplikasi dibuka dan tiap kembali ke aplikasi (maks. tiap 15 menit).
    Koordinat baru dipakai bila bergeser >= 2 km, agar jadwal tidak berubah-ubah karena selisih GPS kecil. */
let lokasiCek=0;
function jarakKm(a,b){const R=6371,dl=(b.lat-a.lat)*D2R,dg=(b.lng-a.lng)*D2R;
  const x=Math.sin(dl/2)**2+Math.cos(a.lat*D2R)*Math.cos(b.lat*D2R)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function namaLokasiOtomatis(lat,lng,umumkan){

    SET.coords.nama=nama; saveSet(); segarkanSemua(); if(umumkan)toast("Lokasi diperbarui: "+nama);
  });
}

function dialSvg(){
