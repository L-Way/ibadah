/* ---------- Gambar: kompres otomatis ----------
   Semua gambar unggahan (foto profil & latar) dipotong dari tengah sesuai rasio, dikecilkan bertahap, lalu mutu JPEG
   diturunkan sampai ukurannya di bawah batas. Batas dipilih agar tiap catatan sinkronisasi tetap di bawah 64 KB. */
const PF_FOTO_OPT={lebar:192,tinggi:192,skala:[1,.8,.6],batas:38000};
const PF_BG_OPT={lebar:640,tinggi:400,skala:[1,.8,.62,.5],batas:50000};
const PF_BG_PRESET=[{id:"",nama:"Zamrud"},{id:"p1",nama:"Senja"},{id:"p2",nama:"Malam"},{id:"p3",nama:"Geometri"},{id:"p4",nama:"Samudra"},{id:"p5",nama:"Gurun"},{id:"p6",nama:"Masjid"}];
function pfKompres(f,o,area){
  return new Promise((ok,gagal)=>{
    if(!f||!/^image\//.test(f.type)){gagal(new Error("tipe"));return;}
    if(f.size>40*1024*1024){gagal(new Error("besar"));return;}
    const url=URL.createObjectURL(f), im=new Image();
    im.onload=()=>{
      try{
        const W=im.naturalWidth,H=im.naturalHeight, rasio=o.lebar/o.tinggi; if(!W||!H)throw new Error("baca");
        let sw=W,sh=H; if(W/H>rasio)sw=H*rasio; else sh=W/rasio;
        let src=im,cx=(W-sw)/2,cy=(H-sh)/2,cw=sw,ch=sh;
        if(area&&area.w>8&&area.h>8){   // area hasil pemotongan pengguna (koordinat piksel gambar asli)
          cx=Math.max(0,Math.min(W-8,area.x)); cy=Math.max(0,Math.min(H-8,area.y));
          cw=Math.min(W-cx,area.w); ch=Math.min(H-cy,area.h);
        }
        // turunkan separuh demi separuh agar hasil tetap tajam (bukan sekali loncat dari foto belasan megapiksel)
        while(cw/2>=o.lebar&&ch/2>=o.tinggi){
          const t=document.createElement("canvas"); t.width=Math.round(cw/2); t.height=Math.round(ch/2);
          t.getContext("2d").drawImage(src,cx,cy,cw,ch,0,0,t.width,t.height); src=t;cx=0;cy=0;cw=t.width;ch=t.height;
        }
        for(const k of o.skala){
          const w=Math.max(48,Math.round(o.lebar*k)), h=Math.max(30,Math.round(o.tinggi*k));
          const c=document.createElement("canvas"); c.width=w;c.height=h; const g=c.getContext("2d");
          g.imageSmoothingQuality="high"; g.fillStyle="#fff"; g.fillRect(0,0,w,h); g.drawImage(src,cx,cy,cw,ch,0,0,w,h);
          for(let q=.85;q>=.3;q-=.1){const d=c.toDataURL("image/jpeg",q); if(d.length<=o.batas){ok({data:d,w,h});return;}}
        }
        throw new Error("besar");
      }catch(e){gagal(e);}
      finally{URL.revokeObjectURL(url);}
    };
    im.onerror=()=>{URL.revokeObjectURL(url);gagal(new Error("baca"));};
    im.src=url;
  });
}
/** Pemotong gambar: geser, cubit/geser slider untuk memperbesar, lalu "Pakai". Mengembalikan area potong pada gambar asli. */
function pfPotong(f,rasio,bulat,judul){
  return new Promise((ok,gagal)=>{
    if(!f||!/^image\//.test(f.type)){gagal(new Error("tipe"));return;}
    if(f.size>40*1024*1024){gagal(new Error("besar"));return;}
    const url=URL.createObjectURL(f), im=new Image();
    im.onerror=()=>{URL.revokeObjectURL(url);gagal(new Error("baca"));};
    im.onload=()=>{
      const W=im.naturalWidth,H=im.naturalHeight; if(!W||!H){URL.revokeObjectURL(url);gagal(new Error("baca"));return;}
      const ov=document.createElement("div"); ov.className="pf-crop"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-label",judul);
      ov.innerHTML=`<div class="pc-head"><b>${esc(judul)}</b><span>Geser gambar dan cubit atau pakai slider untuk memperbesar</span></div>
        <div class="pc-stage"><canvas></canvas></div>
        <div class="pc-ctl"><span>Kecil</span><input type="range" min="1" max="4" step="0.01" value="1" aria-label="Perbesar"><span>Besar</span></div>
        <div class="pc-btn"><button type="button" class="batal">Batal</button><button type="button" class="ok">Pakai</button></div>`;
      document.body.appendChild(ov);
      const stage=ov.querySelector(".pc-stage"), cv=ov.querySelector("canvas"), sl=ov.querySelector("input"), g=cv.getContext("2d");
      const dpr=Math.min(2,window.devicePixelRatio||1);
      let fw=1,fh=1,smin=1,z=1,ox=0,oy=0;   // ox,oy: pergeseran pusat gambar dari pusat bingkai (piksel layar)
      const ukur=()=>{
        const sw=stage.clientWidth||300, shh=stage.clientHeight||300;
        fw=Math.min(sw,460); fh=fw/rasio; if(fh>shh){fh=shh;fw=fh*rasio;}
        fw=Math.floor(fw); fh=Math.floor(fh);
        cv.style.width=fw+"px"; cv.style.height=fh+"px"; cv.width=Math.round(fw*dpr); cv.height=Math.round(fh*dpr);
        smin=Math.max(fw/W,fh/H); jepit(); gambar();
      };
      const jepit=()=>{
        const s=smin*z, iw=W*s, ih=H*s, mx=Math.max(0,(iw-fw)/2), my=Math.max(0,(ih-fh)/2);
        ox=Math.max(-mx,Math.min(mx,ox)); oy=Math.max(-my,Math.min(my,oy));
      };
      const gambar=()=>{
        const s=smin*z, iw=W*s, ih=H*s, x0=fw/2+ox-iw/2, y0=fh/2+oy-ih/2;
        g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,fw,fh); g.imageSmoothingQuality="high";
        g.drawImage(im,x0,y0,iw,ih);
        g.fillStyle="rgba(0,0,0,.5)"; g.beginPath(); g.rect(0,0,fw,fh);
        if(bulat){const r=Math.min(fw,fh)/2; g.moveTo(fw/2+r,fh/2); g.arc(fw/2,fh/2,r,0,Math.PI*2,true);}
        g.fill("evenodd");
        g.strokeStyle="rgba(255,255,255,.85)"; g.lineWidth=1.5;
        if(bulat){g.beginPath(); g.arc(fw/2,fh/2,Math.min(fw,fh)/2-.75,0,Math.PI*2); g.stroke();}
        else{
          g.strokeRect(.75,.75,fw-1.5,fh-1.5); g.strokeStyle="rgba(255,255,255,.28)"; g.lineWidth=1; g.beginPath();
          for(let i=1;i<3;i++){g.moveTo(fw*i/3,0);g.lineTo(fw*i/3,fh);g.moveTo(0,fh*i/3);g.lineTo(fw,fh*i/3);} g.stroke();
        }
      };
      const setZoom=(nz,px,py)=>{   // zoom dengan titik (px,py) di bingkai tetap diam
        nz=Math.max(1,Math.min(4,nz)); const s0=smin*z, s1=smin*nz, k=s1/s0;
        const cx=(px==null?fw/2:px)-fw/2, cy=(py==null?fh/2:py)-fh/2;
        ox=cx-(cx-ox)*k; oy=cy-(cy-oy)*k; z=nz; sl.value=z; jepit(); gambar();
      };
      sl.addEventListener("input",()=>setZoom(parseFloat(sl.value)));
      cv.addEventListener("wheel",e=>{e.preventDefault();const b=cv.getBoundingClientRect();setZoom(z*(e.deltaY<0?1.08:1/1.08),e.clientX-b.left,e.clientY-b.top);},{passive:false});
      const ptr=new Map(); let jarak0=0,z0=1;
      const jarakPtr=()=>{const a=[...ptr.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
      cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===2){jarak0=jarakPtr();z0=z;}cv.style.cursor="grabbing";});
      cv.addEventListener("pointermove",e=>{
        const p=ptr.get(e.pointerId); if(!p)return;
        if(ptr.size===1){ox+=e.clientX-p.x;oy+=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;jepit();gambar();}
        else{p.x=e.clientX;p.y=e.clientY;if(jarak0>0)setZoom(z0*jarakPtr()/jarak0);}
      });
      const lepas=e=>{ptr.delete(e.pointerId);jarak0=0;if(ptr.size===1){const a=[...ptr.values()][0];a.x=a.x;}cv.style.cursor="grab";};
      cv.addEventListener("pointerup",lepas); cv.addEventListener("pointercancel",lepas);
      const tutup=()=>{window.removeEventListener("resize",ukur);document.removeEventListener("keydown",kunci);ov.remove();URL.revokeObjectURL(url);};
      const kunci=e=>{if(e.key==="Escape"){tutup();gagal(new Error("batal"));}};
      document.addEventListener("keydown",kunci); window.addEventListener("resize",ukur);
      ov.querySelector(".batal").onclick=()=>{tutup();gagal(new Error("batal"));};
      ov.querySelector(".ok").onclick=()=>{
        const s=smin*z, x0=fw/2+ox-W*s/2, y0=fh/2+oy-H*s/2;
        const area={x:Math.max(0,-x0/s),y:Math.max(0,-y0/s),w:Math.min(W,fw/s),h:Math.min(H,fh/s)};
        tutup(); ok(area);
      };
      ukur(); requestAnimationFrame(ukur);
    };
    im.src=url;
  });
}
const pfUkuran=b=>b>=1048576?(b/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(b/1024))+" KB";
const pfUkuranData=d=>pfUkuran(Math.round((d.length-d.indexOf(",")-1)*3/4));
function pfGalatGambar(e){const m=String(e&&e.message); if(m==="batal")return; toast(m==="tipe"?"Pilih berkas gambar":m==="besar"?"Gambar terlalu besar, coba gambar lain":"Gambar tidak bisa dibaca");}

/* ---------- Latar profil ----------
   SET.pBg: "" (bawaan Zamrud) | "p1".."p6" (desain bawaan) | data-URL JPEG (foto unggahan, sudah dikompres).
   Nilai ini ikut tersinkron dari server, jadi hanya bentuk yang dikenal yang diterima. */
function pfBgAman(v){
  if(typeof v!=="string"||!v)return "";
  if(/^p[1-6]$/.test(v))return v;
  return (v.length<60000&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(v))?v:"";
}
function pfHeroBg(v){
  v=pfBgAman(v);
  if(/^p\d$/.test(v))return {cls:"pfbg-"+v,style:""};
  if(v)return {cls:"pfbg-foto",style:`background:linear-gradient(rgba(6,24,20,.28),rgba(6,24,20,.58)),url(${v}) center/cover no-repeat`};
  return {cls:"",style:""};
}
function pfBgTiles(){
  const bg=pfBgAman(PF_TMP.bg), foto=PF_TMP.bgFoto;
  const t=(id,nama,aktif,onk,gaya,cls)=>`<button type="button" class="pf-bgt ${aktif?"on":""}" onclick="${onk}" aria-pressed="${aktif}" aria-label="Latar ${nama}"><i class="${cls}" ${gaya?`style="${gaya}"`:""}></i><span>${nama}</span></button>`;
  const lst=PF_BG_PRESET.map(p=>t(p.id,p.nama,bg===p.id,`pfSetBg('${p.id}')`,"",p.id?"pfbg-"+p.id:"pfbg-z"));
  if(foto)lst.unshift(t("foto","Foto Anda",bg===foto,"pfSetBg('foto')",`background:url(${foto}) center/cover`,""));
  return lst.join("");
}
function pfSetBg(id){
  if(id==="foto"){if(!PF_TMP.bgFoto)return;PF_TMP.bg=PF_TMP.bgFoto;}else PF_TMP.bg=id;
  pfPratinjau();
}
function pfHapusBg(){PF_TMP.bg="";PF_TMP.bgFoto=null;const f=$("#pfBgFile");if(f)f.value="";pfPratinjau();}
function pfPilihBg(inp){
  const f=inp.files&&inp.files[0]; if(!f)return; inp.value="";
  pfPotong(f,PF_BG_OPT.lebar/PF_BG_OPT.tinggi,false,"Atur latar profil").then(a=>{toast("Mengompres gambar…");return pfKompres(f,PF_BG_OPT,a);}).then(r=>{
    if(!PF_TMP)return; if(!pfBgAman(r.data)){toast("Gambar terlalu besar, coba gambar lain");return;}
    PF_TMP.bgFoto=r.data; PF_TMP.bg=r.data; pfPratinjau();
    toast("Latar dikompres: "+pfUkuran(f.size)+" → "+pfUkuranData(r.data));
  }).catch(pfGalatGambar);
}

/* ---------- Latar kartu waktu salat (Beranda) ----------
   SET.hBg: "" (bawaan) | "p1".."p6" (desain yang sama dengan latar profil) | "profil" (ikut latar profil, termasuk foto unggahan). */
function pfHBgAman(v){return (v==="profil"||v==="z"||/^p[1-6]$/.test(v)||/^w-(tahajud|isya|subuh|pagi|zuhur|ashar|maghrib)$/.test(v))?v:"";}
function pfKartuBg(){
  const k=wkKey(), e=wkEvent(k), b=wkBenda(k);
  return {cls:"wk wk-"+k+e.cls,style:`--bx:${b.x}%;--by:${b.y}%`,wk:k,fx:wkFxHTML(),badge:e.badge,sig:k+e.cls+"|"+e.badge};
}
function pfHTiles(){
  const cur=pfHBgAman(PF_TMP.h);
  const t=(id,nama,cls,gaya)=>`<button type="button" class="pf-bgt ${cur===id?"on":""}" onclick="pfSetH('${id}')" aria-pressed="${cur===id}" aria-label="Kartu ${nama}"><i class="${cls}" ${gaya?`style="${gaya}"`:""}></i><span>${nama}</span></button>`;
  const lst=[t("","Otomatis","wk wk-"+wkKey(),""),t("z","Zamrud","pfbg-h0","")].concat(["tahajud","isya","subuh","pagi","zuhur","ashar","maghrib"].map(k=>t("w-"+k,k[0].toUpperCase()+k.slice(1),"wk wk-"+k,""))).concat(PF_BG_PRESET.filter(p=>p.id).map(p=>t(p.id,p.nama,"pfbg-"+p.id,"")));
  const pb=pfHeroBg(PF_TMP.bg); if(pb.cls)lst.push(t("profil","Sama profil",pb.cls,pb.style));
  return lst.join("");
}
function pfSetH(id){PF_TMP.h=pfHBgAman(id);pfPratinjau();}
function pfPratinjau(){
  if(!PF_TMP)return;
  const nm=($("#pfNama")?$("#pfNama").value:"").trim(), n=nm?(PF_TMP.sapaan?PF_TMP.sapaan+" ":"")+nm:"";
  const el=$("#pfPrev"); if(el)el.innerHTML=`<b>Assalamu 'Alaykum</b><span>${esc(salamWaktu()+(n?", "+n:""))}</span>`;
  const av=$("#pfAvSlot"); if(av)av.innerHTML=pfAvatar(64,{nama:nm,foto:PF_TMP.foto,warna:PF_TMP.warna});
  const bp=$("#pfBgPrev"); if(bp){
    const h=pfHeroBg(PF_TMP.bg); bp.className="pf-bgprev "+h.cls; bp.setAttribute("style",h.style);
    bp.innerHTML=pfAvatar(54,{nama:nm,foto:PF_TMP.foto,warna:PF_TMP.warna})+`<b>${esc(n||"Hamba Allah")}</b>`;

/* ======================= SINKRONISASI ANTAR PERANGKAT =======================
   Cara kerja (ringkas):
   - Data dipecah jadi "catatan" kecil: satu salat pada satu hari, satu rawatib, satu penanda ayat, satu
     halaman khatam, satu zikir yang selesai, satu pengaturan. Tiap catatan membawa cap waktu (ts) + id perangkat.
   - Dua perangkat mengubah hal yang BERBEDA -> dua-duanya terpakai (tidak saling menimpa).
     Mengubah hal yang SAMA -> yang terbaru menang (ts, lalu id perangkat sebagai pemutus seri).
   - Penghitung (tilawah, istigfar, selawat, tasbih, total tasbih) disimpan sebagai sumbangan tiap perangkat lalu
     dijumlahkan, jadi hitungan dari ponsel dan tablet tidak saling menghapus.
   - Server menolak catatan yang lebih lama dari miliknya, jadi perangkat yang lama offline tak bisa memundurkan data.
   - Profil (nama, sapaan, warna, foto kecil, motto) ikut disinkronkan sebagai pengaturan biasa.
   - Kalender haid ikut disinkronkan (profil, catatan, qada, mazhab, dan kunci PIN) agar bisa diisi dari perangkat mana pun.
     Pilihan profil yang sedang dibuka ("pilih") dan status terbuka-kunci tetap lokal per perangkat.
   Bagian CORE (di antara penanda) murni fungsi tanpa jaringan, sehingga bisa diuji terpisah. */
//#SYNC-CORE-BEGIN
const SYNC_SET_FIELDS=["method","asrFactor","ihtiyati","dhuhaMin","showLatin","showTrans","qari","targetTilawah","koreksiHijri","malamDariIsya","city","coords","wilayahResmi","pNama","pSapaan","pWarna","pFoto","pMotto","pBg","hBg","notifAkhir"];
const SYNC_COUNTER_DAY=["tilawah","istighfar","shalawat"];
const SYNC_ROOTS=["settings","track","bookmarks","lastread","tasbih","dzikirdone","khatam","haid"];
const syE=encodeURIComponent, syD=decodeURIComponent;
function syStable(v){
  if(v===null||v===undefined||typeof v!=="object")return JSON.stringify(v===undefined?null:v);
  if(Array.isArray(v))return "["+v.map(syStable).join(",")+"]";
  return "{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+syStable(v[k])).join(",")+"}";
}
/** Nilai "kosong" = sama dengan kondisi awal hari kosong; tidak disimpan sebagai catatan (menghemat ribuan baris). */
function syEmpty(v){
  if(v==null||v===false||v===0||v===""||v==="-")return true;
  if(Array.isArray(v))return v.length===0;
  if(typeof v==="object"){const k=Object.keys(v);return k.length===0||(k.length===1&&k[0]==="status"&&v.status==null);}
  return false;
}
const syPrim=v=>v===null||typeof v!=="object";
/** Salinan dalam. Basis tidak boleh berbagi objek dengan keadaan aplikasi: aplikasi sering mengubah objek di tempat
    (mis. Object.assign pada catatan), dan itu akan diam-diam ikut mengubah basis sehingga perubahannya tak pernah terdeteksi. */
const syClone=v=>(v&&typeof v==="object")?JSON.parse(JSON.stringify(v)):v;
/** Keadaan aplikasi -> Map(kunci -> {v, c}); c=true untuk penghitung. live(kunci) = apakah kunci itu sudah ada di basis. */
function syShred(S,live){
  const out=new Map(), put=(k,v,c)=>out.set(k,{v,c:!!c});
  SYNC_SET_FIELDS.forEach(f=>{
    const v=S.SET[f]; if(v===undefined)return; const k="s|"+f;
    // pengaturan yang belum pernah diubah (masih bawaan) tidak ditulis: perangkat baru tidak boleh menimpa pilihan lama
    if(syStable(v)!==syStable((S.DEFAULTS||{})[f])||live(k))put(k,v);
  });
  const T=S.TRACK||{};
  Object.keys(T).forEach(date=>{
    const d=T[date]; if(!d||typeof d!=="object")return; const P="t|"+syE(date)+"|";
    Object.keys(d).forEach(f=>{
      const v=d[f], F=syE(f);
      if(SYNC_COUNTER_DAY.includes(f)){if(typeof v==="number"&&v)put(P+F,v,1);return;}
      if(f==="tsb"&&v&&typeof v==="object"&&!Array.isArray(v)){
        Object.keys(v).forEach(g=>{if(typeof v[g]==="number"&&v[g])put(P+F+"|"+syE(g),v[g],1);});return;}
      if(Array.isArray(v)){
        if(v.every(syPrim))v.forEach(e=>{if(e!=null)put(P+F+"#|"+syE(String(e)),e);});
        else if(v.length)put(P+F,v);
        return;}
      if(v&&typeof v==="object"){Object.keys(v).forEach(g=>{if(!syEmpty(v[g]))put(P+F+"|"+syE(g),v[g]);});return;}
      if(!syEmpty(v))put(P+F,v);
    });
  });
  (S.MARKS||[]).forEach(m=>{if(m&&m.s!=null&&m.a!=null)put("b|"+m.s+":"+m.a,m);});
  if(S.LAST)put("lr",S.LAST);
  const Z=S.DZIKIRDONE||{};
  Object.keys(Z).forEach(date=>{const o=Z[date]||{};Object.keys(o).forEach(tab=>{(o[tab]||[]).forEach(i=>put("z|"+syE(date)+"|"+syE(tab)+"|"+i,true));});});
  const K=S.KHATAM;
  if(K&&typeof K==="object"){
    const used=Object.keys(K.read||{}).length>0||(K.riwayat||[]).length>0||!!K.dikunci||K.targetHari!==30||!!K.posisi;
    Object.keys(K).forEach(f=>{
      if(f==="read"||f==="riwayat"||K[f]===undefined)return; const k="k|m|"+syE(f);
      if(used||live(k))put(k,K[f]);
    });
    Object.keys(K.read||{}).forEach(p=>put("k|r|"+syE(p),K.read[p]));
    (K.riwayat||[]).forEach(r=>{if(r)put("k|w|"+syE([r.mulai,r.selesai,r.gagal?1:0,r.batal?1:0].join("~")),r);});
  }
  const H=S.HAID;
  if(H&&typeof H==="object"){
    const mdef={mazhab:"syafii",pin:null,beranda:false};
    Object.keys(mdef).forEach(f=>{const v=H[f]; if(v===undefined)return; const k="h|m|"+f; if(syStable(v)!==syStable(mdef[f])||live(k))put(k,v);});
    (H.orang||[]).forEach(o=>{
      if(!o||o.id==null)return; const id=syE(o.id);
      put("h|o|"+id,{nama:o.nama,relasi:o.relasi,warna:o.warna,hamil:!!o.hamil});
      Object.keys(o.qada||{}).forEach(y=>{const n=Number(o.qada[y])||0; if(n)put("h|q|"+id+"|"+syE(y),n,1);});
    });
    Object.keys(H.catat||{}).forEach(oid=>{(H.catat[oid]||[]).forEach(r=>{if(r&&r.id!=null)put("h|c|"+syE(oid)+"|"+syE(r.id),r);});});
  }
  if(S.TASBIH&&S.TASBIH.total)put("tt",S.TASBIH.total,1);
  return out;
}
const syAt=rk=>rk.lastIndexOf("@");               // catatan penghitung: "<kunci>@<perangkat>"
const syBase=rk=>syAt(rk)>0?rk.slice(0,syAt(rk)):rk;
/** Basis (semua catatan) -> Map(kunci logis -> {v,c}); penghitung dijumlahkan lintas perangkat. */
function syLogical(B){
  const L=new Map();
  for(const rk in B.rec){
    const r=B.rec[rk]; if(r.del)continue;
    if(syAt(rk)>0){const k=syBase(rk),m=L.get(k)||{v:0,c:true};m.v+=Number(r.v)||0;L.set(k,m);}
    else L.set(rk,{v:r.v,c:false});
  }
  return L;
}
/** Bandingkan keadaan aplikasi dengan basis; perubahan lokal dicatat sebagai catatan baru (p=1 menunggu kirim). */
function syDiff(B,S,dev,now,mode){
  const timpa=mode==="timpa";   // "timpa": samakan akun dengan perangkat ini (dipakai bila pengguna memilih data perangkat)
  const live=timpa?(()=>false):(k=>{const r=B.rec[k];return !!(r&&!r.del);});
  const cur=syShred(S,live), L=syLogical(B), ch=[];
  const stamp=(rk,v,del)=>{const ts=Math.max(now,B.rec[rk]?B.rec[rk].ts+1:0);B.hlc=Math.max(B.hlc,ts);B.rec[rk]={v:del?null:syClone(v),ts,dev,del:!!del,p:1};ch.push(rk);};
  const own=rk=>{const r=B.rec[rk];return r&&!r.del?Number(r.v)||0:0;};
  cur.forEach((c,k)=>{
    const m=L.get(k);
    if(c.c){const mv=m?m.v:0; if(c.v!==mv){const rk=k+"@"+dev;stamp(rk,own(rk)+c.v-mv,false);}}
    else if(!m||syStable(m.v)!==syStable(c.v))stamp(k,c.v,false);
  });
  L.forEach((m,k)=>{
    if(cur.has(k))return;
    if(timpa&&/^(s\||k\|m\||h\|m\|)/.test(k))return;   // pengaturan yang masih bawaan di perangkat ini tidak menghapus pilihan di akun
    if(m.c){if(m.v!==0){const rk=k+"@"+dev;stamp(rk,own(rk)-m.v,false);}}
    else stamp(k,null,true);
  });
  return ch;
}
const syNewer=(ts,dev,r)=>!r||ts>r.ts||(ts===r.ts&&dev>r.dev);
function syGroupOf(rk){const p=syBase(rk).split("|");return (p[0]==="t"||p[0]==="z")?p[0]+"|"+p[1]:p[0];}
/** Gabungkan baris dari server ke basis. Mengembalikan kelompok data yang berubah. */
function syMerge(B,rows){
  const g=new Set();
  rows.forEach(w=>{
    const r=B.rec[w.key]; B.hlc=Math.max(B.hlc,w.ts);
    if(r&&r.ts===w.ts&&r.dev===w.device){delete r.p;return;}       // gema kiriman sendiri: sudah di server
    if(syNewer(w.ts,w.device,r)){B.rec[w.key]={v:w.deleted?null:syClone(w.value),ts:w.ts,dev:w.device,del:!!w.deleted};g.add(syGroupOf(w.key));}
  });
  return g;
}
/** Tulis hasil gabungan dari basis kembali ke keadaan aplikasi, hanya untuk kelompok yang berubah. */
function syApply(B,S,groups){
  const L0=syLogical(B), L=new Map(), bucket={}, touched=new Set();
  L0.forEach((m,k)=>L.set(k,{v:syClone(m.v),c:m.c}));          // nilai untuk keadaan aplikasi selalu salinan
  L.forEach((m,k)=>{(bucket[syGroupOf(k)]=bucket[syGroupOf(k)]||[]).push([k,m]);});
  groups.forEach(g=>{
    const p=g.split("|"), items=bucket[g]||[];
    if(p[0]==="s"){
      SYNC_SET_FIELDS.forEach(f=>{const m=L.get("s|"+f); if(m)S.SET[f]=m.v; else if(B.rec["s|"+f])S.SET[f]=(S.DEFAULTS||{})[f];});
      touched.add("settings");
    }else if(p[0]==="t"){
      const date=syD(p[1]), pre="t|"+p[1]+"|", day={};
      items.forEach(([k,m])=>{
        const q=k.slice(pre.length).split("|").map(syD), f=q[0];
        if(f.endsWith("#")){const F=f.slice(0,-1);(day[F]=day[F]||[]).push(m.v);}
        else if(q.length===2)(day[f]=day[f]||{})[q[1]]=m.v;
        else day[f]=m.v;
      });
      Object.keys(day).forEach(f=>{if(Array.isArray(day[f])&&day[f].every(x=>typeof x==="number"))day[f].sort((a,b)=>a-b);});
      if(items.length)S.TRACK[date]=day; else delete S.TRACK[date];
      touched.add("track");
    }else if(p[0]==="b"){
      S.MARKS=items.map(([k,m])=>m.v).sort((a,b)=>(a.ts||0)-(b.ts||0));
      touched.add("bookmarks");
    }else if(p[0]==="lr"){
      const m=L.get("lr"); S.LAST=m?m.v:null; touched.add("lastread");
    }else if(p[0]==="z"){
      const date=syD(p[1]), o={};
      items.forEach(([k,m])=>{const q=k.split("|").map(syD);(o[q[2]]=o[q[2]]||[]).push(Number(q[3]));});
      Object.keys(o).forEach(t=>o[t].sort((a,b)=>a-b));
      if(items.length)S.DZIKIRDONE[date]=o; else delete S.DZIKIRDONE[date];
      touched.add("dzikirdone");
    }else if(p[0]==="k"){
      const K=S.KHATAM, meta={}, read={}, riw=[];
      items.forEach(([k,m])=>{const q=k.split("|").map(syD); if(q[1]==="m")meta[q[2]]=m.v; else if(q[1]==="r")read[q[2]]=m.v; else if(q[1]==="w")riw.push(m.v);});
      Object.keys(B.rec).forEach(rk=>{if(rk.startsWith("k|m|")&&B.rec[rk].del)delete K[syD(rk.slice(4))];});
      Object.assign(K,meta); K.read=read;
      riw.sort((a,b)=>String(b.selesai).localeCompare(String(a.selesai))||String(b.mulai).localeCompare(String(a.mulai)));
      K.riwayat=riw; touched.add("khatam");
    }else if(p[0]==="h"){
      const H=S.HAID, mdef={mazhab:"syafii",pin:null,beranda:false}, orang={}, qada={}, catat={};
      Object.keys(mdef).forEach(f=>{const m=L.get("h|m|"+f); if(m)H[f]=m.v; else if(B.rec["h|m|"+f])H[f]=mdef[f];});
      items.forEach(([k,m])=>{
        const q=k.split("|").map(syD);
        if(q[1]==="o")orang[q[2]]=Object.assign({id:q[2],qada:{}},m.v);
        else if(q[1]==="q")(qada[q[2]]=qada[q[2]]||{})[q[3]]=Math.max(0,Number(m.v)||0);
        else if(q[1]==="c")(catat[q[2]]=catat[q[2]]||[]).push(m.v);
      });
      Object.keys(orang).forEach(id=>{orang[id].qada=qada[id]||{};});
      H.orang=Object.keys(orang).sort().map(id=>orang[id]);
      H.catat={}; Object.keys(orang).forEach(id=>{H.catat[id]=(catat[id]||[]);});
      touched.add("haid");
    }else if(p[0]==="tt"){
      const m=L.get("tt"); S.TASBIH.total=m?m.v:0; touched.add("tasbih");
    }
  });
  return touched;
}
const syPending=B=>Object.keys(B.rec).filter(k=>B.rec[k].p);
/** Penggabungan saat PERTAMA kali perangkat ini masuk ke sebuah akun (data lokal belum pernah disinkronkan ke akun itu).
    Aturan: data yang SUDAH ADA di akun tidak pernah ditimpa. Data lokal hanya ditambahkan bila akun belum punya kuncinya.
    Bila kunci yang sama berbeda isi: yang waktu ubahnya diketahui dan lebih baru menang, selain itu data akun dipakai.
    Penghitung dijumlahkan: bila perangkat ini baru bagi akun, hitungan lokal ditambahkan ke hitungan akun; bila perangkat
    ini pernah ada di akun (masuk lagi setelah keluar), hanya selisihnya yang ditambahkan agar tidak terhitung dua kali.
    Mengembalikan {g: kelompok yang perlu diterapkan ke aplikasi, naik: jumlah catatan lokal yang akan dikirim}. */
function syGabungAwal(B,S,rows,dev,now,lt){
  const g=syMerge(B,rows);
  const adaDev=rows.some(w=>{const i=syAt(w.key);return i>0&&w.key.slice(i+1)===dev;});
  const cur=syShred(S,()=>false);                       // pengaturan bawaan tidak ditulis: jangan menimpa pilihan di akun
  const L=syLogical(B); let naik=0;
  const stamp=(rk,v)=>{const ts=Math.max(now,B.rec[rk]?B.rec[rk].ts+1:0);B.hlc=Math.max(B.hlc,ts);B.rec[rk]={v:syClone(v),ts,dev,del:false,p:1};naik++;};
  cur.forEach((c,k)=>{
    if(c.c){
      const rk=k+"@"+dev, r=B.rec[rk], own=r&&!r.del?Number(r.v)||0:0, m=L.get(k), mv=m?m.v:0;
      const nv=adaDev?own+c.v-mv:c.v;
      if(nv!==own)stamp(rk,nv);
    }else if(!B.rec[k])stamp(k,c.v);                    // akun belum punya kunci ini: tambahkan data lokal
    else{
      // Kunci yang sama ada di dua tempat dengan isi berbeda. Data akun menang, KECUALI waktu ubah data lokal diketahui
      // (lt) dan jelas lebih baru dari catatan akun. Tanpa waktu yang pasti, data akun tidak ditimpa.
      const r=B.rec[k];
      if(lt&&!r.del&&syStable(r.v)!==syStable(c.v)){const t=lt(k,c.v); if(t&&t>r.ts){stamp(k,c.v);}}
    }
  });
  return {g,naik};
}
//#SYNC-CORE-END

/** Jam yang dipakai untuk cap waktu catatan: jam perangkat dikoreksi dengan selisihnya terhadap jam server,
    supaya perangkat yang jamnya maju/mundur tidak selalu menang atau kalah. */
function syNow(){return Date.now()+(SYNC.off||0);}
/** Ukur selisih jam perangkat dengan server (fungsi sync_time di Supabase). Bila fungsi itu belum dipasang atau
    sedang offline, selisih terakhir yang tersimpan tetap dipakai. */
async function syncUkurJam(){
  try{
    const t0=Date.now();
    const {data,error}=await SYNC.sb.rpc("sync_time");
    const t1=Date.now();
    if(error||data==null)return;
    const srv=Number(data); if(!isFinite(srv)||srv<1e12)return;
    const off=Math.round(srv-(t0+t1)/2);
    if(Math.abs(off)>3e11)return;
    SYNC.off=off; SYNC.offT=Date.now(); LS.set("sync:off",off);
  }catch(e){}
}
function syHash(t){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return h;}
/** Catat KAPAN tiap pengaturan terakhir diubah di perangkat ini (dipakai saat menentukan data mana yang lebih baru). */
function syCatatUbahSet(diam){
  try{
    const prev=LS.get("sync:setsnap",null), mt=LS.get("sync:mt",{}), now=syNow(), snap={}; let ubah=false;
    SYNC_SET_FIELDS.forEach(f=>{
      const h=syHash(syStable(SET[f]===undefined?null:SET[f])); snap[f]=h;
      if(!diam&&prev&&prev[f]!==undefined&&prev[f]!==h){mt["s|"+f]=now;ubah=true;}
    });
    LS.set("sync:setsnap",snap); if(ubah)LS.set("sync:mt",mt);
  }catch(e){}
}
/** Waktu ubah (jam terkoreksi) sebuah data lokal bila diketahui; 0 bila tidak diketahui. */
function syWaktuLokal(k,v){
  const off=SYNC.off||0;
  if(k==="lr"||k.startsWith("b|"))return (v&&v.ts)?v.ts+off:0;
  if(k.startsWith("s|"))return ((LS.get("sync:mt",{})||{})[k]||0);
  return 0;
}

async function syncPush(){
  let keys=syPending(SYNC.B);
  for(let i=0;i<keys.length;i+=400){
    const part=keys.slice(i,i+400).map(k=>{const r=SYNC.B.rec[k];return {key:k,value:r.del?null:r.v,deleted:!!r.del,ts:r.ts,device:r.dev,_:r.ts};});
    const {error}=await SYNC.sb.rpc("sync_push",{p_records:part.map(({_,...x})=>x)});
    if(error)throw error;
    part.forEach(x=>{const r=SYNC.B.rec[x.key]; if(r&&r.ts===x._)delete r.p;});
    syncSimpanBasis();
  }
}
/** Hanya mengambil baris baru dari server (jaringan); penggabungan dilakukan terpisah dan serempak dengan penerapan. */
async function syncAmbil(){
  let cur=LS.get("sync:cur",0), baris=[];
  for(;;){
    const {data,error}=await SYNC.sb.from("sync_records").select("key,value,deleted,ts,device,seq").gt("seq",cur).order("seq",{ascending:true}).limit(1000);
    if(error)throw error;
    if(!data||!data.length)break;
    baris.push(...data.map(w=>({...w,ts:Number(w.ts),seq:Number(w.seq)})));
    cur=Math.max(cur,...data.map(w=>Number(w.seq)));
    if(data.length<1000)break;
  }
  return {baris,cur};
}

/** Menjalankan penggabungan pertama sesuai mode: "gabung" (bawaan), "akun" (pakai data akun saja), "perangkat" (samakan akun dengan perangkat). */
async function syncGabungAwalProses(D,mode){
  const now=syNow(), uid=SYNC.user.id;
  const ada=syShred(syncState(),()=>false).size>0;
  if(ada){
    const ok=syCadSimpan();
    if(!ok&&mode==="akun")throw new Error("Cadangan data perangkat gagal disimpan. Unduh cadangan dulu, lalu coba lagi.");
  }
  let naik=0;
  if(mode==="akun"){
    kosongkanDataLokal(true);                       // data perangkat diganti sepenuhnya dengan isi akun
    const g=syMerge(SYNC.B,D.baris);
    if(g.size)syncApplyToApp(g);
  }else if(mode==="perangkat"){
    syMerge(SYNC.B,D.baris);                        // pelajari isi akun agar catatan yang lebih lama tidak mengalahkan data perangkat
    naik=syDiff(SYNC.B,syncState(),SYNC.dev,now,"timpa").length;
    syncApplyToApp(new Set(["s","k","h"]));         // pengaturan akun yang dilindungi dipakai juga di sini, agar tidak tertimpa nilai bawaan perangkat
  }else{
    const h=syGabungAwal(SYNC.B,syncState(),D.baris,SYNC.dev,now,syWaktuLokal);
    if(h.g.size)syncApplyToApp(h.g);
    naik=h.naik;
  }
  LS.set("sync:cur",D.cur); syncSimpanBasis(); LS.del("sync:awal"); LS.set("sync:owner",uid);
  return {naik};
}
async function syncPilih(mode,yakin){
  const P=SYNC.pilih; if(!P||!SYNC.user)return;
  if(mode==="perangkat"&&!yakin){syncSheetPilih("timpa");return;}
  if(SYNC.busy){toast("Sedang menyinkronkan, coba lagi sebentar");return;}
  SYNC.busy=true; closeSheet(); syncStatus("sinkron");
  try{
    const D=await syncAmbil();                      // ambil ulang: isi akun mungkin berubah sejak pertanyaan muncul
    await syncGabungAwalProses(D,mode);
    SYNC.pilih=null;
    toast(mode==="akun"?"Perangkat ini kini memakai data akun":mode==="perangkat"?"Akun disamakan dengan data perangkat ini":"Data perangkat ini digabung dengan akun Anda");
  }catch(e){
    syncStatus("pilih"); toast(syncPesanGalat(e));
  }finally{SYNC.busy=false;}
  if(!SYNC.pilih)syncSoon(0);
}
async function syncRun(){
  clearTimeout(SYNC.t);
  if(!SYNC.sb||!SYNC.user)return;
  if(SYNC.busy){SYNC.again=true;return;}
  SYNC.busy=true; syncStatus("sinkron");
  try{
    if(!SYNC.offT||Date.now()-SYNC.offT>600000)await syncUkurJam();
    if(LS.get("sync:awal",false)){                     // masuk pertama ke akun ini: gabungkan dulu, jangan menimpa data akun
      if(SYNC.pilih){syncStatus("pilih");return;}      // menunggu pilihan pengguna
      const D=await syncAmbil();
      const nLokal=syShred(syncState(),()=>false).size;
      const owner=LS.get("sync:owner",null), asing=!!(owner&&owner!==SYNC.user.id);
      if(nLokal>0&&(D.baris.length>0||asing)){
        // Ada dua sisi yang sama-sama berisi (atau data lokal milik akun lain): jangan menggabung diam-diam, tanyakan dulu
        const akun=new Set(); D.baris.forEach(w=>{if(!w.deleted)akun.add(syBase(w.key));});
        SYNC.pilih={uid:SYNC.user.id,asing,nLokal,nAkun:akun.size};
        syncStatus("pilih"); syncSheetPilih(); return;
      }
      const h=await syncGabungAwalProses(D,"gabung");
      if(D.baris.length||h.naik)toast("Data perangkat ini digabung dengan akun Anda");
    }
    do{
      SYNC.again=false;
      syncLocalDiff();
      await syncPush();
      const {baris,cur}=await syncAmbil();
      // Tiga langkah ini HARUS berurutan tanpa jeda jaringan: (1) catat ubahan lokal yang terjadi selagi menunggu,
      // (2) gabungkan data server, (3) terapkan ke aplikasi. Mencatat ubahan setelah (2) akan salah menganggap
      // data dari perangkat lain sebagai "dihapus di sini".
      const baru=syncLocalDiff();
      const berubah=syMerge(SYNC.B,baris);
      if(berubah.size)syncApplyToApp(berubah);
      LS.set("sync:cur",cur); syncSimpanBasis();
      if(baru.length)SYNC.again=true;       // ubahan baru itu belum terkirim: putaran berikutnya
    }while(SYNC.again);
    SYNC.last=Date.now(); LS.set("sync:last",SYNC.last); syncStatus("ok");
  }catch(e){
    const off=!navigator.onLine||/fetch|network|Failed|load/i.test(String(e&&e.message));
    console.warn("sinkron gagal",e); syncStatus(off?"offline":"gagal",off?"":String((e&&e.message)||e));
  }finally{SYNC.busy=false;}
}

  LS.del=function(k){del0.call(LS,k);syncKick(k);};

function syncSDK(){
  if(SYNC.sdk)return SYNC.sdk;
  const muat=src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("gagal memuat "+src));document.head.appendChild(s);});
  SYNC.sdk=(async()=>{
    if(window.supabase&&window.supabase.createClient)return;
    let err; for(const src of SYNC_CFG.sdk){try{await muat(src);if(window.supabase&&window.supabase.createClient)return;}catch(e){err=e;}}
    throw err||new Error("sdk");
  })().catch(e=>{SYNC.sdk=null;throw e;});
  return SYNC.sdk;
}
async function syncSiapkanKlien(){
  if(SYNC.sb)return SYNC.sb;
  await syncSDK();
  SYNC.sb=window.supabase.createClient(SYNC_CFG.url,SYNC_CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"lw-auth",flowType:"implicit"}});

    setTimeout(()=>{
      if(ev==="PASSWORD_RECOVERY"){syncSheetSandiBaru();return;}
      if(ev==="SIGNED_OUT"){syncSetUser(null);return;}
      if(ses&&ses.user)syncSetUser(ses.user);
    },0);
  });

}
function syncSetUser(user){
  if(user){
    if(SYNC.user&&SYNC.user.id===user.id){SYNC.user=user;return;}
    if(LS.get("sync:owner",null)==null&&LS.get("sync:uid",null))LS.set("sync:owner",LS.get("sync:uid",null)); // sesi lama: akun yang tadi aktif adalah pemilik data lokal
    if(LS.get("sync:uid",null)!==user.id){SYNC.B={rec:{},hlc:0};syncSimpanBasis();LS.set("sync:cur",0);LS.set("sync:uid",user.id);LS.set("sync:awal",true);SYNC.pilih=null;} // akun lain: mulai bersih, lalu gabungkan sekali (setelah ditanyakan bila perlu)
    SYNC.user=user; LS.set("sync:on",true); syncLanggan(); syncRun();
  }else{
    SYNC.user=null; SYNC.pilih=null; syncBerhenti();
    if(SYNC.keluar){SYNC.keluar=false;}
    syncStatus(LS.get("sync:on",false)?"perlu-masuk":"mati");
  }

}

function syncPesanGalat(e){
  const m=String((e&&e.message)||e||"");
  if(/Invalid login credentials/i.test(m))return "Email atau kata sandi salah";
  if(/Email not confirmed/i.test(m))return "Email belum dikonfirmasi. Buka tautan di email pendaftaran, lalu masuk lagi";
  if(/already registered|already been registered/i.test(m))return "Email ini sudah terdaftar, silakan masuk";
  if(/Password should|weak password|same as the old/i.test(m))return /same as the old/i.test(m)?"Kata sandi baru harus berbeda dari yang lama":"Kata sandi belum memenuhi syarat";
  if(/rate limit|too many/i.test(m))return "Terlalu sering mencoba. Tunggu beberapa menit";
  if(/fetch|network|Failed|memuat/i.test(m)||!navigator.onLine)return "Tidak ada koneksi internet";
  return m||"Terjadi kesalahan";
}

/** Syarat kata sandi akun baru: minimal 8 karakter, huruf besar, huruf kecil, angka, dan simbol. */
function akSyarat(s){
  s=String(s||"");
  return [
    {t:"Minimal 8 karakter",ok:s.length>=8},
    {t:"Huruf besar (A-Z)",ok:/\p{Lu}/u.test(s)},
    {t:"Huruf kecil (a-z)",ok:/\p{Ll}/u.test(s)},
    {t:"Angka (0-9)",ok:/\d/.test(s)},
    {t:"Simbol (! @ # $ %)",ok:/[^\p{L}\p{N}\s]/u.test(s)}
  ];
}

  return `<ul class="ak-rules" id="akRules" aria-label="Syarat kata sandi">${akSyarat("").map(x=>`<li><span class="rd">${svg(IC.check)}</span>${x.t}</li>`).join("")}</ul>`;

function akValidasiSandi(s,u){
  if(!s)return {id:"syBaru",pesan:"Isi kata sandi"};
  if(!akSyarat(s).every(x=>x.ok))return {id:"syBaru",pesan:"Kata sandi harus minimal 8 karakter dan memuat huruf besar, huruf kecil, angka, dan simbol"};
  if(s!==u)return {id:"syUlang",pesan:"Ulangi kata sandi belum sama dengan kata sandi"};
  return null;
}

    <div id="syPesan" style="font-size:12.5px;min-height:18px;line-height:1.6" role="status"></div>
    <button class="btn" id="syMasuk" onclick="syncDaftar()">Buat akun</button>`;
}
function akRender(){
  const t=$("#akTabs"), f=$("#akForm"); if(!t||!f)return;
  const em=($("#syEmail")||{}).value||"";
  t.dataset.tab=AK_TAB;
  $("#akTabMasuk").classList.toggle("on",AK_TAB==="masuk"); $("#akTabMasuk").setAttribute("aria-selected",String(AK_TAB==="masuk"));
  $("#akTabDaftar").classList.toggle("on",AK_TAB==="daftar"); $("#akTabDaftar").setAttribute("aria-selected",String(AK_TAB==="daftar"));
  f.innerHTML=AK_TAB==="daftar"?akDaftarHTML():akMasukHTML();
  const e=$("#syEmail"); if(e&&em)e.value=em;
}
function akTab(t){AK_TAB=t==="daftar"?"daftar":"masuk"; akRender();}
function syncSheet(tab){
  AK_TAB=tab==="daftar"?"daftar":"masuk";
  openSheet("Akun sinkronisasi",`<div class="hd-form" style="display:grid;gap:14px;padding-bottom:6px">
    <div style="font-size:13px;line-height:1.7;color:var(--ink-soft)">Catatan ibadah, penanda, khatam, dan pengaturan salat akan sama di semua perangkat yang masuk dengan akun ini. Aplikasi tetap bisa dipakai tanpa internet; perubahan dikirim begitu online.</div>
    <div class="ak-tabs" id="akTabs" role="tablist" data-tab="${AK_TAB}">
      <button type="button" role="tab" id="akTabMasuk" onclick="akTab('masuk')">Masuk</button>
      <button type="button" role="tab" id="akTabDaftar" onclick="akTab('daftar')">Daftar akun</button></div>
    <div id="akForm" style="display:grid;gap:12px"></div></div>`);
  akRender();
}
async function syncPanggil(fn){
  const b=$("#syMasuk"); if(b)b.disabled=true; syncPesan("Menghubungi server…");
  try{await syncSiapkanKlien(); await fn(SYNC.sb);}
  catch(e){syncPesan(syncPesanGalat(e),true);}
  finally{if(b)b.disabled=false;}
}
function syncMasuk(){
  const {email,sandi}=syncAmbilForm(); if(!email||!sandi){syncPesan("Isi email dan kata sandi",true);return;}
  syncPanggil(async sb=>{
    const {data,error}=await sb.auth.signInWithPassword({email,password:sandi}); if(error)throw error;
    LS.set("sync:on",true); syncSetUser(data.user); akNamaTunda(data.user); closeSheet(); toast("Berhasil masuk, menyinkronkan…");
  });
}
function syncDaftar(){
  const email=(($("#syEmail")||{}).value||"").trim().toLowerCase(), nama=(($("#syNama")||{}).value||"").trim().replace(/\s+/g," ");
  const sandi=($("#syBaru")||{}).value||"", ulang=($("#syUlang")||{}).value||"";
  const gagal=(id,p)=>{syncPesan(p,true);const el=$("#"+id);if(el)el.focus();};
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){gagal("syEmail","Masukkan email yang valid");return;}
  if(!nama){gagal("syNama","Isi nama Anda");return;}
  const g=akValidasiSandi(sandi,ulang); if(g){gagal(g.id,g.pesan);return;}
  syncPanggil(async sb=>{
    const {data,error}=await sb.auth.signUp({email,password:sandi,options:{emailRedirectTo:location.origin+location.pathname,data:{nama}}}); if(error)throw error;
    // email yang sudah terdaftar dijawab server tanpa galat (agar email tak bisa ditebak): ditandai identities kosong
    if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0)throw new Error("User already registered");
    if(data.session){akTerapkanNama(nama);LS.set("sync:on",true);syncSetUser(data.user);closeSheet();toast("Akun dibuat, menyinkronkan…");}
    else{
      if(data.user)LS.set("ak:nama",{uid:data.user.id,nama});
      AK_TAB="masuk"; akRender(); const e=$("#syEmail"); if(e)e.value=email;
      syncPesan("Akun dibuat. Buka email Anda dan klik tautan konfirmasi, lalu kembali ke sini dan tekan Masuk.");
    }
  });
}
function syncLupa(){
  const {email}=syncAmbilForm(); if(!email){syncPesan("Isi email dulu, lalu tekan Lupa kata sandi",true);return;}
  syncPanggil(async sb=>{
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}); if(error)throw error;
    syncPesan("Tautan untuk membuat kata sandi baru sudah dikirim ke email Anda.");
  });
}
function syncSheetSandiBaru(){
  openSheet("Kata sandi baru",`<div class="hd-form" style="display:grid;gap:12px;padding-bottom:6px">
    ${pwField("syBaru","Kata sandi baru","new-password","Buat kata sandi baru",`oninput="akCekSandi()"`)}
    ${akRulesHTML()}
    ${pwField("syUlang","Ulangi kata sandi baru","new-password","Ketik ulang kata sandi",`oninput="akCekSandi()" onkeydown="if(event.key==='Enter')syncSimpanSandiBaru()"`)}
    ${akCocokHTML()}
    <div id="syPesan" style="font-size:12.5px;min-height:18px" role="status"></div>
    <button class="btn" id="syMasuk" onclick="syncSimpanSandiBaru()">Simpan kata sandi</button></div>`);
}
function syncSimpanSandiBaru(){
  const s=($("#syBaru")||{}).value||"", u=($("#syUlang")||{}).value||"";
  const g=akValidasiSandi(s,u); if(g){syncPesan(g.pesan,true);const el=$("#"+g.id);if(el)el.focus();return;}
  syncPanggil(async sb=>{const {error}=await sb.auth.updateUser({password:s}); if(error)throw error; closeSheet(); toast("Kata sandi diperbarui");});
}
/** Keluar dari akun: tanyakan dulu apa yang terjadi pada data di perangkat ini. */
function syncKeluar(){
  if(!SYNC.user)return;
  const kecil='font-size:12.5px;line-height:1.7;color:var(--ink-soft)';
  openSheet("Keluar dari akun",`<div style="${kecil};padding-bottom:10px">Pilih apa yang terjadi pada data ibadah di perangkat ini.</div>
    <div style="display:grid;gap:9px;padding-bottom:6px">
      <button class="btn" onclick="syncKeluarProses(true)">Keluar dan kosongkan perangkat ini</button>
      <div style="${kecil}">Data tetap aman di akun dan kembali saat Anda masuk lagi. Cocok untuk ponsel bersama atau dipakai bergantian.</div>
      <button class="btn ghost" onclick="syncKeluarProses(false)">Keluar, simpan data di perangkat ini</button>
      <div style="${kecil}">Aplikasi tetap berisi data Anda tanpa akun. Bila nanti seseorang masuk dengan akun lain di perangkat ini, Anda akan ditanya cara menggabungkannya.</div>
      <button class="btn ghost" onclick="closeSheet()">Batal</button></div>`);
}
async function syncKeluarProses(hapus,paksa){
  if(!SYNC.user)return;
  const uid=SYNC.user.id;
  if(hapus&&!paksa){
    closeSheet(); toast("Mengirim perubahan terakhir");
    for(let i=0;i<60&&SYNC.busy;i++)await new Promise(r=>setTimeout(r,250));
    if(!SYNC.pilih&&!SYNC.busy)await syncRun();
    syncLocalDiff();
    const sisa=syPending(SYNC.B).length, belumGabung=!!LS.get("sync:awal",false);
    if(sisa>0||belumGabung){
      const kecil='font-size:12.5px;line-height:1.7;color:var(--ink-soft)';
      openSheet("Data belum terkirim",`<div style="${kecil};padding-bottom:10px">${belumGabung?"Data di perangkat ini belum digabung ke akun.":`${sisa} perubahan di perangkat ini belum terkirim ke akun (mungkin sedang offline).`} <b style="color:var(--ruby)">Bila perangkat dikosongkan sekarang, data itu hilang.</b></div>
        <div style="display:grid;gap:9px;padding-bottom:6px">
          <button class="btn" onclick="syncKeluarProses(false)">Keluar dan simpan data di perangkat</button>
          <button class="btn ghost" onclick="closeSheet()">Batal, coba kirim lagi nanti</button>
          <button class="btn danger" onclick="syncKeluarProses(true,true)">Tetap kosongkan</button></div>`);
      return;
    }
  }
  closeSheet(); clearTimeout(SYNC.t); SYNC.keluar=true;
  try{if(SYNC.sb)await SYNC.sb.auth.signOut({scope:"local"});}catch(e){}
  if(!hapus)LS.set("sync:owner",uid);                  // data yang tersimpan di perangkat ini milik akun tadi
  SYNC.B={rec:{},hlc:0}; syncSimpanBasis(); LS.del("sync:cur"); LS.del("sync:uid"); LS.del("sync:awal"); LS.del("sync:on"); LS.del("sync:last"); SYNC.last=0;
  syncSetUser(null); syncStatus("mati");
  if(hapus){
    kosongkanDataLokal(true); LS.del("sync:owner"); LS.del("sync:mt"); syCadHapus();
    if(RENDER[CUR])RENDER[CUR]();
    toast("Keluar. Perangkat ini dikosongkan, data tetap ada di akun");
  }else toast("Keluar. Data di perangkat ini tetap tersimpan");
}
function syncSekarang(){
  if(!SYNC.user){syncSheet();return;}
  if(SYNC.pilih){syncSheetPilih();return;}
  syncRun();
}
/** Pertanyaan saat perangkat dan akun sama-sama berisi data (atau data perangkat milik akun lain). */
function syncSheetPilih(tahap){
  const P=SYNC.pilih; if(!P)return;
  const kecil='font-size:12.5px;line-height:1.7;color:var(--ink-soft)';
  const akun=esc((SYNC.user&&SYNC.user.email)||"akun ini");
  if(tahap==="timpa"){
    openSheet("Timpa data akun?",`<div style="${kecil};padding-bottom:10px">Isi akun <b>${akun}</b> akan disamakan dengan perangkat ini. Data di akun yang tidak ada di perangkat ini <b style="color:var(--ruby)">ikut terhapus dari akun dan semua perangkat lain</b>, dan tidak bisa dikembalikan.</div>
      <div style="display:grid;gap:9px;padding-bottom:6px">
        <button class="btn ghost" onclick="syncSheetPilih()">Kembali</button>
        <button class="btn danger" onclick="syncPilih('perangkat',true)">Ya, timpa data akun</button></div>`);
    return;
  }
  const asing=P.asing, k1=asing?"btn ghost":"btn", k2=asing?"btn":"btn ghost";
  openSheet("Gabungkan data?",`<div style="${kecil};padding-bottom:6px">Perangkat ini dan akun <b>${akun}</b> sama-sama sudah berisi data (perangkat ±${P.nLokal} catatan, akun ±${P.nAkun} catatan). Pilih cara menyatukannya. Salinan data perangkat otomatis disimpan sebagai cadangan.</div>
    ${asing?`<div style="font-size:12.5px;line-height:1.7;color:var(--ruby);padding-bottom:8px"><b>Data di perangkat ini berasal dari akun lain.</b> Bila perangkat ini dipakai bergantian, pilih "Pakai data akun saja" supaya data akun lain tidak tercampur.</div>`:""}
    <div style="display:grid;gap:9px;padding-bottom:6px">
      <button class="${k1}" onclick="syncPilih('gabung')">Gabungkan</button>
      <div style="${kecil}">Yang hanya ada di perangkat ini ditambahkan ke akun, hitungan dijumlahkan. Bila hal yang sama berbeda, yang waktu ubahnya diketahui dan lebih baru dipakai (penanda ayat, penanda terakhir dibaca, pengaturan); selain itu data akun dipertahankan.</div>
      <button class="${k2}" onclick="syncPilih('akun')">Pakai data akun saja</button>
      <div style="${kecil}">Data di perangkat ini diganti dengan isi akun. Tidak ada yang berubah di akun.</div>
      <button class="btn ghost" style="color:var(--ruby)" onclick="syncPilih('perangkat')">Pakai data perangkat ini</button>
      <div style="${kecil}">Akun disamakan dengan perangkat ini, menimpa isi akun.</div>
      <button class="btn ghost" onclick="ekspor()">Unduh cadangan dulu</button>
      <button class="btn ghost" onclick="closeSheet()">Nanti saja</button></div>`);
}
function syncCadanganHTML(){
  const c=syCadBaca(); if(!c)return "";
  const tgl=new Date(c.ts).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  return `<div class="note"><b>Cadangan data perangkat</b> (${esc(tgl)}) disimpan otomatis sebelum penggabungan. Hanya cadangan terakhir yang disimpan.
    <div style="display:grid;gap:8px;padding-top:8px"><button class="btn ghost" onclick="syncUnduhCadangan()">Unduh cadangan</button><button class="btn ghost" onclick="syncSheetPulih()">Pulihkan cadangan</button><button class="btn ghost" onclick="syncHapusCadangan()">Hapus cadangan</button></div></div>`;
}
function syncUnduhCadangan(){
  const c=syCadBaca(); if(!c){toast("Tidak ada cadangan");return;}
  const b=new Blob([JSON.stringify(c,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b);
  a.download=`lima-waktu-cadangan-perangkat-${today()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function syncSheetPulih(){
  const kecil='font-size:12.5px;line-height:1.7;color:var(--ink-soft)';
  openSheet("Pulihkan cadangan?",`<div style="${kecil};padding-bottom:10px">Data di aplikasi diganti dengan cadangan ini.${SYNC.user?` <b style="color:var(--ruby)">Sinkronisasi sedang aktif: hasilnya ikut dikirim ke akun dan menimpa data yang berbeda.</b>`:""}</div>
    <div style="display:grid;gap:9px;padding-bottom:6px"><button class="btn ghost" onclick="closeSheet()">Batal</button><button class="btn danger" onclick="syncPulihkan()">Ya, pulihkan</button></div>`);
}
function syncPulihkan(){
  const c=syCadBaca(); closeSheet(); if(!c){toast("Tidak ada cadangan");return;}
  try{pulihkanDariObjek(c);}catch(e){toast("Cadangan tidak terbaca");}
}
function syncHapusCadangan(){syCadHapus();syncPerbaruiUI();toast("Cadangan dihapus");}

/* ---------- tampilan di Pengaturan ---------- */
function syncJam(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,"0")+"."+String(d.getMinutes()).padStart(2,"0");}
function syncKeteranganStatus(){
  const tunggu=syPending(SYNC.B).length, s=SYNC.status;
  if(s==="sinkron")return "Menyinkronkan…";
  if(s==="offline")return `Menunggu koneksi${tunggu?` • ${tunggu} perubahan belum terkirim`:""}`;
  if(s==="gagal")return `Gagal menyinkronkan: ${esc(SYNC.err||"coba lagi")}${tunggu?` • ${tunggu} perubahan tertunda`:""}`;
  if(s==="pilih")return "Menunggu pilihan: data perangkat belum digabung ke akun";
  if(s==="perlu-masuk")return "Sesi berakhir, masuk lagi untuk melanjutkan";
  if(SYNC.last)return `Tersinkron pukul ${syncJam(SYNC.last)}${tunggu?` • ${tunggu} perubahan menunggu`:""}`;
  return "Belum pernah menyinkronkan";
}
/** True bila akun sinkronisasi sedang aktif; dipakai untuk menyesuaikan teks "hanya di perangkat ini". */
function syncAktif(){try{return !!(SYNC&&SYNC.user);}catch(e){return false;}}
function syncKartuHTML(){
  if(!SYNC.user){
    const ulang=SYNC.status==="perlu-masuk";
    return `<div class="set"><div class="st"><b>${ulang?"Masuk lagi":"Sinkron antar perangkat"}</b><span>${ulang?"Sesi berakhir. Data di perangkat ini aman, masuk lagi untuk melanjutkan sinkronisasi.":"Masuk dengan email agar catatan ibadah sama di ponsel, tablet, dan komputer. Tetap bisa dipakai tanpa internet."}</span></div>
      <button class="chip on" onclick="syncSheet()">Masuk</button></div>${syncCadanganHTML()}`;
  }
  return `<div class="set"><div class="st"><b>${esc(SYNC.user.email||"Akun")}</b><span id="syStatus">${syncKeteranganStatus()}</span></div></div>
    <div style="display:grid;gap:9px;padding-top:10px">
      ${SYNC.pilih?`<button class="btn" onclick="syncSheetPilih()">Pilih cara menggabungkan data</button>`:""}
      <button class="btn ghost" onclick="syncSekarang()">${svg(IC.refresh)} Sinkronkan sekarang</button>
      <button class="btn ghost" onclick="syncKeluar()">Keluar dari akun</button></div>
    <div class="note">Perubahan dikirim otomatis dan muncul di perangkat lain dalam hitungan detik. Dua perangkat yang mengubah hal berbeda keduanya tersimpan; bila hal yang sama diubah bersamaan, yang terbaru dipakai. Hitungan (tilawah, istigfar, selawat, tasbih) dijumlahkan.</div>
    <div class="note"><b>Profil ikut tersinkron</b> (nama, sapaan, warna, foto kecil, latar profil, latar kartu waktu salat, motto).</div>
    <div class="note"><b>Kalender haid ikut tersinkron</b>, termasuk kunci PIN-nya, agar bisa diisi dari perangkat mana pun. Salinannya tersimpan di akun Anda sendiri dan tidak dibagikan ke pengguna lain. Kunci PIN hanya menyembunyikan tampilan dan bukan enkripsi.</div>${syncCadanganHTML()}`;
}
function syncPerbaruiUI(){
  const k=$("#syncCard"); if(!k)return;
  const a=document.activeElement; if(a&&k.contains(a)&&a.tagName==="INPUT")return;
  k.innerHTML=syncKartuHTML();
}

/* ======================= INISIALISASI ======================= */
function init(){
  document.documentElement.dataset.theme=SET.theme;
  wkTerapkanCss(); wkTerapkanApp(); setInterval(wkTerapkanApp,30000); document.addEventListener("visibilitychange",wkTerapkanApp);
  terapkanTipografi();
  terapkanFontOfflineTersimpan();
  Object.keys(FONT_UNDUH).forEach(fam=>{
    if(FONT_UNDUH[fam].otomatis&&!LS.get("fontcache_"+fam,null))unduhFontOffline(fam,true);
  });
  buildShell();
  document.body.insertAdjacentHTML("beforeend",readerHTML());
  document.body.insertAdjacentHTML("beforeend",rekapHTML());
  $("#rekap").addEventListener("click",e=>{if(e.target.id==="rekap")tutupRekap();});
  R.mode=SET.mushafMode?"mushaf":"terjemah";
  muatPeta(); daftarSW();
  if(typeof segarkanUtangSalat==="function")segarkanUtangSalat();
  go("beranda"); pasangKembali();
  syncBoot();
  setTimeout(()=>{$("#splash").classList.add("gone");setTimeout(()=>$("#splash").remove(),700);},5600);
  setInterval(cekPengingat,20000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(typeof segarkanUtangSalat==="function")segarkanUtangSalat();cekPengingat();if(RENDER[CUR])RENDER[CUR]();}});
  window.addEventListener("keydown",e=>{
    if(e.key==="Escape"){ if($("#rekap").classList.contains("on"))tutupRekap(); else if($("#sheet").classList.contains("on"))closeSheet(); else if($("#reader").classList.contains("open"))tutupBaca(); }
    if($("#reader").classList.contains("open")){
      if(e.key==="ArrowLeft")keHalaman(R.page+1,1); if(e.key==="ArrowRight")keHalaman(R.page-1,-1);
    }
  });
  window.addEventListener("error",e=>{console.error(e.error||e.message);toast("Ada yang tersendat, coba sekali lagi");});
  window.addEventListener("unhandledrejection",e=>{console.error(e.reason);});
  setTimeout(movePill,150);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init); else init();
</script>
