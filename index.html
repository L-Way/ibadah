/* ======================= KHATAM ======================= */
let KHATAM=LS.get("khatam",null);
if(!KHATAM)KHATAM={mulai:today(),targetHari:30,read:{},riwayat:[]};
/** Rapikan data khatam dari penyimpanan/cadangan lama supaya hitungan tidak pernah NaN atau error. */
function khNormalisasi(){
  if(!KHATAM||typeof KHATAM!=="object")KHATAM={};
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(KHATAM.mulai||"")))KHATAM.mulai=today();
  const t=Math.round(+KHATAM.targetHari); KHATAM.targetHari=(t>=1&&t<=3650)?t:30;
  if(!KHATAM.read||typeof KHATAM.read!=="object"||Array.isArray(KHATAM.read))KHATAM.read={};
  if(!Array.isArray(KHATAM.riwayat))KHATAM.riwayat=[];
  // data lama: putaran yang sudah berisi bacaan nyata dianggap sudah berjalan (terkunci); yang belum, belum mulai
  if(typeof KHATAM.dikunci!=="boolean")KHATAM.dikunci=Object.values(KHATAM.read).some(v=>v!=="pra");
  if(KHATAM.gagal&&typeof KHATAM.gagal!=="object")delete KHATAM.gagal;
}
khNormalisasi();
const khTgl=k=>new Date(k+"T00:00:00");
const khGeser=(k,n)=>{const d=khTgl(k);d.setDate(d.getDate()+n);return dkey(d);};
const khTglPendek=k=>{const d=khTgl(k);return `${d.getDate()} ${BULAN[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;};
const khSimpan=()=>LS.set("khatam",KHATAM);
/* KHATAM.read[halaman] = tanggal baca (YYYY-MM-DD) atau "pra" bila ditandai selesai dari bacaan sebelum memakai aplikasi.
   Halaman "pra" ikut menghitung kemajuan khatam, tetapi bukan jatah hari ini dan bukan statistik tilawah. */
/** Tanggal acuan khatam. Tidak pernah mundur: memundurkan jam perangkat tidak bisa memperpanjang tenggat. */
function khHariIni(){
  const r=today();
  if(KHATAM.tglMaks&&KHATAM.tglMaks>r)return KHATAM.tglMaks;
  if(KHATAM.tglMaks!==r){KHATAM.tglMaks=r;khSimpan();}
  return r;
}
/** Tenggat lewat sebelum khatam selesai = GAGAL. Putaran tidak dihitung khatam dan tidak masuk pencapaian. */
function khTetapkanGagal(i){
  KHATAM.gagal={tgl:khHariIni(),tenggat:i.akhir,done:i.done,pra:i.pra};
  KHATAM.riwayat.unshift({mulai:KHATAM.mulai,selesai:i.akhir,hari:i.target,gagal:true,halaman:i.done,awal:i.pra});
  KHATAM.kunciTengah=true; // tidak bisa memakai "mulai dari tengah" untuk putaran berikutnya sampai satu khatam penuh selesai
  khSimpan();
  try{buzz([60,40,60]);}catch(e){}
  setTimeout(()=>{try{toast(`Khatam gagal: tenggat ${khTglPendek(i.akhir)} terlewat (${i.done}/${HAL_TOTAL} halaman)`);}catch(e){}},700);
}
/** Menghentikan putaran yang sudah berjalan sebelum selesai juga dihitung gagal (bukan jalan pintas menghindari tenggat). */
function khArsipBatal(){
  const pr=khProgress();
  KHATAM.riwayat.unshift({mulai:pr.mulai,selesai:khHariIni(),hari:pr.lewat,gagal:true,batal:true,halaman:pr.done,awal:pr.pra});
  KHATAM.kunciTengah=true;
}
function khProgress(){
  const vals=Object.values(KHATAM.read), tgl=khHariIni();
  const pra=vals.filter(v=>v==="pra").length, done=Math.min(HAL_TOTAL,vals.length);
  const target=KHATAM.targetHari, dikunci=!!KHATAM.dikunci;
  // hitungan hari baru berjalan sejak halaman khatam pertama dibaca; sebelum itu jadwalnya "mulai hari ini"
  const mulai=dikunci?KHATAM.mulai:tgl;
  const lewat=Math.max(1,Math.round((khTgl(tgl)-khTgl(mulai))/864e5)+1); // hari ke-berapa (hari mulai = 1)
  const akhir=khGeser(mulai,target-1);
  if(dikunci&&!KHATAM.gagal&&lewat>target&&done<HAL_TOTAL)khTetapkanGagal({done,pra,target,akhir});
  const gagal=!!KHATAM.gagal;
  const sisaHari=gagal?0:Math.max(0,target-lewat+1);   // sisa hari TERMASUK hari ini
  const telat=Math.max(0,lewat-target);                // hari yang lewat dari tenggat
  const sisaHal=Math.max(0,HAL_TOTAL-done);
  const hariIni=vals.filter(v=>v===tgl).length;
  const dasar=HAL_TOTAL-pra;
  const idealAwal=Math.min(HAL_TOTAL,pra+Math.ceil(dasar*Math.min(lewat-1,target)/target));
  const idealAkhir=Math.min(HAL_TOTAL,pra+Math.ceil(dasar*Math.min(lewat,target)/target));
  const selisih=(done-hariIni)-idealAwal;              // < 0 = tertinggal dari jadwal pada awal hari ini
  /* Jatah hari ini = jatah normal hari ini + semua halaman yang tertinggal dari hari sebelumnya.
     Dihitung dari posisi di awal hari, jadi angkanya tetap sepanjang hari dan hanya "hariIni" yang bertambah
     seiring bacaan (bacaan mengisi halaman tertinggal lebih dulu). Posisi terdepan tidak mengurangi jatah normal. */
  const jatahDasar=gagal?0:Math.max(1,idealAkhir-idealAwal);
  const tertinggal=gagal?0:Math.max(0,-selisih);
  const kuota=gagal?0:Math.min(sisaHal+hariIni,jatahDasar+tertinggal);
  return {done,pra,sisaHal,lewat,sisaHari,telat,target,kuota,jatahDasar,tertinggal,hariIni,selisih,mulai,dikunci,gagal,akhir,
    persen:done/HAL_TOTAL*100, persenWaktu:clamp(lewat/target*100,0,100)};
}
const khAdaBacaanNyata=()=>Object.values(KHATAM.read).some(v=>v!=="pra");
/** Catat halaman p yang dibaca. Tilawah harian: sekali per halaman per hari (tujuan khatam dan biasa).
    Khatam: hanya bila tujuan "khatam", sekali per halaman per putaran. Mode menyimak tidak pernah sampai sini. */
function catatBaca(p,manual,tujuan){
  if(tujuan==="khatam"&&khProgress().gagal){ // tenggat terlewat saat sedang membaca: sisa bacaan jadi bacaan biasa
    tujuan="biasa"; R.tujuan="biasa"; R.dariKhatam=false; perbaruiLencana(); perbaruiTombolTandai();
    toast("Khatam gagal karena tenggat terlewat. Bacaan dicatat sebagai bacaan biasa");
  }
  const k=today(), d=getDay(k);
  const sudahHariIni=d.halaman.includes(p)||KHATAM.read[p]===k;
  if(!sudahHariIni){d.halaman.push(p);d.tilawah=(d.tilawah||0)+1;simpanDay(k,d);}
  // Halaman yang benar-benar baru terhitung hari ini masuk ke ringkasan sesi baca yang sedang berjalan
  // (utk kartu rekap saat keluar dari mode baca), bukan sekadar halaman yang sempat dilewati/dilihat.
  if(R.sesiMulai&&!sudahHariIni)R.sesiHalaman.add(p);
  if(tujuan==="khatam"){
    const baru=!KHATAM.read[p], kh=khHariIni();
    if(baru&&!KHATAM.dikunci){KHATAM.dikunci=true;KHATAM.mulai=kh;} // halaman khatam pertama: jam mulai berjalan, target terkunci
    if(baru)KHATAM.read[p]=kh;
    KHATAM.posisi=p; khSimpan();
    const pr=khProgress();
    if(pr.done>=HAL_TOTAL){if(R.sesiMulai)R.sesiKhatam=true;selesaiKhatam();return;}
    if(baru&&pr.hariIni===pr.kuota&&pr.kuota>0){buzz([20,60,20]);toast(`Target khatam hari ini tercapai: ${pr.hariIni} halaman`);return;}
    if(baru&&pr.tertinggal>0&&pr.hariIni===pr.tertinggal&&pr.kuota>pr.hariIni){buzz([20,60,20]);toast(`Ketertinggalan ${pr.tertinggal} halaman sudah terkejar. Lanjutkan jatah hari ini ${pr.jatahDasar} halaman`);return;}
    if(manual||baru)toast(baru?`Halaman ${p} dicatat untuk khatam • ${pr.done}/${HAL_TOTAL}`:`Halaman ${p} sudah tercatat di khatam`);
    return;
  }
  if(manual)toast(sudahHariIni?`Halaman ${p} sudah tercatat hari ini`:`Halaman ${p} dicatat terbaca • ${d.tilawah} halaman hari ini`);
  else if(!sudahHariIni)toast(`Halaman ${p} tercatat terbaca`);
}
function selesaiKhatam(){
  KHATAM.riwayat.unshift({mulai:KHATAM.mulai,selesai:khHariIni(),hari:khProgress().lewat,awal:khProgress().pra});
  KHATAM.read={}; KHATAM.posisi=0; KHATAM.mulai=khHariIni(); KHATAM.dikunci=false; KHATAM.kunciTengah=false; delete KHATAM.gagal; khSimpan(); buzz([40,80,40,80,40]);
  toast("Alhamdulillah, khatam! Putaran baru dimulai.");
}
RENDER.khatam=function(){

function pratinjauKhTengah(){

function terapkanKhTengah(){
  const tolak=khTengahDitolak(); if(tolak){closeSheet();toast(tolak);return;}
  const P=halamanLanjutKh();
  if(P<=1){toast("Mulai dari halaman 1: belum ada yang perlu ditandai");return;}
  Object.keys(KHATAM.read).forEach(p=>{if(KHATAM.read[p]==="pra")delete KHATAM.read[p];}); // menggantikan, bukan menumpuk
  for(let p=1;p<P;p++)KHATAM.read[p]="pra";

const FONT_ARAB_STACK={
  lpmq:"'LPMQ','Scheherazade New','Amiri','Traditional Arabic','Geeza Pro',serif",
  amiri:"'Amiri','Scheherazade New','LPMQ','Traditional Arabic','Geeza Pro',serif",

/* ---------- Unduh font agar tersedia luring ----------
   File HTML ini sendiri tidak lagi membawa berkas font apa pun (lebih ringan untuk disimpan/dibagikan).
   LPMQ (lokal, dari fonts/LPMQ.woff di sebelah index.html) diunduh OTOMATIS sekali saat aplikasi
   pertama kali dibuka dengan internet, lalu disimpan di localStorage perangkat, sehingga jadi
   satu-satunya font yang dijamin tersedia offline sejak awal. Amiri & Amiri Quran diambil dari
   Google Fonts dan hanya diunduh kalau pengguna menekan tombolnya sendiri di Pengaturan. */
const FONT_UNDUH={
  lpmq:{nama:"LPMQ",lokal:"fonts/LPMQ.woff",family:"LPMQ",weight:"100 900",otomatis:true},
  amiri:{nama:"Amiri",query:"family=Amiri:ital,wght@0,400;0,700;1,400"},
  amiriquran:{nama:"Amiri Quran",query:"family=Amiri+Quran"}
};
function _ab2b64(buf){
  let bin=""; const by=new Uint8Array(buf), n=0x8000;
  for(let i=0;i<by.length;i+=n)bin+=String.fromCharCode.apply(null,by.subarray(i,i+n));
  return btoa(bin);
}
async function unduhFontOffline(fam,diam){
  const f=FONT_UNDUH[fam]; if(!f)return;
  const btn=$("#btn-font-"+fam);
  if(btn){btn.disabled=true;btn.textContent="Mengunduh…";}
  try{
    let css;
    if(f.lokal){
      const fr=await fetch(f.lokal); if(!fr.ok)throw 0;
      const b64=_ab2b64(await fr.arrayBuffer());
      const mime=f.lokal.endsWith(".woff2")?"font/woff2":"font/woff";
      const fmt=mime.endsWith("woff2")?"woff2":"woff";
      css=`@font-face{font-family:'${f.family}';src:url(data:${mime};base64,${b64}) format('${fmt}');font-weight:${f.weight||"400"};font-style:normal;font-display:swap}`;
    }else{
      const cssRes=await fetch(`https://fonts.googleapis.com/css2?${f.query}&display=swap`);
      if(!cssRes.ok)throw 0;
      css=await cssRes.text();
      const urls=[...css.matchAll(/url\((https:\/\/fonts\.gstatic\.com\/[^)]+)\)/g)].map(m=>m[1]);
      for(const url of urls){
        const fr=await fetch(url); if(!fr.ok)continue;
        const b64=_ab2b64(await fr.arrayBuffer());
        const mime=url.includes(".woff2")?"font/woff2":"font/woff";
        css=css.split(url).join(`data:${mime};base64,${b64}`);
      }
    }
    LS.set("fontcache_"+fam,{css,bytes:css.length,ts:Date.now()});
    terapkanFontOfflineTersimpan();
  }catch(e){
    if(!diam)alert("Gagal mengunduh font "+f.nama+". Pastikan perangkat terhubung ke internet, lalu coba lagi.");
  }
  if(!diam)RENDER.pengaturan();
}
function hapusFontOffline(fam){
  LS.del("fontcache_"+fam);
  const el=$("#style-font-"+fam); if(el)el.remove();
  RENDER.pengaturan();
}
function terapkanFontOfflineTersimpan(){
  Object.keys(FONT_UNDUH).forEach(fam=>{
    const data=LS.get("fontcache_"+fam,null), id="style-font-"+fam;
    let el=document.getElementById(id);
    if(data){
      if(!el){el=document.createElement("style");el.id=id;document.head.appendChild(el);}
      el.textContent=data.css;
    }else if(el)el.remove();
  });
}

function cepatCentang(k){
  const tgl=tglCatatSalat(k), d=getDay(tgl);
  const cur=d.fardhu[k]||{};
  const sudah=cur.cara&&cur.cara!=="tidak";
  if(sudah){d.fardhu[k]={cara:null,qada:false};}
  else{
    const c=jamCatatDefault(k,tgl);
    if(!c.ok){toast(c.pesan);return;}
    const dt=new Date(tgl+"T00:00:00");
    const wajibJamaah=k==="zuhur"&&dt.getDay()===5&&jenisZuhur(d,dt)==="jumat";
    // {...cur} dipertahankan agar niat Jamak/Qasar yang sudah dipilih lebih dulu di tab Ibadah tidak hilang.
    d.fardhu[k]=selarasQada({...cur,cara:wajibJamaah?"jamaah":"sendiri",qada:false,ts:c.ts,jam:c.jam,level:c.lvl.k,win:snapJendela(k,tgl)},c.lvl.k);
  }
  simpanDay(tgl,d); buzz(12); segarkanSemua();
  toast(!sudah?"Dicatat. Rinci statusnya di tab Ibadah.":"Catatan dibatalkan");
}

function susunNamaAlamat(a,display){
  const desa=a.village||a.hamlet||a.suburb||a.neighbourhood||a.town||a.quarter;
  const kec=a.city_district||a.subdistrict||a.district||a.municipality||a.town_district;
  const kab=a.county||a.regency||a.city||a.state_district;
  const bagian=[desa,kec,kab,a.state].filter((v,i,arr)=>v&&arr.indexOf(v)===i);

const _rev={};
function reverseOSM(lat,lng){
  const k=lat+","+lng;
  if(!_rev[k])_rev[k]=(async()=>{
    try{
      const ctrl=new AbortController(); const batal=setTimeout(()=>ctrl.abort(),9000);
      const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=16&addressdetails=1&accept-language=id`,{signal:ctrl.signal,headers:{"Accept":"application/json"}});
      clearTimeout(batal); if(!res.ok)return null; return await res.json();
    }catch(e){return null;}
  })().then(d=>{if(!d)delete _rev[k];return d;});
  return _rev[k];
}

function deteksiLokasi(){

/** Arah hadap ponsel dari sudut Euler. Ponsel mendatar: pakai sisi atas ponsel. Ponsel tegak: pakai arah belakang ponsel.
    Di antara keduanya dicampur mulus, sehingga tidak acak saat hampir mendatar. */
function headingEuler(al,be,ga){
  const a=al*D2R,b=be*D2R,g=ga*D2R, cA=Math.cos(a),sA=Math.sin(a),cB=Math.cos(b),sB=Math.sin(b),cG=Math.cos(g),sG=Math.sin(g);

  const tE=-cB*sA, tN=cA*cB;                         // sisi atas ponsel (timur, utara)
  const bE=-(cG*sA*sB+cA*sG), bN=-(sA*sG-cA*cG*sB);  // belakang ponsel (timur, utara)
  const nt=Math.hypot(tE,tN)||1, nb=Math.hypot(bE,bN)||1;
  const w=clamp((Math.abs(zUp)-0.5)/0.3,0,1);        // 0 = tegak penuh, 1 = mendatar
  const E=w*tE/nt+(1-w)*bE/nb, N=w*tN/nt+(1-w)*bN/nb;
  return fixA(Math.atan2(E,N)*R2D);
}
function onOrient(e){

  if(d.tilawah==null)d.tilawah=0; if(!Array.isArray(d.halaman))d.halaman=[]; if(!d.puasa)d.puasa="-"; if(d.musafir==null)d.musafir=false;

function simpanDay(k,d){if(tglBelumTiba(k))return false;TRACK[k]=d;LS.set("track",TRACK);return true;} // lapis terakhir: tanggal mendatang tak pernah tersimpan
/** True bila uzur syar'i (haid/nifas "Diri sendiri") boleh DITAMPILKAN di halaman umum. Bila kalender haid
    dikunci PIN, halaman umum memakai kata netral "uzur syar'i" saja & tidak menandai kalender/peta -
    supaya privasi yg dijaga PIN tidak bocor lewat tempat lain. */
const uzurTampil=()=>!(typeof HAID!=="undefined"&&HAID.pin);
const uzurLabel=()=>uzurTampil()?"Uzur syar'i (haid/nifas), tidak wajib salat hari ini":"Uzur syar'i, tidak wajib salat hari ini";
function skorHari(k){
  const d=getDay(k);
  /* Uzur syar'i (haid/nifas, profil "Diri sendiri"): salat fardu & rawatib memang tidak wajib hari itu -
     HR. Muslim, Mu'adzah bertanya kepada Aisyah r.a.: "Kami diperintah mengqada puasa dan tidak
     diperintah mengqada salat." Karena itu hari uzur TIDAK dinilai dengan rubrik salat: skornya hanya
     memakai komponen yg berlaku (sunah, amalan, tilawah; diskalakan ke 100), dan seluruh statistik
     (rata-rata, target, capaian, rentetan) MENGELUARKAN hari ini lewat flag uzurHaid, bukan diberi 100%
     (menggelembungkan rata-rata) dan bukan 0% (menghukum uzur). */
  const uzurHaid=typeof haidBebasSalat==="function"&&haidBebasSalat(k);
  const fardu=PRAYERS.filter(p=>d.fardhu[p.k]&&d.fardhu[p.k].cara&&d.fardhu[p.k].cara!=="tidak").length;
  const rawatib=RAWATIB.filter(r=>d.rawatib[r.k]).length;
  const sunah=SUNNAH.filter(s=>d.sunnah[s.k]>0).length;
  const amalan=AMALAN.filter(a=>d.amalan[a.k]).length;
  const jamaah=PRAYERS.filter(p=>isJamaahCara((d.fardhu[p.k]||{}).cara)).length;
  let persen,label;
  if(uzurHaid){
    persen=clamp(Math.round((sunah/SUNNAH.length*14+amalan/AMALAN.length*10+(d.tilawah>0?6:0))/30*100),0,100);
    label=uzurLabel();
  }else{
    persen=clamp(Math.round((fardu/5*55)+(rawatib/6*15)+(sunah/SUNNAH.length*14)+(amalan/AMALAN.length*10)+(d.tilawah>0?6:0)),0,100);
    label=persen>=90?"Masya Allah, hari yang penuh":persen>=70?"Alhamdulillah, hari yang baik":persen>=40?"Terus rapikan, sedikit lagi":persen>0?"Baru dimulai, lanjutkan":"Belum ada catatan hari ini";
  }
  return {fardu,rawatib,sunah,amalan,jamaah,persen,label,tilawah:d.tilawah,uzurHaid};
}
function streakHari(){
  let n=0; const d=new Date();
  for(let i=0;i<400;i++){
    const k=dkey(d);
    const s=skorHari(k);
    // Uzur syar'i (haid/nifas, Diri sendiri): hari itu dilewati saja, tak menambah streak (krn memang
    // tak wajib salat), tapi juga tak memutusnya (bukan kelalaian). Lihat dalil di komentar skorHari.
    if(s.uzurHaid){/* dilewati */}
    else if(s.fardu>=5){n++;}
    else if(i===0){/* hari berjalan tidak memutus */}
    else break;
    d.setDate(d.getDate()-1);
  }
  return n;
}

/* Aturan pilihan salat fardu:
   - Cara (pilih satu): Berjamaah | Sendiri | Terlewat.
   - Masbuk = bagian dari Berjamaah, jadi hanya aktif bila Berjamaah dipilih (Berjamaah + Masbuk).
   - Qada = tambahan untuk salat yang dikerjakan di luar waktunya: Sendiri + Qada atau Berjamaah + Qada.
   - Masbuk dan Qada tidak bisa digabung (masbuk hanya ada pada salat berjamaah di waktunya).
   - Terlewat berdiri sendiri: tidak bisa digabung dengan Masbuk maupun Qada.
   Maksimal dua pilihan. Data tetap disimpan sebagai cara: jamaah | masbuk | sendiri | tidak, plus
   qada: true/false (masbuk = jamaah + masbuk), sehingga catatan lama tetap kompatibel. */
const CARA=[["jamaah","Berjamaah"],["masbuk","Masbuk"],["sendiri","Sendiri"],["tidak","Terlewat"]];

/* Tempat pelaksanaan salat, opsional, hanya relevan bila salat sudah dikerjakan (cara terisi & bukan
   "tidak"). Disimpan di d.fardhu[k].tempat, tidak memengaruhi skor/capaian, murni catatan tambahan. */
const TEMPAT_SALAT=[["masjid","Masjid"],["musala","Musala"],["rumah","Rumah"],["kantor","Kantor/Sekolah"],["safar","Safar"],["lainnya","Lainnya"]];
const tempatNama=k=>(TEMPAT_SALAT.find(t=>t[0]===k)||[])[1]||"";
/* Rawatib dikelompokkan PER SALAT FARDU (bagian dari kartu salatnya, bukan bagian terpisah): rawatib memang
   sunah yg mengiringi fardu tertentu, HR. Muslim (Ummu Habibah r.a.): 12 rakaat sehari-semalam (2 sebelum
   Subuh, 4 sebelum & 2 sesudah Zuhur, 2 sesudah Magrib, 2 sesudah Isya); Qabliyah Asar gairu muakkad
   (HR. Abu Dawud & Tirmidzi). Pada hari Jum'at yg menghadiri Jum'at, rawatib Zuhur diganti Qabliyah/Ba'diyah
   Jum'at (tersimpan di d.jumat). */
const RAWATIB_PER_SALAT={subuh:["q_subuh"],zuhur:["q_zuhur","b_zuhur"],ashar:["q_ashar"],maghrib:["b_maghrib"],isya:["b_isya"]};

/* ===== Penjaga "belum masuk waktunya" =====
   Prinsip: catatan ibadah hanya boleh diisi bila waktunya sudah tiba.
   - Tanggal mendatang terkunci penuh (tak bisa dibuka dari kalender, tak bisa ditulis, tak bisa disimpan).
   - Hari ini: butir yang terikat waktu salat (Terlewat, cara salat, rawatib, zikir pagi/petang, Duha) terkunci sampai masuk waktunya.
   Tampilan menonaktifkan tombolnya; penjaga di fungsi pencatat adalah lapis kedua agar tak ada jalan lain yang lolos. */
const pesanTglBelumTiba=k=>`${tglID(new Date(k+"T00:00:00"))} belum tiba, baru bisa dicatat pada harinya`;
/** Awal waktu salat k pada tanggal tgl belum tiba? denganJamak=true: niat jamak taqdim yang sudah dipilih ikut melebarkan jendela (sama dgn cekJamFardhu). */
function salatBelumMasuk(k,tgl,denganJamak){
  if(tglBelumTiba(tgl))return true;
  if(tgl!==today())return false;
  const cur=getDay(tgl).fardhu[k]||{};
  const arah=(denganJamak&&cur.jamak&&JAMAK_ARAH[k]===cur.jamak)?cur.jamak:null;
  const w=jendelaEfektif(k,new Date(tgl+"T00:00:00"),arah);
  return Date.now()<tsFardhu(k,tgl,jamStr(w.mulai),k==="isya"&&arah==="taqdim");
}
/** Salat pemilik butir rawatib (q_zuhur -> zuhur, dst). Qabliyah/ba'diyah baru berlaku setelah waktu salatnya masuk. */
const salatDariRawatib=rk=>{for(const p in RAWATIB_PER_SALAT)if(RAWATIB_PER_SALAT[p].includes(rk))return p; if(rk==="q_jumat"||rk==="b_jumat")return "zuhur"; return null;};
const AMALAN_MULAI_SALAT={dzikirPagi:"subuh",dzikirPetang:"ashar"}; // zikir yang waktunya baru mulai setelah salat tertentu
const tolakBelumMasuk=(k)=>toast(`Belum masuk waktu ${namaSalat(k)}`);
function pilihTanggal(k){

  tglPilih=k;segarCatatan();buzz(6);
}
/** Mengembalikan true bila perubahan benar-benar disimpan (penanda visual hanya boleh berubah bila true). */
function mutasi(fn){
  if(tglBelumTiba(tglPilih)){toast(pesanTglBelumTiba(tglPilih));return false;}
  const d=getDay(tglPilih);fn(d);simpanDay(tglPilih,d);buzz(8);return true;
}
function setCaraFardhu(k,v){
  if(v==="tidak"&&salatBelumMasuk(k,tglPilih,false)){toast(`Belum masuk waktu ${namaSalat(k)}, belum bisa ditandai terlewat`);return;}
  mutasi(d=>{
    const cur=d.fardhu[k]||{};
    const aktif=v==="jamaah"?isJamaahCara(cur.cara):cur.cara===v; // masbuk juga dihitung berjamaah
    if(aktif){d.fardhu[k]={cara:null,qada:false};return;} // ketuk lagi = batalkan
    if(v==="tidak"){d.fardhu[k]={cara:v,qada:false};return;} // terlewat: tak ada salat, masbuk, maupun qada
    if(cur.cara&&cur.cara!=="tidak"){d.fardhu[k]={...cur,cara:v};return;} // ganti cara: jam tetap, masbuk gugur, qada tetap
    const c=jamCatatDefault(k,tglPilih);
    if(!c.ok){toast(c.pesan);return;}
    // {...cur} dipertahankan agar niat Jamak/Qasar/Tempat yang sudah dipilih SEBELUM cara (lihat
    // setJamakFardhu/toggleQasarFardhu) tidak ikut terhapus saat cara baru pertama kali dicatat.
    d.fardhu[k]=selarasQada({...cur,cara:v,qada:false,ts:c.ts,jam:c.jam,level:c.lvl.k,win:snapJendela(k,tglPilih)},c.lvl.k);
    if(c.tebak)toast("Hari yang sudah lewat: jam diisi awal waktu. Ketuk Ubah bila berbeda.");
  });
  segarCatatan();
}
/** Masbuk hanya sub-pilihan dari berjamaah: jamaah <-> masbuk. Di luar itu diabaikan. */
function toggleMasbuk(k){
  mutasi(d=>{
    const cur=d.fardhu[k]||{};
    if(cur.cara==="jamaah"){if(!cur.qada)d.fardhu[k]={...cur,cara:"masbuk"};} // masbuk & qada tidak digabung
    else if(cur.cara==="masbuk")d.fardhu[k]={...cur,cara:"jamaah"};
  });
  segarCatatan();
}
function toggleQadaFardhu(k){
  mutasi(d=>{
    const cur=d.fardhu[k]||{};
    if(!cur.cara||cur.cara==="tidak")return; // jaga-jaga: qada butuh cara salat dulu
    if(cur.cara==="masbuk"&&!cur.qada)return; // masbuk & qada tidak digabung
    const qadaBaru=!cur.qada;
    d.fardhu[k]={...cur,qada:qadaBaru,qadaOto:false,qadaAlasan:qadaBaru?(cur.qadaAlasan||null):null};
  });
  segarCatatan();
}
/** Catat tempat pelaksanaan salat. Ketuk lagi opsi yang sama = batalkan. Butuh cara salat terisi dulu
    dan tidak berlaku untuk yang Terlewat (tidak ada tempat pelaksanaan). */
function setTempatFardhu(k,v){
  mutasi(d=>{
    const cur=d.fardhu[k]||{}; if(!cur.cara||cur.cara==="tidak")return;
    d.fardhu[k]={...cur,tempat:cur.tempat===v?null:v};
  });
  segarCatatan();
}
/** Nyalakan/matikan penanda "musafir" harian, membuka opsi Jamak & Qasar. Lihat dalil lengkap di
    komentar JAMAK_PASANGAN/JAMAK_ARAH. Mematikannya TIDAK menghapus jamak/qasar yang sudah tercatat
    di hari itu (biar riwayat tak berubah bila tak sengaja diketuk); hanya menyembunyikan opsi baru. */
function toggleMusafir(){mutasi(d=>{d.musafir=!d.musafir;});segarCatatan();}
/** Niat jamak untuk salat k, dipilih SEBELUM/SESUDAH cara salat ditentukan (boleh keduanya, mengikuti
    kebiasaan niat jamak yang idealnya sudah ada sejak salat pertama dari pasangan yang dijamak). Ketuk
    opsi yang sama = batalkan. Hanya SATU arah yang sah per salat (lihat JAMAK_ARAH); pemanggilan dengan
    arah yang salah diabaikan agar tak pernah tersimpan kombinasi yang secara fikih tidak berlaku. */
function setJamakFardhu(k,v){
  if(JAMAK_ARAH[k]!==v)return; // arah tak sah utk salat ini, abaikan
  mutasi(d=>{
    const cur=d.fardhu[k]||{cara:null,qada:false};
    d.fardhu[k]={...cur,jamak:cur.jamak===v?null:v};
  });
  segarCatatan();
}
/** Batalkan niat jamak salat k (tombol "Tidak dijamak"). Aman dipanggil kapan pun, termasuk saat
    belum ada catatan sama sekali. */
function clearJamakFardhu(k){
  mutasi(d=>{const cur=d.fardhu[k]; if(cur&&cur.jamak)d.fardhu[k]={...cur,jamak:null};});
  segarCatatan();
}
/** Tandai qasar (meringkas 4 rakaat jadi 2). Hanya bermakna bila cara salat sudah tercatat (perlu tahu
    salat ini sungguh dikerjakan), dan hanya utk Zuhur/Asar/Isya (lihat QASAR_BOLEH). */
function toggleQasarFardhu(k){
  if(!QASAR_BOLEH.includes(k))return;
  mutasi(d=>{
    const cur=d.fardhu[k]||{}; if(!cur.cara||cur.cara==="tidak")return;
    d.fardhu[k]={...cur,qasar:!cur.qasar};
  });
  segarCatatan();
}
/** Catat sebab qada: uzur (lupa/tertidur/sakit, tidak berdosa) atau sengaja ditunda tanpa uzur. */
function setQadaAlasan(k,alasan){
  mutasi(d=>{
    const cur=d.fardhu[k]||{}; if(!cur.qada)return;
    d.fardhu[k]={...cur,qadaAlasan:cur.qadaAlasan===alasan?null:alasan};
  });

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="var(--emerald-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function statSalatLanjut(X){

      +`<div class="note">Ketuntasan tiap salat pada ${k} segmen waktu berurutan (kiri paling lama, kanan terbaru).</div>`;}

  const tR=cnt(H,f=>f.cara==="tidak"), qR=cnt(H,f=>f.qada), tA=cnt(HALL,f=>f.cara==="tidak"), qA=cnt(HALL,f=>f.qada);
  const sdhQ=cnt(HALL,f=>f.cara==="tidak"&&f.qadaSelesai), utangSisa=tA-sdhQ, MPT2=mulaiPakaiTs();
  const belumA=HALL.reduce((x,h)=>x+(h.s.uzurHaid?0:PRAYERS.filter(p=>statusSlotSalat(h.k,p.k,h.dat,MPT2)==="belum").length),0);
  return `<div class="sec-title"><h2>Tren per salat</h2></div><div class="card">${tren}</div>
  <div class="sec-title"><h2>Rentetan per salat</h2></div>
  <div class="card"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th></th><th>Tunai sekarang</th><th>Rekor</th><th>Jamaah sekarang</th><th>Rekor</th></tr></thead><tbody>
    ${rt.map(r=>`<tr><td>${r.p.nama}</td><td><b>${r.t.now}</b></td><td>${r.t.best}</td><td><b>${r.j.now}</b></td><td>${r.j.best}</td></tr>`).join("")}</tbody></table></div>
    <div class="note">Dalam hari berturut-turut, dihitung dari seluruh riwayat. Hari ini yang belum dicatat tidak memutus rentetan; hari uzur syar'i dijeda (tidak menambah dan tidak memutus).</div></div>
  <div class="sec-title"><h2>Saldo qada</h2></div>
  <div class="statgrid">${kpi(tA,"Terlewat (dikonfirmasi), seluruh riwayat","rb")}${kpi(utangSisa,"Utang qada tersisa","rb")}${kpi(sdhQ,"Sudah diqada","em")}</div>
  <div class="statgrid" style="margin-top:10px">${kpi(belumA,"Belum dicatat (belum dikonfirmasi)")}${kpi(qA,"Dikerjakan di luar waktu (ditandai qada)","gold")}${kpi(tR,"Terlewat pada periode ini")}</div>
  <div class="card" style="margin-top:10px">${PS.map(o=>`<div class="pl"><div class="r"><span>${o.p.nama}</span><span>terlewat ${o.tidak} • belum dicatat ${o.belum} • qada ${o.qada}</span></div></div>`).join("")}

    ${qsrT?`<div style="margin-top:6px">${QASAR_BOLEH.filter(k=>qsr[k]).map(k=>pl((PRAYERS.find(p=>p.k===k)||{}).nama,qsr[k],hariMusafir||1)).join("")}</div>`:""}

    <div class="note">Rukhsah musafir, QS. An-Nisa' 4:101 (qasar) & HR. Muslim, Mu'adz bin Jabal (jamak): Zuhur↔Ashar dan Magrib↔Isya boleh dijamak; Zuhur, Ashar, Isya boleh diqasar jadi 2 rakaat. Subuh tidak pernah dijamak atau diqasar.</div>

function eksporCSV(){

  const q=v=>{v=v==null?"":String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const cols=["tanggal","hijriah","skor_persen","musafir",...PRAYERS.flatMap(p=>[p.k+"_cara",p.k+"_jam",p.k+"_ketepatan",p.k+"_qada",p.k+"_qada_alasan",p.k+"_tempat",p.k+"_jamak",p.k+"_qasar",p.k+"_qada_selesai"]),"jumat_jenis",...RAWATIB.map(r=>"rawatib_"+r.k),...SUNNAH.map(x=>"sunah_"+x.k+"_rakaat"),...AMALAN.map(a=>"amalan_"+a.k),...JUMAT.map(x=>"jumat_"+x.k),"tilawah_halaman","halaman_dibaca","puasa","istighfar","shalawat","catatan"];
  const rows=[cols.join(",")], d=new Date(ks[0]+"T12:00:00"), end=new Date(); end.setHours(23,0,0,0);
  for(let i=0;i<4000&&d<=end;i++){

    rows.push([k,hijri(d),sk.persen,x.musafir?1:0,...PRAYERS.flatMap(p=>{const f=x.fardhu[p.k]||{};return [f.cara||"",f.jam||"",f.level||"",f.qada?1:0,f.qada?(f.qadaAlasan||""):"",f.tempat?tempatNama(f.tempat):"",f.jamak||"",(f.qasar&&QASAR_BOLEH.includes(p.k))?1:0,f.cara==="tidak"?(f.qadaSelesai?1:0):""];}),jumHari?jenisZuhur(x,d):"",...RAWATIB.map(r=>x.rawatib[r.k]?1:0),...SUNNAH.map(z=>x.sunnah[z.k]||0),...AMALAN.map(a=>x.amalan[a.k]?1:0),...JUMAT.map(z=>x.jumat[z.k]?1:0),x.tilawah,(x.halaman||[]).join(" "),x.puasa,x.istighfar,x.shalawat,x.catatan].map(q).join(","));
    d.setDate(d.getDate()+1);
  }
  const csv="\ufeff"+rows.join("\n");
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="statistik-ibadah-"+today()+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast("CSV diekspor ("+(rows.length-1)+" hari)");}
  catch(e){try{navigator.clipboard.writeText(csv);toast("Unduhan diblokir, CSV disalin ke papan klip");}catch(e2){toast("Ekspor gagal");}}
}

}

      <div class="note" style="text-align:center;padding:6px 0 0">Skor 0-100 (gamifikasi aplikasi, bukan penilaian pahala): fardu 55, rawatib 15, sunah 14, amalan 10, tilawah 6</div></div>

/* ======================= TASBIH ======================= */
RENDER.tasbih=function(){
  const p=TASBIH_PRESET[TASBIH.i]||TASBIH_PRESET[0];
  $("#pg-tasbih").innerHTML=backHeader("Tasbih digital",`Total sepanjang masa: ${TASBIH.total}`,"lainnya")+
  `<div class="wrap">
    ${TASBIH.ctx?`<div class="card" style="padding:12px 16px;border:1.4px solid color-mix(in srgb,var(--gold) 55%,transparent)"><b style="font-size:13.5px">Wirid setelah ${namaSalat(TASBIH.ctx.k)}</b>
      <div style="font-size:12px;color:var(--ink-soft);margin:3px 0 8px">${TASBIH.ctx.ok.length}/3 selesai • Subhanallah, Alhamdulillah, Allahu Akbar masing-masing 33×, berganti otomatis.</div>
      <button class="chip" onclick="batalWiridSalat()">Batalkan</button></div>`:""}
    <div class="card" style="padding:22px 18px">
      <div style="text-align:center;margin-bottom:6px">
        <div style="font-family:var(--font-ar);font-size:27px;line-height:1.9">${p[1]}</div>
        <div style="font-size:13px;color:var(--ink-faint);font-weight:600">${p[0]} • target ${p[2]}</div>
      </div>
      <div class="tasbih">
        <button class="beadbtn" id="beadBtn" onclick="hitungTasbih(event)">
          <div style="text-align:center"><div class="cnt" id="tCount">${TASBIH.count}</div>
          <div class="lb">dari ${p[2]} • ketuk</div></div>
        </button>
        <div style="display:flex;gap:9px">
          <button class="chip" onclick="resetTasbih()">Ulang dari nol</button>
          <button class="chip" onclick="gantiWirid()">Ganti wirid</button>
        </div>
      </div>
    </div>
    <div class="card"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      ${TASBIH_PRESET.map((x,i)=>`<button class="chip ${TASBIH.i===i?"on":""}" style="justify-content:center;text-align:center" onclick="pilihWirid(${i})">${x[0]}${tasbihHariIni(i)?`<span style="display:block;font-size:10px;opacity:.7;font-weight:600">${tasbihHariIni(i)}× hari ini</span>`:""}</button>`).join("")}
    </div></div>
    <div class="card" style="padding:14px 16px">
      <div id="tHari" style="font-size:12.5px;line-height:1.7;color:var(--ink-soft)">${tasbihInfoHTML()}</div>
      <div class="set" style="border-bottom:0;padding:10px 0 0">
        <div class="st"><b>Catat otomatis ke Ibadah</b><span>Istigfar dan Selawat langsung menambah hitungan harian, statistik, dan capaian.</span></div>
        <div class="switch ${TASBIH.sinkron?"on":""}" onclick="toggleSinkronTasbih()"></div></div>
      <div style="display:flex;gap:9px;margin-top:12px"><button class="chip" onclick="go('ibadah')">Catatan ibadah</button><button class="chip" onclick="go('dzikir')">Zikir pagi &amp; petang</button></div>
    </div>
    <div class="note">Getaran halus menandai setiap hitungan; getaran panjang berarti target tercapai.</div>
  </div>`;
};
const TASBIH_KAIT={3:"istighfar",4:"shalawat"}; // indeks preset -> kolom catatan harian
function tasbihHariIni(i){ if(!TASBIH.hari||TASBIH.hari.t!==today())TASBIH.hari={t:today(),c:{}}; return TASBIH.hari.c[i]||0; }
function sinkronTasbih(i){
  const d=getDay(today()); d.tsb=d.tsb||{}; d.tsb[i]=(d.tsb[i]||0)+1; // hitungan harian per jenis wirid (untuk statistik)
  const k=TASBIH_KAIT[i];
  if(!TASBIH.sinkron||!k){simpanDay(today(),d);return;}
  d[k]=(d[k]||0)+1;
  if(k==="shalawat"&&new Date().getDay()===5&&d.shalawat>=100)d.jumat.shalawat=true; // amalan Jum'at: memperbanyak selawat
  simpanDay(today(),d);
}
function hitungTasbih(e){
  const p=TASBIH_PRESET[TASBIH.i]; tasbihHariIni(TASBIH.i);
  TASBIH.count++; TASBIH.total++; TASBIH.hari.c[TASBIH.i]=(TASBIH.hari.c[TASBIH.i]||0)+1;
  sinkronTasbih(TASBIH.i);
  const el=$("#tCount"); if(el){el.textContent=TASBIH.count;el.animate?el.animate([{transform:"scale(1.12)"},{transform:"scale(1)"}],{duration:220,easing:"cubic-bezier(.34,1.56,.64,1)"}):0;}
  const btn=$("#beadBtn"); if(btn){const r=document.createElement("div");r.className="ripple";btn.appendChild(r);setTimeout(()=>r.remove(),760);}
  const hi=$("#tHari"); if(hi)hi.innerHTML=tasbihInfoHTML();
  if(TASBIH.count===p[2]){buzz([30,60,120]);toast(`${p[0]} genap ${p[2]}×`);selesaiWirid();}
  else buzz(8);
  LS.set("tasbih",TASBIH);
}
/** Wirid 33× setelah salat: bila tasbih dibuka dari kartu salat, tiga zikir dipandu berurutan lalu otomatis dicentang di kartu itu. */
function bukaWiridSalat(k){TASBIH.ctx={k,tgl:tglPilih,ok:[]};TASBIH.i=0;TASBIH.count=0;LS.set("tasbih",TASBIH);go("tasbih");}
function batalWiridSalat(){TASBIH.ctx=null;LS.set("tasbih",TASBIH);RENDER.tasbih();}
function selesaiWirid(){
  const c=TASBIH.ctx, i=TASBIH.i; if(!c||i>2)return;
  if(!c.ok.includes(i))c.ok.push(i);
  if(c.ok.length>=3){
    const d=getDay(c.tgl), fi=d.fardhu[c.k]||{}; fi.wirid=true; d.fardhu[c.k]=fi; simpanDay(c.tgl,d);
    toast(`Wirid setelah ${namaSalat(c.k)} lengkap, tercatat di kartu salat`); TASBIH.ctx=null; LS.set("tasbih",TASBIH);
    setTimeout(()=>{if(CUR==="tasbih")RENDER.tasbih();},500); return;
  }
  LS.set("tasbih",TASBIH);
  setTimeout(()=>{if(CUR==="tasbih"&&TASBIH.ctx){TASBIH.i=(i+1)%3;TASBIH.count=0;LS.set("tasbih",TASBIH);RENDER.tasbih();}},900);
}
function toggleWiridManual(k){mutasi(d=>{const fi=d.fardhu[k]||{}; fi.wirid=!fi.wirid; d.fardhu[k]=fi;});segarCatatan();}
function tasbihInfoHTML(){
  const d=getDay(today()), i=TASBIH.i, k=TASBIH_KAIT[i];
  const tiga=[0,1,2].map(x=>tasbihHariIni(x));
  const lengkap=tiga.every(v=>v>=33);
  return `Hari ini: <b>${tasbihHariIni(i)}×</b> ${TASBIH_PRESET[i][0]}`+
    (k&&TASBIH.sinkron?` • tercatat otomatis di Ibadah (Istigfar ${d.istighfar}, Selawat ${d.shalawat})`:"")+
    (i<3&&lengkap?` • <b>Tasbih, tahmid, takbir 33× lengkap</b>`:"");
}
function toggleSinkronTasbih(){TASBIH.sinkron=!TASBIH.sinkron;LS.set("tasbih",TASBIH);RENDER.tasbih();toast(TASBIH.sinkron?"Istigfar & selawat tercatat otomatis":"Sinkron ke catatan dimatikan");}
function pilihWiridLaluTasbih(i){TASBIH.i=i;TASBIH.count=0;LS.set("tasbih",TASBIH);go("tasbih");}
function resetTasbih(){TASBIH.count=0;LS.set("tasbih",TASBIH);RENDER.tasbih();toast("Hitungan diulang");}
function pilihWirid(i){TASBIH.i=i;TASBIH.count=0;if(i>2)TASBIH.ctx=null;LS.set("tasbih",TASBIH);RENDER.tasbih();}
function gantiWirid(){pilihWirid((TASBIH.i+1)%TASBIH_PRESET.length);}

RENDER.dzikir=function(){
  const list=dzTab==="pagi"?DZIKIR_PAGI:DZIKIR_PETANG;
  const done=(DZIKIRDONE[today()]||{})[dzTab]||[];
  $("#pg-dzikir").innerHTML=backHeader("Zikir pagi & petang",`${done.length}/${list.length} selesai hari ini`,"lainnya")+
  `<div class="wrap">
    <div class="seg" id="dzSeg"><div class="thumb" id="dzThumb"></div>
      <button data-t="pagi" class="${dzTab==="pagi"?"on":""}" onclick="setDzTab('pagi')">Pagi</button>
      <button data-t="petang" class="${dzTab==="petang"?"on":""}" onclick="setDzTab('petang')">Petang</button></div>
    ${list.map((d,i)=>`<div class="dz ${done.includes(i)?"done":""}">
      <div class="ar">${d.ar}</div>
      <div class="lt">${esc(d.lt)}</div>
      <div class="id">${esc(d.id)}</div>
      <div class="ft"><span class="ct">Dibaca ${d.x}×</span>
        <button class="btn-c" onclick="tandaiDzikir(${i})">${done.includes(i)?"Selesai ✓":"Tandai selesai"}</button></div>
    </div>`).join("")}
    <div style="display:flex;gap:9px;margin:4px 0 12px"><button class="chip" onclick="go('tasbih')">Buka tasbih</button><button class="chip" onclick="go('ibadah')">Catatan ibadah</button></div>
    <div class="note">Waktu zikir pagi: setelah Subuh hingga terbit matahari. Zikir petang: setelah Asar hingga terbenam matahari.</div>
  </div>`;
  const b=$(`#dzSeg button[data-t="${dzTab}"]`),th=$("#dzThumb"); if(b&&th){th.style.width=b.offsetWidth+"px";th.style.left=b.offsetLeft+"px";}
};
function setDzTab(t){dzTab=t;RENDER.dzikir();buzz(6);}
function tandaiDzikir(i){
  const k=today(); DZIKIRDONE[k]=DZIKIRDONE[k]||{}; const arr=DZIKIRDONE[k][dzTab]||[];
  const j=arr.indexOf(i); if(j>=0)arr.splice(j,1); else arr.push(i);
  DZIKIRDONE[k][dzTab]=arr; LS.set("dzikirdone",DZIKIRDONE);
  const list=dzTab==="pagi"?DZIKIR_PAGI:DZIKIR_PETANG;

/** Hari besar Hijriah berikutnya untuk (bulan,hari) tertentu, dihitung dari tahun Hijriah 'sekarang'
    dan otomatis digeser setahun jika ternyata sudah lewat. 'acuan' hanya mempercepat & mengarahkan pencarian. */
function hariBesarBerikutnya(m,d,label,acuan){
  const now=new Date(); const h=hijriYMD(now); if(!h)return {label,tgl:null};
  let tgl=tanggalDariHijri(h.y,m,d,acuan||now);
  if(tgl&&dkey(tgl)<dkey(now))tgl=tanggalDariHijri(h.y+1,m,d,new Date(now.getTime()+330*864e5));
  return {label,tgl};
}
function acaraIslamBerikutnya(){
  const h=hijriYMD(new Date()); if(!h)return null;
  const ramadhan=hariBesarBerikutnya(9,1,"Awal Ramadhan");
  const fitri=hariBesarBerikutnya(10,1,"Idul Fitri",ramadhan.tgl);
  const tarwiyah=hariBesarBerikutnya(12,8,"Tarwiyah",fitri.tgl);
  const arafah=hariBesarBerikutnya(12,9,"Hari Arafah",tarwiyah.tgl);
  const adha=hariBesarBerikutnya(12,10,"Idul Adha",arafah.tgl);
  const tasua=hariBesarBerikutnya(1,9,"Tasu'a",adha.tgl);
  const asyura=hariBesarBerikutnya(1,10,"Asyura",tasua.tgl);
  return {ramadhan,fitri,tarwiyah,arafah,adha,tasua,asyura,sekarang:h};
}
/** n tanggal Ayyamul Bidh (13-15 tiap bulan Hijriah) terdekat mulai hari ini, melompati Ramadhan
    (sudah wajib puasa) dan 13 Dzulhijjah (Tasyrik, puasa dilarang). Dipakai di halaman Ramadhan &amp; hari besar. */
function ayyamulBidhBerikutnya(n){
  const now=new Date(); const h0=hijriYMD(now); if(!h0)return [];
  const hasil=[]; let acuan=now;
  for(let step=0;step<24&&hasil.length<n;step++){
    const mm=((h0.m-1+step)%12)+1, yy=h0.y+Math.floor((h0.m-1+step)/12);
    if(mm!==9){
      for(const dd of [13,14,15]){
        if(mm===12&&dd===13)continue;
        const tgl=tanggalDariHijri(yy,mm,dd,acuan);
        if(tgl&&dkey(tgl)>=today())hasil.push({tgl,hari:dd,bulan:mm});
      }
    }
    acuan=new Date(acuan.getTime()+29*864e5);
  }
  hasil.sort((a,b)=>a.tgl-b.tgl);
  return hasil.slice(0,n);
}
/* "Imsak" (di sini fajr−10 menit) HANYA ihtiyat/kehati-hatian lokal (kebiasaan Kemenag RI dkk), BUKAN
   batas syar'i berakhirnya sahur. Batas sesungguhnya adalah masuknya waktu Subuh: QS. Al-Baqarah 2:187
   "...makan minumlah hingga jelas bagimu benang putih dari benang hitam, yaitu fajar", dan HR. Bukhari
   (Zaid bin Tsabit): jarak sahur beliau ﷺ dengan masuknya salat Subuh hanya sekitar bacaan 50 ayat,
   jauh lebih mepet dari 10 menit. Karena itu fase antara Imsak dan Subuh diberi label sendiri yang
   tidak menyiratkan sahur sudah tidak boleh, bukan langsung dianggap "menuju berbuka". */
function faseRamadhanHariIni(j,now){
  const h=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
  if(h<j.imsak)return {label:"MENUJU IMSAK",target:j.imsak};
  if(h<j.subuh)return {label:"SAHUR MASIH BOLEH",target:j.subuh};
  if(h<j.maghrib)return {label:"MENUJU BERBUKA",target:j.maghrib};
  return {label:"PUASA SELESAI",target:null};
}
function sisaJamMenit(now,jamTarget){
  let s=(jamTarget-(now.getHours()+now.getMinutes()/60+now.getSeconds()/3600))*3600;
  if(s<0)s+=86400; s=Math.max(0,Math.floor(s));
  return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;
}

    teks.push(`${h.d} Ramadhan (${tgl}): Imsak ${jamStr(j.imsak)}, Subuh ${jamStr(j.subuh)}, Terbit ${jamStr(j.syuruq)}, Zuhur ${jamStr(j.zuhur)}, Asar ${jamStr(j.ashar)}, Magrib/berbuka ${jamStr(j.maghrib)}, Isya ${jamStr(j.isya)}`);
  }
  if(!baris.length)return "";
  IMSAKIYAH_TEKS=teks.join("\n");
  return `<div class="sec-title"><h2>Jadwal imsakiyah ${th} H</h2><button class="more" onclick="salinImsakiyah()">Salin</button></div>
    <div class="card" style="padding:12px 0 6px">
      <div style="padding:0 16px 8px;font-size:12px;color:var(--ink-soft)">${esc(L.nama)} • ${esc((METHODS[SET.method]||METHODS.kemenag).nama)}</div>
      <div class="imsak-wrap"><table class="imsak"><thead><tr><th>Hari</th><th>Tanggal</th><th>Imsak</th><th>Subuh</th><th>Terbit</th><th>Zuhur</th><th>Asar</th><th>Magrib</th><th>Isya</th></tr></thead><tbody>${baris.join("")}</tbody></table></div>
      <div class="note" style="padding:8px 16px 4px">Jadwal mengikuti lokasi di pojok atas Beranda; ganti lokasi (kecamatan atau desa mana pun) lewat tombol lokasi. Geser tabel ke samping untuk melihat semua kolom.</div>
    </div>`;
}

/* ======================= HALAMAN: KALENDER HIJRIAH ======================= */
let KAL_Y,KAL_M; // tahun & bulan Masehi (0-indeks) yg sedang ditampilkan; diisi saat pertama dibuka
function ubahBulanKalender(dir){
  KAL_M+=dir;
  if(KAL_M<0){KAL_M=11;KAL_Y--;}else if(KAL_M>11){KAL_M=0;KAL_Y++;}
  RENDER.kalender();
}
function keBulanIniKalender(){const n=new Date();KAL_Y=n.getFullYear();KAL_M=n.getMonth();RENDER.kalender();}
function bukaHariKalender(k){
  if(tglBelumTiba(k)){toast(pesanTglBelumTiba(k));return;} // tanggal mendatang hanya untuk dilihat, bukan dicatat
  tglPilih=k;go("ibadah");
}
RENDER.kalender=function(){
  const now=new Date();
  if(KAL_Y==null){KAL_Y=now.getFullYear();KAL_M=now.getMonth();}
  const daysInMonth=new Date(KAL_Y,KAL_M+1,0).getDate();
  const startDow=new Date(KAL_Y,KAL_M,1).getDay();
  const todayKey=dkey(now);
  const cells=[];
  for(let i=0;i<startDow;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++){
    const dt=new Date(KAL_Y,KAL_M,d);
    const h=hijriYMD(dt);
    let ev=h?EVENTS_HIJRI.find(e=>e[0]===h.m&&e[1]===h.d):null;
    if(!ev&&h&&h.m!==9&&[13,14,15].includes(h.d))ev=[h.m,h.d,"Ayyamul Bidh: dianjurkan puasa","puasa"];
    cells.push({d,dt,h,ev,today:dkey(dt)===todayKey});
  }
  while(cells.length%7!==0)cells.push(null);
  const isi=cells.filter(Boolean);
  const hFirst=isi[0]&&isi[0].h, hLast=isi[isi.length-1]&&isi[isi.length-1].h;
  const rangeHijri=hFirst&&hLast?(hFirst.m===hLast.m?`${hFirst.d}-${hLast.d} ${HIJRI_BULAN[hFirst.m-1]} ${hFirst.y} H`:`${hFirst.d} ${HIJRI_BULAN[hFirst.m-1]} ${hFirst.y} sampai ${hLast.d} ${HIJRI_BULAN[hLast.m-1]} ${hLast.y} H`):"";
  const eventsInMonth=isi.filter(c=>c.ev);
  const warnaDot=t=>t==="besar"?"var(--gold)":t==="puasa"?"var(--emerald-3)":"var(--amethyst)";
  const bulanHijriUnik=[...new Set(isi.map(c=>c.h&&c.h.m).filter(Boolean))];
  const labelBulanHijri=bulanHijriUnik.map(m=>HIJRI_BULAN[m-1]).join(" / ");
  $("#pg-kalender").innerHTML=backHeader("Kalender Hijriah",rangeHijri,"lainnya")+
  `<div class="wrap">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <button class="icon-btn" onclick="ubahBulanKalender(-1)">${svg(IC.back)}</button>
        <div style="text-align:center">
          <b style="font-size:15px">${BULAN[KAL_M]} ${KAL_Y}</b>
          ${labelBulanHijri?`<div style="font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:1px">${labelBulanHijri}</div>`:""}
        </div>
        <button class="icon-btn" onclick="ubahBulanKalender(1)">${svg(IC.fwd)}</button>
      </div>
      <div class="kalgrid kalhead">${HARI.map(h=>`<div>${h.slice(0,3)}</div>`).join("")}</div>
      <div class="kalgrid">${cells.map(c=>{
        if(!c)return `<div class="kalcell kosong"></div>`;
        return `<div class="kalcell ${c.today?"today":""}${c.ev?` evt ev-${c.ev[3]}`:""}" onclick="bukaHariKalender('${dkey(c.dt)}')" title="${c.ev?esc(c.ev[2]):""}">
          <span class="g">${c.d}</span><span class="hj">${c.h?angkaArab(c.h.d)+"/"+angkaArab(c.h.m):""}</span>
        </div>`;
      }).join("")}</div>
      <button class="chip" style="margin-top:12px" onclick="keBulanIniKalender()">Hari ini</button>
      <div style="display:flex;gap:14px;justify-content:center;margin-top:12px;flex-wrap:wrap">
        ${[["var(--gold)","Hari besar"],["var(--emerald-3)","Anjuran puasa"],["var(--amethyst)","Info/malam istimewa"],["var(--sapphire)","Hari ini"]].map(([c,l])=>`<div style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:${c};flex:none"></span><span style="font-size:10.5px;color:var(--ink-faint);font-weight:600">${l}</span></div>`).join("")}
      </div>
    </div>
    <div class="note">Angka besar tiap sel adalah tanggal Masehi; angka Arab kecil di bawahnya adalah tanggal Hijriah dalam format tanggal/bulan (mis. ٥/٩ = 5 Ramadhan).</div>
    <div class="sec-title"><h2>Tanggal penting bulan ini</h2></div>
    <div class="card">${eventsInMonth.length?eventsInMonth.map((c,i)=>`<div style="padding:11px 0;${i?"border-top:1px solid var(--line-2)":""};display:flex;align-items:center;gap:10px">
      <span class="dot" style="position:static;flex:none;width:8px;height:8px;border-radius:50%;background:${warnaDot(c.ev[3])}"></span>
      <div style="flex:1"><b style="font-size:13.5px">${c.ev[2]}</b><div style="font-size:11.5px;color:var(--ink-faint);margin-top:2px">${HARI[c.dt.getDay()]}, ${c.d} ${BULAN[KAL_M]} • ${c.h.d} ${HIJRI_BULAN[c.h.m-1]} ${c.h.y} H</div></div>
    </div>`).join(""):`<div class="note">Tidak ada tanggal penting Hijriah pada bulan ini.</div>`}</div>
    <div class="note">Tanggal Hijriah dihitung dari kalender bawaan peramban (Umm al-Qura bila tersedia)${SET.koreksiHijri?`, dengan koreksi manual ${SET.koreksiHijri>0?"+":""}${SET.koreksiHijri} hari`:""}, bisa berbeda satu hari dari hasil sidang isbat/rukyatulhilal Kemenag, jadikan pengumuman resmi sebagai rujukan akhir, terutama utk awal/akhir Ramadhan dan hari raya.</div>
  </div>`;
};

/* ======================= HALAMAN: KALENDER HAID ======================= */
/* Kalender haid & nifas untuk beberapa orang (istri, putri, ibu, saudari, atau diri sendiri), dengan penilaian
   fikih otomatis, qada puasa Ramadhan, statistik siklus, dan kunci privasi (PIN).

   Landasan fikih (ringkas; uraian lebih lengkap tampil di sheet "Info fikih" pada halaman ini):
   - QS. Al-Baqarah 2:222 - haid adalah "adzan" (gangguan/kotoran): jauhilah istri pada waktu haid dan jangan mendekati
     (berjima') mereka sampai suci; bila telah bersuci (mandi), campurilah sebagaimana diperintahkan Allah.
   - HR. Muslim (Mu'adzah bertanya kepada Aisyah r.a.): "Kami mengalami haid, lalu kami diperintahkan mengqada puasa
     dan tidak diperintahkan mengqada salat." -> puasa Ramadhan yg terlewat karena haid/nifas WAJIB diqada, salat tidak.
     Ini dasar fitur "Utang puasa (qada)".
   - HR. Bukhari & Muslim (Aisyah r.a.): "Aku punya utang puasa Ramadhan dan tak sanggup mengqadanya kecuali di bulan
     Sya'ban." -> dasar pengingat qada di bulan Sya'ban.
   - HR. Muslim (Anas r.a.): "Lakukanlah segala sesuatu (bersama istri yang haid) kecuali nikah (jima')." Batas bercumbu
     selain jima' diperselisihkan ulama, karena itu aplikasi hanya menyebut jima' yg ditahan.
   - HR. Bukhari & Muslim (Aisyah r.a. saat haji): "Kerjakan apa yg dikerjakan orang berhaji, hanya saja jangan tawaf di
     Baitullah sampai engkau suci." -> tawaf ditahan selama haid.
   - HR. Bukhari (Fathimah bintu Abi Hubaisy r.a.): "Itu hanyalah darah penyakit, bukan haid. Bila datang haidmu,
     tinggalkan salat; bila masanya telah berlalu, cucilah darah darimu dan salatlah." -> darah di luar masa haid
     = istihadhah; haid berakhir dg berhentinya darah, lalu mandi & salat.
   - HR. Abu Dawud, Tirmidzi, Ahmad (Hamnah bintu Jahsy r.a.): "...haidlah enam atau tujuh hari menurut ilmu Allah, lalu
     mandilah..." -> dasar "ghalib/umumnya" 6-7 hari.
   - HR. Bukhari & Abu Dawud (Ummu 'Athiyyah r.a.): "Kami tidak menganggap darah keruh dan kekuningan sesudah suci
     sebagai sesuatu (haid)."
   - HR. Abu Dawud, Tirmidzi, Ibnu Majah (Ummu Salamah r.a.): wanita nifas menunggu (tidak salat) empat puluh hari pada
     masa Nabi ﷺ -> dasar kebiasaan nifas 40 hari (dinilai hasan oleh sebagian ulama). Syafi'iyah menetapkan maksimal 60
     hari berdasarkan istiqra' (penelusuran kebiasaan wanita).
   Batas minimal/maksimal haid & masa suci minimal BUKAN nash sharih: ia ditetapkan ulama melalui istiqra', karena itu
   berbeda antarmazhab (lihat HAID_MAZHAB). Mazhab Maliki tidak menetapkan batas minimal yg baku (cukup setetes) sehingga
   tidak dinilai otomatis. Aplikasi hanya membantu mencatat, menandai, & mengingatkan; penetapan kasus khusus (mubtadi'ah,
   mu'tadah, mutahayyirah, darah terputus-putus) tetap dirujuk kepada ustadz/ah atau dokter. */
const HAID_MAZHAB={
  syafii:{nama:"Syafi'i",minJam:24,maxHari:15,suciMin:15,nifasMax:60,nifasUmum:40},
  hanafi:{nama:"Hanafi",minJam:72,maxHari:10,suciMin:15,nifasMax:40,nifasUmum:40},
  hanbali:{nama:"Hanbali",minJam:24,maxHari:15,suciMin:13,nifasMax:40,nifasUmum:40}
};
const HAID_RELASI=["Istri","Anak perempuan","Ibu","Kakak perempuan","Adik perempuan","Diri sendiri","Lainnya"];
const HAID_WARNA=["var(--emerald-3)","var(--gold)","var(--sapphire)","var(--amethyst)","#C2778A","#7F9440"];
const hd_d=k=>new Date(k+"T12:00:00");                                   // tanggal pada siang hari (aman dari pergeseran DST)
const hd_diff=(a,b)=>Math.round((hd_d(b)-hd_d(a))/864e5);                // selisih hari b - a
const hd_tambah=(k,n)=>{const d=hd_d(k);d.setDate(d.getDate()+n);return dkey(d);};
const hd_id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hd_ptgl=k=>{const d=hd_d(k);return `${d.getDate()} ${BULAN[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;};
const hd_urut=(a,b)=>a.mulai<b.mulai?-1:a.mulai>b.mulai?1:0;
const hd_jam=v=>/^([01]\d|2[0-3]):[0-5]\d$/.test(v||"")?v:null;          // "HH:MM" valid atau null (data impor bisa saja rusak)

function haidNormalisasi(h){
  const src=(h&&typeof h==="object")?h:{};
  const d={v:1,orang:[],catat:{},pilih:null,mazhab:"syafii",pin:null,beranda:false};
  if(HAID_MAZHAB[src.mazhab])d.mazhab=src.mazhab;
  if(typeof src.pin==="string"&&src.pin)d.pin=src.pin;
  d.beranda=!!src.beranda&&!d.pin;
  const map={};
  (Array.isArray(src.orang)?src.orang:[]).forEach(o=>{
    if(!o||o.id==null)return;
    const nid=String(o.id).replace(/[^a-zA-Z0-9_-]/g,"")||hd_id();
    if(map[o.id]||d.orang.some(x=>x.id===nid))return;
    map[o.id]=nid;
    d.orang.push({id:nid,nama:String(o.nama||"Tanpa nama").slice(0,24),relasi:HAID_RELASI.includes(o.relasi)?o.relasi:"Lainnya",
      warna:HAID_WARNA.includes(o.warna)?o.warna:HAID_WARNA[0],hamil:!!o.hamil,
      qada:(o.qada&&typeof o.qada==="object")?o.qada:{}});
  });
  const sc=(src.catat&&typeof src.catat==="object")?src.catat:{};
  Object.keys(map).forEach(oid=>{
    const arr=Array.isArray(sc[oid])?sc[oid]:[];

      .map(r=>({id:String(r.id||hd_id()).replace(/[^a-zA-Z0-9_-]/g,"")||hd_id(),jenis:r.jenis==="nifas"?"nifas":"haid",mulai:r.mulai,
        jm:hd_jam(r.jm),selesai:r.selesai||null,js:r.selesai?hd_jam(r.js):null,
        cat:String(r.cat||"").slice(0,120)})).sort(hd_urut);
  });
  Object.keys(map).forEach(oid=>{if(!d.catat[map[oid]])d.catat[map[oid]]=[];});
  d.orang.forEach(o=>{if(!d.catat[o.id])d.catat[o.id]=[];});
  d.pilih=d.orang.some(o=>o.id===src.pilih||o.id===map[src.pilih])?(map[src.pilih]||src.pilih):(d.orang[0]?d.orang[0].id:null);
  return d;
}

/** True bila tanggal tgl termasuk masa haid/nifas profil "Diri sendiri", dipakai untuk membebaskan
    hari itu dari kewajiban salat (skor, "utang salat" otomatis) & puasa (pengingat Ramadhan), karena

    Aman dipanggil dari mana pun (fungsi biasa -> di-hoist) walau modul haid belum tentu dipakai. */
function haidBebasSalat(tgl){

  return (HAID.catat[diri.id]||[]).some(r=>tgl>=r.mulai&&tgl<=(r.selesai||today()));

let HAID_PROMPT_TUTUP={};


/* ---------- perhitungan ---------- */
/** Lama satu catatan. Bila jam mulai & selesai terisi -> jam presisi; bila tidak -> dihitung dari jumlah tanggal
    (perkiraan; batas atas). akhirDefault dipakai utk catatan yg masih berjalan. */
function haidDurasi(r,akhirDefault){
  const sel=r.selesai||akhirDefault;
  const hari=Math.max(1,hd_diff(r.mulai,sel)+1);
  if(r.jm&&r.js&&r.selesai){
    const jam=(new Date(r.selesai+"T"+r.js)-new Date(r.mulai+"T"+r.jm))/36e5;
    if(jam>0)return {hari,jam,perkiraan:false};
  }
  return {hari,jam:hari*24,perkiraan:true};
}
/** Penilaian satu catatan menurut mazhab. prev = catatan HAID sebelumnya yg sudah selesai (utk cek masa suci) atau null.
    level: ok | ragu (butuh jam utk kepastian) | kurang (< batas minimal) | lebih (> batas maksimal). */
function haidNilai(r,prev,mz){
  const M=HAID_MAZHAB[mz]||HAID_MAZHAB.syafii, dur=haidDurasi(r,today()), sel=!!r.selesai;
  const res={dur,level:"ok",pesan:"",suci:null,suciPendek:false};
  if(r.jenis==="nifas"){
    if(dur.hari>M.nifasMax+1){res.level="lebih";res.pesan=`Melebihi batas maksimal nifas (${M.nifasMax} hari) menurut mazhab ${M.nama}`;}
    else if(sel)res.pesan=dur.hari<=M.nifasUmum?"Dalam kebiasaan nifas (sekitar 40 hari)":`Masih dalam batas maksimal nifas (${M.nifasMax} hari)`;
    return res;
  }
  /* Bila hanya tanggal (tanpa jam), hitungan hari inklusif adalah batas ATAS lamanya; selisih 1 hari dari batas belum bisa
     dipastikan melampaui atau tidak, jadi ditandai "ragu" (minta jam), bukan langsung "lebih". */
  if(dur.perkiraan?dur.hari>M.maxHari+1:dur.jam>M.maxHari*24){
    res.level="lebih";res.pesan=`Melebihi batas maksimal haid (${M.maxHari} hari, mazhab ${M.nama}); kelebihannya perlu ditetapkan ustadz/ah`;
  }else if(dur.perkiraan&&dur.hari===M.maxHari+1){
    res.level="ragu";res.pesan=`Isi jam mulai & selesai untuk memastikan tidak melewati batas maksimal ${M.maxHari} hari`;
  }else if(sel){
    const hariMin=Math.ceil(M.minJam/24);
    if(dur.jam<M.minJam||(dur.perkiraan&&dur.hari<hariMin)){res.level="kurang";res.pesan=`Kurang dari batas minimal haid (${M.minJam===24?"24 jam":"3 hari"}, mazhab ${M.nama}), darah demikian tidak dihukumi haid`;}
    else if(dur.perkiraan&&dur.hari===hariMin){res.level="ragu";res.pesan="Isi jam mulai & selesai agar bisa dipastikan sudah mencapai batas minimal";}
    else res.pesan=(dur.hari>=6&&dur.hari<=7)?"Dalam batas & sesuai kebiasaan umum (6-7 hari)":"Dalam batas haid";
  }
  if(prev&&prev.selesai){
    const gap=(prev.js&&r.jm)?(new Date(r.mulai+"T"+r.jm)-new Date(prev.selesai+"T"+prev.js))/864e5:hd_diff(prev.selesai,r.mulai)-1;
    res.suci=Math.max(0,Math.floor(gap));
    if(gap<M.suciMin)res.suciPendek=true;
  }
  return res;
}
/** Riwayat berurut + penilaian + panjang siklus (jarak antar-mulai haid, tanpa nifas di antaranya). */
function haidRiwayat(id){
  const rec=(HAID.catat[id]||[]).slice().sort(hd_urut); let prev=null;
  return rec.map(r=>{
    const prevSel=(r.jenis==="haid"&&prev&&prev.selesai)?prev:null;
    const n=haidNilai(r,prevSel,HAID.mazhab);
    const siklus=(r.jenis==="haid"&&prev&&!rec.some(x=>x.jenis==="nifas"&&x.mulai>prev.mulai&&x.mulai<r.mulai))?hd_diff(prev.mulai,r.mulai):null;
    if(r.jenis==="haid")prev=r;
    return {r,n,siklus};
  });
}
function haidStat(id){
  const t=today(), riwayat=haidRiwayat(id), o=HAID.orang.find(x=>x.id===id)||{};
  const haid=riwayat.filter(x=>x.r.jenis==="haid"), nifas=riwayat.filter(x=>x.r.jenis==="nifas");
  const siklus=haid.filter(x=>x.siklus!=null&&x.siklus>=10&&x.siklus<=90).map(x=>({dari:x.r.mulai,hari:x.siklus}));   // buang pencilan
  const durs=haid.filter(x=>x.r.selesai&&x.n.level!=="kurang").map(x=>x.n.dur.hari);
  const avg=a=>a.length?a.reduce((p,c)=>p+c,0)/a.length:null;
  const s6=siklus.slice(-6).map(x=>x.hari), d6=durs.slice(-6);
  const avgSiklus=avg(s6), avgDur=avg(d6);
  const sd=s6.length>=3?Math.sqrt(s6.reduce((p,c)=>p+(c-avgSiklus)**2,0)/s6.length):null;
  const hTerakhir=haid.length?haid[haid.length-1].r:null, nTerakhir=nifas.length?nifas[nifas.length-1].r:null;
  const nifasSetelah=!!nTerakhir&&(!hTerakhir||nTerakhir.mulai>hTerakhir.mulai);
  let next=null;
  if(avgSiklus&&hTerakhir&&!o.hamil&&!nifasSetelah){
    const rd=Math.round(avgSiklus), dur=Math.max(1,Math.round(avgDur||7));
    next={mulai:hd_tambah(hTerakhir.mulai,rd),rd,dur,margin:clamp(Math.round(sd==null?2:sd),1,4)};
  }
  return {riwayat,haid,nifas,siklus,avgSiklus,avgDur,sd,next,
    minS:s6.length?Math.min(...siklus.map(x=>x.hari)):null,maxS:s6.length?Math.max(...siklus.map(x=>x.hari)):null,t};
}
function haidStatus(o,st){
  const t=today(), rec=(HAID.catat[o.id]||[]).slice().sort(hd_urut);

/** Sapaan cerdas: tanya "sudah haid?" saat perkiraan tiba, atau "sudah suci?" saat masa aktif sudah

/** Peta tanggal -> penanda (utk kalender) + tanggal perkiraan masa haid ke depan (3 siklus). */
function haidPeta(id,st){
  const t=today(), tanda={}, pred={};
  (HAID.catat[id]||[]).forEach(r=>{
    const n=hd_diff(r.mulai,r.selesai||t); if(n<0)return;
    for(let i=0;i<=Math.min(n,120);i++)tanda[hd_tambah(r.mulai,i)]={t:r.jenis,n:i+1,r:r.id};
  });
  if(st.next)for(let k=0;k<3;k++){
    const s=hd_tambah(st.next.mulai,st.next.rd*k);
    for(let j=0;j<st.next.dur;j++){const d=hd_tambah(s,j);if(d>=t&&!tanda[d])pred[d]=1;}
  }
  return {tanda,pred};
}
/** Hari haid/nifas yang jatuh di bulan Ramadhan -> jumlah utang puasa per tahun Hijriah.
    Darah yg dinilai "kurang dari batas minimal" tidak dihukumi haid, jadi tidak membatalkan puasa & tidak dihitung. */
function haidQada(id){
  const res={}, t=today();
  (HAID.catat[id]||[]).forEach(r=>{
    if(r.jenis==="haid"&&haidNilai(r,null,HAID.mazhab).level==="kurang")return;
    const n=hd_diff(r.mulai,r.selesai||t); if(n<0||n>120)return;
    for(let i=0;i<=n;i++){const h=hijriYMD(hd_d(hd_tambah(r.mulai,i)));if(h&&h.m===9)res[h.y]=(res[h.y]||0)+1;}
  });
  return res;
}

function haidSimpanCatat(rid){
  const o=haidOrangAktif(); if(!o)return;
  const t=today(), jenis=HF_JENIS, mulai=$("#hcMulai").value, jm=$("#hcJm").value||null;
  const selOn=$("#hcSelOn").classList.contains("on"), selesai=selOn?$("#hcSel").value:null, js=selOn?($("#hcJs").value||null):null;
  if(!mulai){toast("Isi tanggal mulai");return;}
  if(mulai>t){toast("Tanggal mulai tidak boleh di masa depan");return;}
  if(selOn){
    if(!selesai){toast("Isi tanggal berhenti");return;}
    if(selesai<mulai){toast("Tanggal berhenti sebelum tanggal mulai");return;}
    if(selesai>t){toast("Tanggal berhenti tidak boleh di masa depan");return;}
    if(selesai===mulai&&jm&&js&&js<=jm){toast("Jam berhenti harus setelah jam mulai");return;}
  }
  if(hd_diff(mulai,selesai||t)+1>(jenis==="nifas"?90:40)){toast("Rentang terlalu panjang, periksa tanggalnya");return;}
  const daftar=HAID.catat[o.id]||(HAID.catat[o.id]=[]), s2=selesai||t;
  if(daftar.some(x=>x.id!==rid&&!((x.selesai||t)<mulai||x.mulai>s2))){toast("Tanggalnya bertumpuk dengan catatan lain");return;}
  if(!selOn&&daftar.some(x=>x.id!==rid&&!x.selesai)){toast("Masih ada catatan yang belum diakhiri");return;}
  const data={jenis,mulai,jm,selesai,js,cat:($("#hcCat").value||"").trim().slice(0,120)};
  if(rid){const x=daftar.find(z=>z.id===rid);if(x)Object.assign(x,data);}else daftar.push(Object.assign({id:hd_id()},data));
  daftar.sort(hd_urut);
  if(jenis==="nifas"&&o.hamil)o.hamil=false;
  haidSimpan(); closeSheet(); RENDER.haid(); buzz(10); toast(rid?"Catatan diperbarui":"Catatan disimpan");
}

/** Hash ringan (cyrb53 + garam), cukup utk mengunci TAMPILAN, bukan enkripsi (data tetap di localStorage). */
function haidHashPin(p){
  let h1=0xdeadbeef^17,h2=0x41c6ce57^17; const s="lw-haid|"+p;
  for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}

/* ======================= KONFIRMASI SALAT & UTANG QADA ======================= */
/* Aplikasi TIDAK menebak. Salat yang waktunya sudah habis tanpa catatan berstatus "Belum dicatat", bisa
   saja sudah dikerjakan tapi lupa dicatat. Hanya bila pengguna sendiri menjawab "Terlewat" (lewat pertanyaan
   "Sudah salat atau terlewat?" atau chip Terlewat) salat itu masuk utang qada & statistik terlewat.
   Dasar: kewajiban qada jatuh pada salat yang benar-benar terlewat, dan tidak gugur karena lupa/tertidur -
   HR. Bukhari & Muslim, Anas bin Malik r.a. (lihat DALIL_QADA_UMUM). Qada tidak terikat jam tertentu
   (boleh berjamaah/sendiri, kapan pun teringat), jadi menandai "Sudah diqada" tanpa validasi jam.
   Wanita yg haid/nifas (profil "Diri sendiri") dikecualikan: salat tidak wajib atasnya saat itu & tidak
   diqada (HR. Muslim, Mu'adzah bertanya kepada Aisyah r.a.). */
const KONF_HARI=7; // jangkauan pertanyaan konfirmasi ke belakang (hari)
const usTgl=n=>{const d=new Date();d.setDate(d.getDate()-n);return dkey(d);};
function tsSelesaiFardhu(k,tgl){
  const dt=new Date(tgl+"T00:00:00"), {selesai}=jendelaSalat(k,dt);
  return dt.getTime()+selesai*3600000;
}
/** True bila hari tsb tak berisi data apa pun (dipakai membersihkan sisa catatan otomatis versi lama). */
function hariKosong(d){
  if(!d)return true;
  const known=new Set(["fardhu","rawatib","sunnah","amalan","jumat","musafir","tilawah","halaman","puasa","istighfar","shalawat","catatan"]);
  if(Object.keys(d).some(x=>!known.has(x)))return false;
  if(Object.keys(d.fardhu||{}).some(k=>{const f=d.fardhu[k];return f&&(f.cara||f.jamak||f.qasar||f.tempat);}))return false;
  const any=o=>Object.keys(o||{}).some(k=>o[k]);
  return !(any(d.rawatib)||any(d.sunnah)||any(d.amalan)||any(d.jumat)||d.musafir||d.tilawah>0||(d.halaman||[]).length||(d.puasa&&d.puasa!=="-")||d.istighfar>0||d.shalawat>0||(d.catatan||"").trim());
}
/** Migrasi sekali jalan: versi sebelumnya menulis "Terlewat" otomatis (auto:true) ke 30 hari terakhir. Itu
    menyimpulkan tanpa konfirmasi, jadi dikembalikan ke "belum dicatat". Yg sudah ditandai "Sudah diqada"
    oleh pengguna dipertahankan (dianggap konfirmasi). Hari yg jadi kosong dihapus agar tak dianggap "mulai pakai". */
function migrasiUtangOtomatis(){
  if(LS.get("utangMigrasi",0)>=2)return;
  let ubah=false;
  Object.keys(TRACK).forEach(k=>{
    const d=TRACK[k]; if(!d||!d.fardhu)return; let ada=false;
    PRAYERS.forEach(p=>{const fi=d.fardhu[p.k]; if(fi&&fi.auto){
      if(fi.cara==="tidak"&&!fi.qadaSelesai)d.fardhu[p.k]={status:null}; else delete fi.auto;
      ada=true;}});
    if(ada){ubah=true; if(hariKosong(d))delete TRACK[k];}
  });
  if(ubah)LS.set("track",TRACK);
  LS.set("utangMigrasi",2);
}
/** Batas awal "sejak mulai memakai aplikasi": salat yg waktunya MULAI sebelum titik ini tak pernah ditanyakan
    (tak ada riwayat = bukan berarti terlewat). Pemakai baru: saat pertama dibuka. Pemakai lama: hari catatan
    pertamanya. Hasil pemulihan cadangan yg memuat data lebih lama ikut memundurkan batas ini. */
function mulaiPakaiTs(){
  migrasiUtangOtomatis();
  const ks=Object.keys(TRACK).sort(), awal=ks.length?new Date(ks[0]+"T00:00:00").getTime():null;
  let st=LS.get("mulaiPakaiTs",null);
  if(st==null){st=awal!=null?awal:Date.now();LS.set("mulaiPakaiTs",st);}
  return (awal!=null&&awal<st-864e5)?awal:st;
}
/** Status satu slot salat pada suatu hari: tercatat | terlewat | uzur | akan | berjalan | sebelum | belum.
    Hanya "belum" yang memicu pertanyaan konfirmasi; "sebelum" = waktunya habis sebelum aplikasi dipakai. */
function statusSlotSalat(tgl,k,dat,MPT){
  const d=dat||getDay(tgl), fi=d.fardhu&&d.fardhu[k];
  if(fi&&fi.cara)return fi.cara==="tidak"?"terlewat":"tercatat";
  if(typeof haidBebasSalat==="function"&&haidBebasSalat(tgl))return "uzur";
  const now=Date.now(), t0=new Date(tgl+"T00:00:00").getTime();
  if(t0>now)return "akan";
  if(MPT==null)MPT=mulaiPakaiTs();
  // Jalan pintas tanpa hitung jadwal: waktu salat hari itu paling lambat habis 36 jam sesudah tengah malam
  // (Isya berakhir saat Subuh besok), dan paling cepat sesudah tengah malam itu sendiri.
  const t36=t0+36*36e5;
  if(t36<=MPT)return "sebelum";                  // semua waktunya habis sebelum mulai dipakai
  if(t0>=MPT&&t36<=now)return "belum";           // semua waktunya sudah habis & sesudah mulai dipakai
  // Konservatif: hanya salat yg waktunya MULAI sesudah aplikasi dipakai yang ditanyakan (bila aplikasi baru
  // dibuka di tengah waktu Zuhur, Zuhur tak ditanya, pengguna belum sempat mencatat apa pun).
  const w=jendelaSalat(k,new Date(tgl+"T00:00:00")), ts=t0+w.selesai*36e5, tm=t0+w.mulai*36e5;
  if(now<ts)return "berjalan";
  return tm<MPT?"sebelum":"belum";
}
/** Salat yg waktunya habis tanpa catatan (perlu konfirmasi), KONF_HARI terakhir, terbaru dulu. */
function daftarKonfirmasiSalat(){
  const hasil=[], MPT=mulaiPakaiTs();
  for(let i=0;i<KONF_HARI;i++){
    const tgl=usTgl(i), d=getDay(tgl);
    for(let j=PRAYERS.length-1;j>=0;j--){const k=PRAYERS[j].k; if(statusSlotSalat(tgl,k,d,MPT)==="belum")hasil.push({tgl,k});}
  }
  return hasil;
}
/** Salat berstatus Terlewat (dikonfirmasi pengguna) yg belum ditandai selesai diqada, SELURUH riwayat,
    karena utang tak hilang hanya karena lama. Terbaru dulu. */
function daftarUtangSalat(){
  const hasil=[];
  Object.keys(TRACK).sort().reverse().forEach(tgl=>{
    const d=TRACK[tgl]; if(!d||!d.fardhu)return;
    for(let j=PRAYERS.length-1;j>=0;j--){const k=PRAYERS[j].k, fi=d.fardhu[k];
      if(fi&&fi.cara==="tidak"&&!fi.qadaSelesai)hasil.push({tgl,k});}
  });
  return hasil;
}

async function unduhSemua(){

  if(!sisa.length){txt.textContent="Semua surat sudah tersimpan.";bar.style.width="100%";return;}

function kartuRentetanBeranda(){
  const n=streakHari(), best=Math.max(streakTerbaik(),n), now=new Date(), nm=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
  let dots="";
  for(let i=6;i>=0;i--){
    const x=new Date(now); x.setDate(x.getDate()-i); const s=skorHari(dkey(x)), v=s.uzurHaid?-1:s.fardu;
    dots+=`<div class="rtnd${i===0?" t":""}${v===5?" full":""}${v<0?" uz":""}"><i style="--p:${v<0?0:v*20}%">${v<0?"–":v}</i><span>${nm[x.getDay()]}</span></div>`;
  }
  const jum=now.getDay()===5;
  return `<section class="card rtn${jum?" jum":""}"><div class="rtn-top"><div class="rtn-fl">${svg(IC.fire,"")}</div>
    <div class="rtn-tx"><b>${n} hari beruntun</b><span>${n?"Salat 5 waktu tanpa terlewat":"Mulai rentetan hari ini"} · terbaik ${best} hari</span></div>
    <button class="chip${jum?" on":""}" onclick="rekapPekan()">${jum?"Rekap Jumat":"Rekap pekan"}</button></div>
    <div class="rtn-row">${dots}</div></section>`;
}
function rekapPekan(){
  const hit=off=>{const o={fardu:0,wajib:0,tepat:0,jamaah:0,tilawah:0,puasa:0,persen:0,n:0,terbaik:null};
    for(let i=6;i>=0;i--){const x=new Date(); x.setDate(x.getDate()-off-i); const k=dkey(x), d=getDay(k), s=skorHari(k);
      if(s.uzurHaid)continue;
      o.wajib+=5; o.fardu+=s.fardu; o.jamaah+=s.jamaah; o.tilawah+=s.tilawah||0; o.persen+=s.persen; o.n++;
      PRAYERS.forEach(p=>{const f=d.fardhu[p.k]||{}; if(f.cara&&f.cara!=="tidak"&&!f.qada&&(f.level==="awal"||f.level==="tepat"))o.tepat++;});
      if(d.puasa&&d.puasa!=="-")o.puasa++;
      if(!o.terbaik||s.persen>o.terbaik.p)o.terbaik={p:s.persen,x};}
    o.rata=o.n?Math.round(o.persen/o.n):0; return o;};
  const a=hit(0), b=hit(7), beda=b.n&&b.persen>0?a.rata-b.rata:null;
  const pesan=a.rata>=85?"Pekan yang luar biasa. Pertahankan, Allah mencintai amal yang terus-menerus.":a.rata>=60?"Pekan yang baik. Satu perbaikan kecil di pekan depan sudah berarti.":a.rata>0?"Masih ada ruang tumbuh. Mulai dari menjaga salat tepat waktu.":"Belum ada catatan pekan ini. Mulai hari ini, sedikit pun tak apa.";
  const t=(v,l)=>`<div class="rk-t"><b>${v}</b><span>${l}</span></div>`;
  const hr=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
  openSheet("Rekap 7 hari terakhir",`
    <div class="rk-hero"><b>${a.rata}%</b><span>rata-rata skor ibadah${beda==null?"":` · ${beda>=0?"naik":"turun"} ${Math.abs(beda)} poin dari pekan lalu`}</span></div>
    <div class="rk-g">${t(a.fardu+"/"+(a.wajib||35),"Salat fardu")}${t(a.tepat,"Tepat waktu")}${t(a.jamaah,"Berjamaah")}${t(a.tilawah,"Halaman tilawah")}${t(a.puasa,"Puasa")}${t(a.terbaik&&a.terbaik.p>0?hr[a.terbaik.x.getDay()]:"-","Hari terbaik")}</div>
    <div style="font-size:13.5px;line-height:1.75;color:var(--ink-soft);padding:6px 2px 4px">${pesan}</div>
    <div style="font-size:11.5px;color:var(--ink-faint);padding:0 2px 8px">Hari uzur syar'i tidak dihitung.</div>
    <button class="btn ghost" onclick="closeSheet();go('statistik')">Lihat statistik lengkap</button>`);
}

let lastNotif=LS.get("lastnotif",""); let hariTerakhir=today();
/** Sapaan sekali sehari untuk awal Ramadhan, Idul Fitri, Idul Adha, dan Hari Arafah.
    Ditampilkan sebagai toast selalu; notifikasi sistem hanya bila pengingat diaktifkan. */
function cekHariBesar(){
  const st=statusHijriTanggal(new Date()); if(!st.h)return;
  const key=today()+":hb";
  if(LS.get("lasthb","")===key)return;
  let pesan=null;
  if(st.h.m===9&&st.h.d===1)pesan=`Marhaban ya Ramadhan ${st.h.y} H, puasa Ramadhan dimulai hari ini`;
  else if(st.isIdulFitri)pesan=`Selamat Idul Fitri ${st.h.y} H, Taqabbalallāhu minnā wa minkum`;
  else if(st.isIdulAdha)pesan=`Selamat Idul Adha ${st.h.y} H, Taqabbalallāhu minnā wa minkum`;
  else if(st.isArafah)pesan="Hari ini Hari Arafah: dianjurkan berpuasa Arafah";
  if(pesan){
    LS.set("lasthb",key); toast(pesan); buzz([30,60,30,60,30]);
    try{if(SET.notif&&"Notification" in window&&Notification.permission==="granted")new Notification("Lima Waktu",{body:pesan,silent:false});}catch(e){}
  }
}
/* Cek pd tanggal 29 bulan Hijriah yg mendahului bulan penting (lihat BULAN_ISBAT_BERIKUTNYA di atas). */
function cekSidangIsbat(){
  const st=statusHijriTanggal(new Date()); if(!st.h||st.h.d!==29)return;
  const target=BULAN_ISBAT_BERIKUTNYA[st.h.m]; if(!target)return;
  const key=today()+":ib";
  if(LS.get("lastib","")===key)return;
  LS.set("lastib",key);
  const pesan=`Malam ini (29 ${HIJRI_BULAN[st.h.m-1]}) kemungkinan sidang isbat Kemenag menentukan awal ${HIJRI_BULAN[target-1]}. Cek pengumuman resminya, lalu sesuaikan Koreksi Hijriah di halaman Ramadhan & hari besar bila berbeda.`;
  toast(pesan); buzz([20,40,20]);
  try{if(SET.notif&&"Notification" in window&&Notification.permission==="granted")new Notification("Lima Waktu",{body:pesan,silent:false});}catch(e){}
}
function ujiPengingat(){
  if(!SET.notif){toast("Aktifkan pengingat waktu salat dulu");return;}
  buzz([30,60,30]); toast("Ini contoh pengingat. Bila notifikasi sistem tidak muncul, cek izin notifikasi peramban.");
  try{if("Notification" in window&&Notification.permission==="granted")new Notification("Lima Waktu",{body:"Contoh pengingat berhasil",silent:false});}catch(e){}
}
function cekPengingat(){
  if(today()!==hariTerakhir){hariTerakhir=today();tglPilih=today();if(RENDER[CUR])RENDER[CUR]();}
  cekHariBesar();
  cekSidangIsbat();
  if(!SET.notif)return;
  const now=new Date(), h=now.getHours()+now.getMinutes()/60; const j=jadwalHariIni(now);
  const st=statusHijriTanggal(now);
  if(st.dalamRamadhan){
    const key=today()+"imsak";
    if(h>=j.imsak&&h<j.imsak+2/60&&lastNotif!==key){
      lastNotif=key; LS.set("lastnotif",key); buzz([25,50,25]);
      /* Imsak BUKAN batas syar'i akhir sahur (lihat dalil di faseRamadhanHariIni), teks ini sengaja
         tidak menyebut "sahur berakhir" agar tidak keliru dipahami sebagai batas haram makan-minum. */
      toast("Waktu imsak, batas ihtiyat, sahur sesungguhnya masih boleh sampai masuk waktu Subuh");
      try{if("Notification" in window&&Notification.permission==="granted")new Notification("Waktu Imsak",{body:"Ini batas kehati-hatian, bukan batas syar'i. Sahur tetap sah hingga adzan Subuh.",silent:false});}catch(e){}
    }
  }
  for(const p of PRAYERS){
    const key=today()+p.k;
    if(h>=j[p.k]&&h<j[p.k]+2/60&&lastNotif!==key){
      lastNotif=key; LS.set("lastnotif",key); buzz([40,80,40,80]);
      const buka=(st.dalamRamadhan&&p.k==="maghrib")?", saatnya berbuka puasa":"";
      toast(`Waktu ${p.nama} telah masuk${buka}`);
      try{if("Notification" in window&&Notification.permission==="granted")new Notification("Waktu "+p.nama,{body:`Telah masuk waktu ${p.nama} di ${lokasi().nama}${buka}`,silent:false});}catch(e){}
    }else if(h>=j[p.k]+2/60&&h<=j[p.k]+.75&&!document.hidden&&lastNotif!==key&&LS.get("lastcatch","")!==key){
      /* Aplikasi baru dibuka/diaktifkan lagi setelah waktu masuk (peramban membatasi pewaktu di latar): beri tahu, tanpa notifikasi sistem. */
      LS.set("lastcatch",key); const mnt=Math.round((h-j[p.k])*60);
      toast(`Waktu ${p.nama} sudah masuk ${mnt} menit lalu`); buzz([25,50,25]);
    }
  }
  /* Pengingat sebelum waktu fardu habis, hanya untuk salat yang belum dicatat hari ini. */
  const m=+SET.notifAkhir||0;
  if(m>0){
    for(const p of PRAYERS){
      const w=jendelaSalat(p.k,now); if(h<w.mulai)continue;
      const sisa=(w.selesai-h)*60; if(sisa<=0||sisa>m)continue;
      const key=today()+p.k+"end"; if(LS.get("lastend","")===key)continue;
      const f=(getDay(tglCatatSalat(p.k)).fardhu[p.k])||{}; if(f.cara)continue;
      LS.set("lastend",key); buzz([40,80,40]);
      const akhir=p.k==="subuh"?"berakhir saat terbit matahari":`berakhir pukul ${jamStr(w.selesai%24)}`;
      const ps=`Waktu ${p.nama} tinggal ${Math.max(1,Math.round(sisa))} menit lagi (${akhir}) dan belum dicatat`;
      toast(ps);
      try{if("Notification" in window&&Notification.permission==="granted")new Notification("Waktu "+p.nama+" hampir habis",{body:ps,silent:false});}catch(e){}
    }
  }
}

/* ======================= TOMBOL KEMBALI =======================
   Tombol/gestur kembali di ponsel: tutup sheet, lalu tutup pembaca, lalu mundur satu halaman aplikasi.
   Di Beranda, tekan dua kali (dalam 2 detik) untuk keluar. Satu entri riwayat "penjaga" dipasang setelah
   sentuhan pertama (peramban mengabaikan entri riwayat yang dibuat tanpa interaksi pengguna). */
let GUARD=false, EXIT_ARMED=false, EXIT_T=0;
function tanganiKembali(){
  const sh=$("#sheet"), rd=$("#reader"), rk=$("#rekap");
  if(rk&&rk.classList.contains("on")){tutupRekap();return true;}
  if(sh&&sh.classList.contains("on")){closeSheet();return true;}
  if(rd&&rd.classList.contains("open")){tutupBaca();return true;}
  if(NAVSTACK.length>1){NAVSTACK.pop();go(NAVSTACK[NAVSTACK.length-1],false,true);return true;}
  if(CUR!=="beranda"){NAVSTACK=["beranda"];go("beranda",false,true);return true;}
  return false;
}
function kembaliUI(to){if(!tanganiKembali())go(to||"lainnya");}
function pasangGuard(){
  if(GUARD)return; GUARD=true;
  try{
    if(history.state&&history.state.nuur==="app")return; // dimuat ulang: penjaga sudah ada
    history.replaceState({nuur:"dasar"},"",location.href);
    history.pushState({nuur:"app"},"",location.href);
  }catch(e){GUARD=false;}
}
function pasangKembali(){
  const EV=["pointerup","click","keydown","touchend"];
  const mulai=()=>{EV.forEach(t=>window.removeEventListener(t,mulai,true));pasangGuard();};
  if(navigator.userActivation&&navigator.userActivation.hasBeenActive)pasangGuard();
  else EV.forEach(t=>window.addEventListener(t,mulai,true));
  window.addEventListener("popstate",e=>{
    if(!GUARD)return; const st=e.state;

  });
}

/* Ayat satu blok: bila lebih dari satu baris, ratakan rata kanan-kiri (baris terakhir tetap rata kanan
   secara alami, agar tidak merenggangkan sisa kata yang sedikit); bila hanya satu baris pendek, tetap
   rata kanan supaya kata tidak direnggangkan berlebihan. */
const SEL_ARAB=".tcard .ar,.dz .ar,.ayat-ar,.jfa,.ar";
function rapikanArab(){
