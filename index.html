  }).join("");
  return `<svg viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="93" fill="none" stroke="var(--line)" stroke-width="1.2"/>
    <circle cx="100" cy="100" r="80" fill="none" stroke="var(--gold)" stroke-width=".8" opacity=".5"/>

  const sejajar=K.aligned?a<=6:a<=3; // histeresis agar tidak berkedip di batas
  if(sejajar!==K.aligned){K.aligned=sejajar; if(cmp)cmp.classList.toggle("aligned",sejajar); if(sejajar)buzz(25);}
  const t=K.aligned?`<span class="qalign">Tepat menghadap kiblat</span>`:`Menghadap ${Math.round(K.h)}° • putar ke ${d>0?"kanan":"kiri"} ${Math.round(a)}°`;
  if(t!==K.txt){K.txt=t;hint.innerHTML=t;}
  perbaruiUIKompas();
}
function loopKompas(){
  K.raf=0; if(!K.aktif)return;
  if(CUR!=="kiblat"||document.hidden){hentikanKompas();return;}
  const dh=selisihSudut(K.h,K.disp);
  if(Math.abs(dh)>0.05){K.disp=fixA(K.disp+dh*0.22);terapkanDial();}
  K.raf=requestAnimationFrame(loopKompas);
}
function toggleKompas(){K.aktif?hentikanKompas():aktifkanKompas();}
function aktifkanKompas(){
  if(!window.DeviceOrientationEvent){toast("Perangkat tidak punya sensor arah");return;}
  const mulai=()=>{
    K.aktif=true;K.got=false;K.acc=null;K.aligned=false;K.txt="";K.st="";
    window.addEventListener("deviceorientationabsolute",onOrient,true);
    window.addEventListener("deviceorientation",onOrient,true);
    clearTimeout(K.tOut);
    K.tOut=setTimeout(()=>{if(K.aktif&&!K.got){hentikanKompas();toast("Sensor kompas tidak memberi data. Buka lewat https dan izinkan sensor gerak, atau pakai arah tanpa kompas.");}},3500);
    if(!K.raf)K.raf=requestAnimationFrame(loopKompas);
    perbaruiUIKompas();
  };
  if(typeof DeviceOrientationEvent.requestPermission==="function"){
    DeviceOrientationEvent.requestPermission().then(r=>r==="granted"?mulai():toast("Izin sensor ditolak. Aktifkan akses gerak & orientasi di pengaturan peramban.")).catch(()=>toast("Sensor tidak tersedia"));
  }else mulai();
}
function hentikanKompas(){
  K.aktif=false;K.got=false;
  window.removeEventListener("deviceorientationabsolute",onOrient,true);
  window.removeEventListener("deviceorientation",onOrient,true);
  clearTimeout(K.tOut); if(K.raf){cancelAnimationFrame(K.raf);K.raf=0;}
  K.disp=0;K.h=0; perbaruiUIKompas();
}
/** Arah atas perangkat dari sudut Euler, dikoreksi kemiringan (rumus W3C). */
function headingEuler(al,be,ga){
  const a=al*D2R,b=be*D2R,g=ga*D2R;
  const x=-Math.cos(a)*Math.sin(g)-Math.sin(a)*Math.sin(b)*Math.cos(g);
  const y=-Math.sin(a)*Math.sin(g)+Math.cos(a)*Math.sin(b)*Math.cos(g);
  return fixA(Math.atan2(x,y)*R2D);
}
function onOrient(e){
  if(!K.aktif)return;
  let h=null;
  if(typeof e.webkitCompassHeading==="number"&&e.webkitCompassHeading>=0){
    h=e.webkitCompassHeading; if(typeof e.webkitCompassAccuracy==="number")K.acc=e.webkitCompassAccuracy;
  }else if((e.type==="deviceorientationabsolute"||e.absolute===true)&&typeof e.alpha==="number"){
    h=(typeof e.beta==="number"&&typeof e.gamma==="number")?headingEuler(e.alpha,e.beta,e.gamma):fixA(360-e.alpha);
  }else return; // sudut relatif (bukan utara) diabaikan supaya tidak bercampur dan bergoyang
  if(!isFinite(h))return;
  h=fixA(h+((screen.orientation&&typeof screen.orientation.angle==="number")?screen.orientation.angle:(window.orientation||0)));
  if(!K.got){K.got=true;K.h=h;K.disp=h;}
  else{const d=selisihSudut(h,K.h),m=Math.abs(d);K.h=fixA(K.h+d*(m>25?0.6:m>8?0.3:0.12));}
  const n=performance.now(); if(n-K.lastUI>90){K.lastUI=n;perbaruiInfoKompas();}
}

/* ======================= DATA IBADAH ======================= */
function blankDay(){
  const f={}; PRAYERS.forEach(p=>f[p.k]={status:null});
  const r={}; RAWATIB.forEach(x=>r[x.k]=false);
  const s={}; SUNNAH.forEach(x=>s[x.k]=0);
  const a={}; AMALAN.forEach(x=>a[x.k]=false);
  const jm={}; JUMAT.forEach(x=>jm[x.k]=false);
  return {fardhu:f,rawatib:r,sunnah:s,amalan:a,jumat:jm,tilawah:0,halaman:[],puasa:"-",istighfar:0,shalawat:0,catatan:""};
}
function getDay(k){
  const d=TRACK[k]?JSON.parse(JSON.stringify(TRACK[k])):blankDay();
  const b=blankDay();
  d.fardhu=Object.assign(b.fardhu,d.fardhu||{}); d.rawatib=Object.assign(b.rawatib,d.rawatib||{});
  d.sunnah=Object.assign(b.sunnah,d.sunnah||{}); d.amalan=Object.assign(b.amalan,d.amalan||{}); d.jumat=Object.assign(b.jumat,d.jumat||{});
  if(d.tilawah==null)d.tilawah=0; if(!Array.isArray(d.halaman))d.halaman=[]; if(!d.puasa)d.puasa="-";
  return d;
}
function simpanDay(k,d){TRACK[k]=d;LS.set("track",TRACK);}
function skorHari(k){
  const d=getDay(k);
  const fardu=PRAYERS.filter(p=>d.fardhu[p.k]&&d.fardhu[p.k].cara&&d.fardhu[p.k].cara!=="tidak").length;
  const rawatib=RAWATIB.filter(r=>d.rawatib[r.k]).length;
  const sunah=SUNNAH.filter(s=>d.sunnah[s.k]>0).length;
  const amalan=AMALAN.filter(a=>d.amalan[a.k]).length;
  const jamaah=PRAYERS.filter(p=>isJamaahCara((d.fardhu[p.k]||{}).cara)).length;
  const persen=clamp(Math.round((fardu/5*55)+(rawatib/6*15)+(sunah/SUNNAH.length*14)+(amalan/AMALAN.length*10)+(d.tilawah>0?6:0)),0,100);
  const label=persen>=90?"Masya Allah, hari yang penuh":persen>=70?"Alhamdulillah, hari yang baik":persen>=40?"Terus rapikan, sedikit lagi":persen>0?"Baru dimulai — lanjutkan":"Belum ada catatan hari ini";
  return {fardu,rawatib,sunah,amalan,jamaah,persen,label,tilawah:d.tilawah};
}
function streakHari(){
  let n=0; const d=new Date();
  for(let i=0;i<400;i++){
    const k=dkey(d);
    const s=skorHari(k);
    if(s.fardu>=5){n++;}
    else if(i===0){/* hari berjalan tidak memutus */}
    else break;
    d.setDate(d.getDate()-1);
  }
  return n;
}

/* Aturan pilihan salat fardu:
   - Cara (pilih satu): Berjamaah | Sendiri | Terlewat.
   - Masbuk = bagian dari Berjamaah, jadi hanya aktif bila Berjamaah dipilih (Berjamaah + Masbuk).
   - Qada = tambahan untuk salat yang dikerjakan di luar waktunya: Sendiri + Qada atau Berjamaah + Qada.
   - Masbuk dan Qada tidak bisa digabung (masbuk hanya ada pada salat berjamaah di waktunya).
   - Terlewat berdiri sendiri: tidak bisa digabung dengan Masbuk maupun Qada.
   Maksimal dua pilihan. Data tetap disimpan sebagai cara: jamaah | masbuk | sendiri | tidak, plus
   qada: true/false (masbuk = jamaah + masbuk), sehingga catatan lama tetap kompatibel. */

function pilihTanggal(k){tglPilih=k;RENDER.ibadah();buzz(6);}
function mutasi(fn){const d=getDay(tglPilih);fn(d);simpanDay(tglPilih,d);buzz(8);}
function setCaraFardhu(k,v){
  mutasi(d=>{
    const cur=d.fardhu[k]||{};
    const aktif=v==="jamaah"?isJamaahCara(cur.cara):cur.cara===v; // masbuk juga dihitung berjamaah
    if(aktif){d.fardhu[k]={cara:null,qada:false};return;} // ketuk lagi = batalkan
    if(v==="tidak"){d.fardhu[k]={cara:v,qada:false};return;} // terlewat: tak ada salat, masbuk, maupun qada
    if(cur.cara&&cur.cara!=="tidak"){d.fardhu[k]={...cur,cara:v};return;} // ganti cara: jam tetap, masbuk gugur, qada tetap
    const ts=Date.now(), jam=jamDariTs(ts);
    const lvl=levelKetepatan(k,hmToDec(jam),new Date(tglPilih+"T00:00:00"));
    d.fardhu[k]={cara:v,qada:false,ts,jam,level:lvl.k};
  });
  RENDER.ibadah();
}
/** Masbuk hanya sub-pilihan dari berjamaah: jamaah <-> masbuk. Di luar itu diabaikan. */
function toggleMasbuk(k){
  mutasi(d=>{
    const cur=d.fardhu[k]||{};
    if(cur.cara==="jamaah"){if(!cur.qada)d.fardhu[k]={...cur,cara:"masbuk"};} // masbuk & qada tidak digabung
    else if(cur.cara==="masbuk")d.fardhu[k]={...cur,cara:"jamaah"};
  });
  RENDER.ibadah();
}
function toggleQadaFardhu(k){
  mutasi(d=>{
    const cur=d.fardhu[k]||{};
    if(!cur.cara||cur.cara==="tidak")return; // jaga-jaga: qada butuh cara salat dulu
    if(cur.cara==="masbuk"&&!cur.qada)return; // masbuk & qada tidak digabung
    d.fardhu[k]={...cur,qada:!cur.qada};
  });
  RENDER.ibadah();
}
/** Jumlah salat yang tergolong tepat waktu (awal/tepat) dari yang sudah dikerjakan hari itu. */
function hitungKetepatan(d,dt){
  let tepat=0,total=0;
  PRAYERS.forEach(p=>{
    const fi=d.fardhu[p.k]||{}; if(!fi.cara||fi.cara==="tidak")return;
    total++;
    const jam=fi.jam||(fi.ts?jamDariTs(fi.ts):null); if(!jam)return;
    const lvl=fi.level||levelKetepatan(p.k,hmToDec(jam),dt).k;
    if(lvl==="awal"||lvl==="tepat")tepat++;
  });
  return {tepat,total};
}
function badgeLevel(lvl){return `<span class="tag ${lvl.cls}" style="font-size:12.5px;padding:6px 14px;border-radius:20px">${lvl.label}</span>`;}
/** Buka sheet untuk mengubah jam pelaksanaan salat; level ketepatan dihitung ulang otomatis. */

  const d=getDay(tglPilih); const fi=d.fardhu[k];

  const dt=new Date(tglPilih+"T00:00:00");
  const jamNow=fi.jam||jamDariTs(fi.ts||Date.now());
  const {mulai,selesai}=jendelaSalat(k,dt);
  openSheet(`Waktu ${info.nama}`,`
    <div class="set" style="border-bottom:0;padding-bottom:2px">
      <div class="st"><b>Jam pelaksanaan</b><span>Untuk ${tglPilih===today()?"hari ini":tglID(dt)} • bisa diubah bila mencatat belakangan</span></div>
    </div>
    <div style="display:flex;justify-content:center;padding:6px 0 10px">
      <input type="time" id="inpWaktuFardhu" value="${jamNow}"
        style="font-size:24px;font-weight:800;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 18px;color:var(--ink);text-align:center"
        oninput="simpanWaktuFardhu('${k}',this.value)">
    </div>
    <div id="previewLevelWaktu" style="text-align:center;padding-bottom:8px">${badgeLevel(levelKetepatan(k,hmToDec(jamNow),dt))}</div>
    <div class="note" style="text-align:center">Rentang waktu ${info.nama}: ${jamStr(mulai)}–${jamStr(selesai)} • level menyesuaikan otomatis saat jam diubah</div>

  `);
}
function simpanWaktuFardhu(k,val){
  if(!val)return;
  const dt=new Date(tglPilih+"T00:00:00");
  const lvl=levelKetepatan(k,hmToDec(val),dt);
  mutasi(d=>{const cur=d.fardhu[k]; if(!cur||!cur.cara||cur.cara==="tidak")return; d.fardhu[k]={...cur,jam:val,ts:tsGabung(tglPilih,val),level:lvl.k};});
  const prev=$("#previewLevelWaktu"); if(prev)prev.innerHTML=badgeLevel(lvl);
  RENDER.ibadah();
}
function toggleRawatib(k,el){mutasi(d=>d.rawatib[k]=!d.rawatib[k]);el.classList.toggle("on");perbaruiRing();}
function toggleJumat(k,el){mutasi(d=>d.jumat[k]=!d.jumat[k]);el.classList.toggle('on');}
function toggleAmalan(k,el){mutasi(d=>d.amalan[k]=!d.amalan[k]);el.classList.toggle("on");perbaruiRing();}
function ubahSunnah(k,d2){mutasi(d=>{const m=(SUNNAH.find(x=>x.k===k)||{}).max||12;d.sunnah[k]=clamp((d.sunnah[k]||0)+d2,0,m);});RENDER.ibadah();}
function ubahTilawah(d2){mutasi(d=>d.tilawah=clamp(d.tilawah+d2,0,60));RENDER.ibadah();}
function setPuasa(v){tandaiPuasaTanggal(tglPilih,v);}
/** Catat jenis puasa untuk sebuah tanggal (dipakai dari halaman Ibadah maupun halaman Ramadhan & hari besar).
    Menolak jika tanggal itu Idul Fitri/Idul Adha/Tasyrik karena berpuasa hari itu haram. */
function tandaiPuasaTanggal(k,v){
  const dt=new Date(k+"T00:00:00"); const st=statusHijriTanggal(dt);
  if(v!=="-"&&st.puasaHaram){toast(`Tidak boleh berpuasa pada hari ${st.labelHaram}`);if(RENDER[CUR])RENDER[CUR]();return;}
  const d=getDay(k); d.puasa=v; simpanDay(k,d); buzz(8);
  toast(v==="-"?"Puasa dikosongkan":"Puasa "+(PUASA.find(p=>p[0]===v)||[])[1]+" dicatat"+(k!==today()?" untuk "+tglID(dt):""));
  if(RENDER[CUR])RENDER[CUR]();
}
function ubahHitung(k,d2){mutasi(d=>d[k]=clamp((d[k]||0)+d2,0,10000));RENDER.ibadah();}
let catT; function simpanCatatan(v){clearTimeout(catT);catT=setTimeout(()=>{const d=getDay(tglPilih);d.catatan=v;simpanDay(tglPilih,d);},420);}
function perbaruiRing(){
  const s=skorHari(tglPilih); const ring=$("#pg-ibadah .ring");
  if(!ring)return; const c=2*Math.PI*30;
  $(".fg",ring).style.strokeDashoffset=c*(1-s.persen/100);
  $(".val",ring).textContent=Math.round(s.persen)+"%";
}

function streakTerbaik(){
  const ks=Object.keys(TRACK).sort(); if(!ks.length)return 0;
  const d=new Date(ks[0]+"T12:00:00"), end=new Date(); end.setHours(23,0,0,0); let best=0,cur=0;
  for(let i=0;i<1600&&d<=end;i++){ if(skorHari(dkey(d)).fardu>=5){cur++;best=Math.max(best,cur);}else cur=0; d.setDate(d.getDate()+1); }
  return best;
}
RENDER.statistik=function(){
  const now=new Date(); now.setHours(12,0,0,0);
  let n=STAT_R;
  if(n===0){const ks=Object.keys(TRACK).sort(); n=ks.length?clamp(Math.round((now-new Date(ks[0]+"T12:00:00"))/864e5)+1,7,1095):30;}

  const H=buat(0,n), P=STAT_R?buat(n,n):null;

  const avg=a=>a.length?Math.round(a.reduce((x,h)=>x+h.s.persen,0)/a.length):0;

    H.forEach(h=>{const f=h.dat.fardhu[p.k]||{},c=f.cara;

      if(c&&c!=="tidak"&&f.jam){let v=hmToDec(f.jam);if(p.k==="isya"&&v<12)v+=24;o.jam.push(v);}});
    o.tunai=o.jamaah+o.masbuk+o.sendiri; o.rj=o.jam.length?o.jam.reduce((x,y)=>x+y,0)/o.jam.length:null; return o;});
  const lv={awal:0,tepat:0,akhir:0,telat:0}; PS.forEach(o=>Object.keys(lv).forEach(k=>lv[k]+=o.lvl[k])); const lvT=lv.awal+lv.tepat+lv.akhir+lv.telat;
  const qadaT=PS.reduce((x,o)=>x+o.qada,0), lewatT=PS.reduce((x,o)=>x+o.tidak,0);
  /* pola pekan */
  const hr=Array.from({length:7},(_,i)=>{const a=H.filter(h=>h.d.getDay()===i);return{n:HARI[i],v:avg(a),c:a.length};});

  if(!I.length)I.push(["🌱","Belum cukup data. Catat ibadah harian Anda dan wawasan akan muncul di sini."]);
  /* helper tampilan */
  const kpi=(v,l,c)=>`<div class="stat"><div class="n ${c||""}">${v}</div><div class="l">${l}</div></div>`;
  const pl=(nm,a,b,sub,col)=>`<div class="pl"><div class="r"><span>${nm}</span><span>${a}/${b} • ${pc(a,b)}%</span></div>${sub?`<div class="sub">${sub}</div>`:""}<div class="stk" style="height:7px"><i style="width:${pc(a,b)}%;background:${col||"linear-gradient(90deg,var(--gold),var(--emerald-3))"}"></i></div></div>`;
  const C={jamaah:"var(--emerald-3)",masbuk:"var(--gold)",sendiri:"color-mix(in srgb,var(--emerald-3) 38%,transparent)",tidak:"var(--ruby)",awal:"var(--emerald-3)",tepat:"color-mix(in srgb,var(--emerald-3) 45%,transparent)",akhir:"var(--gold)",telat:"var(--ruby)"};
  const lg=arr=>`<div class="lgd">${arr.map(([t,c])=>`<span><b style="background:${c}"></b>${t}</span>`).join("")}</div>`;
  const cs=n<=14?26:n<=45?20:13;

  STAT_TXT=`Ringkasan ibadah ${STAT_R?STAT_R+" hari terakhir":"sejak awal"}\nRata-rata skor harian: ${rata}%\nHari dicatat: ${aktif.length}/${n}\nSalat fardu: ${fardu} (berjamaah ${pc(jamaah,fardu)}%)\nTilawah: ${tilawah} halaman\nRentetan sekarang/terbaik: ${stNow}/${stBest} hari\n`+I.map(x=>"- "+x[1].replace(/<[^>]+>/g,"")).join("\n");

function hitungTasbih(e){
  const p=TASBIH_PRESET[TASBIH.i];
  TASBIH.count++; TASBIH.total++;
  const el=$("#tCount"); if(el){el.textContent=TASBIH.count;el.animate?el.animate([{transform:"scale(1.12)"},{transform:"scale(1)"}],{duration:220,easing:"cubic-bezier(.34,1.56,.64,1)"}):0;}
  const btn=$("#beadBtn"); if(btn){const r=document.createElement("div");r.className="ripple";btn.appendChild(r);setTimeout(()=>r.remove(),760);}
  if(TASBIH.count===p[2]){buzz([30,60,120]);toast(`${p[0]} genap ${p[2]}×`);}
  else buzz(8);
  LS.set("tasbih",TASBIH);
}
function resetTasbih(){TASBIH.count=0;LS.set("tasbih",TASBIH);RENDER.tasbih();toast("Hitungan diulang");}

  const done=(DZIKIRDONE[today()]||{})[dzTab]||[];
  $("#pg-dzikir").innerHTML=backHeader("Zikir pagi &amp; petang",`${done.length}/${list.length} selesai hari ini`,"lainnya")+
  `<div class="wrap">
    <div class="seg" id="dzSeg"><div class="thumb" id="dzThumb"></div>
      <button data-t="pagi" class="${dzTab==="pagi"?"on":""}" onclick="setDzTab('pagi')">Pagi</button>
      <button data-t="petang" class="${dzTab==="petang"?"on":""}" onclick="setDzTab('petang')">Petang</button></div>
    ${list.map((d,i)=>`<div class="dz ${done.includes(i)?"done":""}">
      <div class="ar">${d.ar}</div>
      <div class="lt">${esc(d.lt)}</div>
      <div class="id">${esc(d.id)}</div>
      <div class="ft"><span class="ct">Dibaca ${d.x}×</span>
        <button class="btn-c" onclick="tandaiDzikir(${i})">${done.includes(i)?"Selesai ✓":"Tandai selesai"}</button></div>
    </div>`).join("")}
    <div class="note">Waktu zikir pagi: setelah Subuh hingga terbit matahari. Zikir petang: setelah Asar hingga terbenam matahari.</div>
  </div>`;
  const b=$(`#dzSeg button[data-t="${dzTab}"]`),th=$("#dzThumb"); if(b&&th){th.style.width=b.offsetWidth+"px";th.style.left=b.offsetLeft+"px";}
};
function setDzTab(t){dzTab=t;RENDER.dzikir();buzz(6);}
function tandaiDzikir(i){
  const k=today(); DZIKIRDONE[k]=DZIKIRDONE[k]||{}; const arr=DZIKIRDONE[k][dzTab]||[];
  const j=arr.indexOf(i); if(j>=0)arr.splice(j,1); else arr.push(i);
  DZIKIRDONE[k][dzTab]=arr; LS.set("dzikirdone",DZIKIRDONE);
  const list=dzTab==="pagi"?DZIKIR_PAGI:DZIKIR_PETANG;
  if(arr.length===list.length){
    const d=getDay(k); d.amalan[dzTab==="pagi"?"dzikirPagi":"dzikirPetang"]=true; simpanDay(k,d);
    toast("Zikir "+dzTab+" lengkap, tercatat di ibadah harian"); buzz([20,50,90]);
  }else buzz(8);
  RENDER.dzikir();
}

/* ======================= RAMADHAN & HARI BESAR ======================= */
/** Hari besar Hijriah berikutnya untuk (bulan,hari) tertentu, dihitung dari tahun Hijriah 'sekarang'
    dan otomatis digeser setahun jika ternyata sudah lewat. 'acuan' hanya mempercepat & mengarahkan pencarian. */
function hariBesarBerikutnya(m,d,label,acuan){
  const now=new Date(); const h=hijriYMD(now); if(!h)return {label,tgl:null};
  let tgl=tanggalDariHijri(h.y,m,d,acuan||now);
  if(tgl&&dkey(tgl)<dkey(now))tgl=tanggalDariHijri(h.y+1,m,d,new Date(now.getTime()+330*864e5));
  return {label,tgl};
}
function acaraIslamBerikutnya(){
  const h=hijriYMD(new Date()); if(!h)return null;
  const ramadhan=hariBesarBerikutnya(9,1,"Awal Ramadhan");
  const fitri=hariBesarBerikutnya(10,1,"Idul Fitri",ramadhan.tgl);
  const tarwiyah=hariBesarBerikutnya(12,8,"Tarwiyah",fitri.tgl);
  const arafah=hariBesarBerikutnya(12,9,"Hari Arafah",tarwiyah.tgl);
  const adha=hariBesarBerikutnya(12,10,"Idul Adha",arafah.tgl);
  const tasua=hariBesarBerikutnya(1,9,"Tasu'a",adha.tgl);
  const asyura=hariBesarBerikutnya(1,10,"Asyura",tasua.tgl);
  return {ramadhan,fitri,tarwiyah,arafah,adha,tasua,asyura,sekarang:h};
}
function faseRamadhanHariIni(j,now){
  const h=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
  if(h<j.imsak)return {label:"MENUJU IMSAK",target:j.imsak};
  if(h<j.maghrib)return {label:"MENUJU BERBUKA",target:j.maghrib};
  return {label:"PUASA SELESAI",target:null};
}
function sisaJamMenit(now,jamTarget){
  let s=(jamTarget-(now.getHours()+now.getMinutes()/60+now.getSeconds()/3600))*3600;
  if(s<0)s+=86400; s=Math.max(0,Math.floor(s));
  return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;
}
/** Kartu status musim untuk beranda & halaman Ramadhan: Ramadhan berjalan, hari raya, Arafah, Tasyrik,
    atau hitung mundur ke acara terdekat. Mengembalikan string kosong bila kalender Hijriah tak didukung. */

  const now=new Date(); const st=statusHijriTanggal(now); if(!st.h)return "";

    const acara=acaraIslamBerikutnya(); if(!acara||!acara.fitri.tgl)return "";
    const total=Math.max(29,Math.round((acara.fitri.tgl-acara.ramadhan.tgl)/864e5));
    const j=jadwalHariIni(now); const fase=faseRamadhanHariIni(j,now);
    const sudahPuasa=getDay(today()).puasa==="ramadhan";
    return `<div class="card" style="margin-top:12px;border:1.4px solid color-mix(in srgb,var(--gold) 45%,transparent);cursor:pointer" onclick="go('ramadhan')">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <b style="font-size:15px">🌙 Ramadhan ${st.h.y} H — hari ke-${st.hariKeRamadhan} dari ${total}</b>
        ${svg(IC.fwd,"")}
      </div>
      <div style="display:flex;gap:20px;margin-top:10px;align-items:flex-end">
        <div><div style="font-size:10.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.03em">IMSAK</div><div style="font-size:17px;font-weight:800">${jamStr(j.imsak)}</div></div>
        <div><div style="font-size:10.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.03em">BERBUKA</div><div style="font-size:17px;font-weight:800">${jamStr(j.maghrib)}</div></div>
        <div style="flex:1;text-align:right">
          <div style="font-size:10.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.03em">${fase.label}</div>
          <div style="font-size:14px;font-weight:700;color:var(--emerald-3)">${fase.target!=null?sisaJamMenit(now,fase.target)+" lagi":"Tarawih &amp; tadarus"}</div>
        </div>
      </div>
      <div style="height:7px;border-radius:99px;background:var(--surface-2);margin-top:12px;overflow:hidden">
        <div style="height:100%;width:${clamp(st.hariKeRamadhan/total*100,0,100)}%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--emerald-3))"></div>
      </div>
      ${sudahPuasa?"":`<button class="chip on" style="margin-top:11px" onclick="event.stopPropagation();tandaiPuasaTanggal('${today()}','ramadhan');segarkanSemua();">Tandai puasa hari ini</button>`}
    </div>`;
  }
  if(st.isIdulFitri||st.isIdulAdha){
    const label=st.isIdulFitri?"Idul Fitri":"Idul Adha";
    return `<div class="card" style="margin-top:12px;border:1.4px solid color-mix(in srgb,var(--gold) 55%,transparent);text-align:center;cursor:pointer" onclick="go('ramadhan')">
      <div style="font-size:26px">${st.isIdulFitri?"🎉":"🐐"}</div>
      <b style="font-size:16px">Selamat ${label} ${st.h.y} H</b>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px">Taqabbalallāhu minnā wa minkum — semoga amal kita diterima Allah</div>
      <div style="font-size:11.5px;color:var(--ruby);margin-top:8px;font-weight:600">Berpuasa pada hari ini dilarang</div>
    </div>`;
  }
  if(st.isArafah){
    const sudah=getDay(today()).puasa==="arafah";
    return `<div class="card" style="margin-top:12px;border:1.4px solid color-mix(in srgb,var(--emerald-3) 45%,transparent);cursor:pointer" onclick="go('ramadhan')">
      <b style="font-size:15px">Hari ini Hari Arafah (9 Dzulhijjah)</b>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.6">Sangat dianjurkan berpuasa Arafah bagi yang tidak berhaji — menghapus dosa setahun lalu dan setahun akan datang.</div>
      ${sudah?"":`<button class="chip on" style="margin-top:10px" onclick="event.stopPropagation();tandaiPuasaTanggal('${today()}','arafah');segarkanSemua();">Tandai puasa Arafah</button>`}
    </div>`;
  }
  if(st.isTasyrik){
    return `<div class="card" style="margin-top:12px;cursor:pointer" onclick="go('ramadhan')">
      <b style="font-size:15px">Hari Tasyrik</b>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px">Hari makan, minum, dan memperbanyak takbir — berpuasa pada hari ini dilarang.</div>
    </div>`;
  }
  const acara=acaraIslamBerikutnya(); if(!acara)return "";
  const list=[acara.ramadhan,acara.fitri,acara.arafah,acara.adha].filter(e=>e&&e.tgl);
  list.sort((a,b)=>a.tgl-b.tgl);
  const nx=list[0]; if(!nx)return "";
  const sisaHari=Math.round((new Date(dkey(nx.tgl)+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);
  return `<button class="card" style="margin-top:12px;display:flex;align-items:center;gap:14px;width:100%;text-align:left" onclick="go('ramadhan')">
    <div style="width:52px;height:52px;border-radius:16px;background:var(--mint);display:grid;place-items:center;flex:none">${svg(IC.moon)}</div>
    <div style="flex:1"><div style="font-size:14px;font-weight:700">Menuju ${nx.label}</div>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:2px">${tglID(nx.tgl)} • ${hijri(nx.tgl)}</div></div>
    <div class="tag md">${sisaHari<=0?"Hari ini":"H-"+sisaHari}</div>
  </button>`;
}

/** Jadwal imsakiyah sebulan penuh untuk lokasi terpilih. Sedang Ramadhan: mulai dari 1 Ramadhan tahun ini; bila belum: Ramadhan berikutnya. */
let IMSAKIYAH_TEKS="";
function imsakiyahHTML(acara,st){
  const L=lokasi(), now=new Date(); let mulai=null;
  if(st.dalamRamadhan)mulai=new Date(now.getFullYear(),now.getMonth(),now.getDate()-(st.hariKeRamadhan-1));
  else if(acara&&acara.ramadhan&&acara.ramadhan.tgl){const t=acara.ramadhan.tgl;mulai=new Date(t.getFullYear(),t.getMonth(),t.getDate());}
  if(!mulai)return "";
  const opt={method:SET.method,asrFactor:SET.asrFactor,ihtiyati:SET.ihtiyati,dhuhaMin:SET.dhuhaMin}, tk=today();
  const th=(hijriYMD(mulai)||{}).y||""; const baris=[], teks=[`Jadwal imsakiyah Ramadhan ${th} H - ${L.nama}`];
  for(let i=0;i<30;i++){
    const d=new Date(mulai.getFullYear(),mulai.getMonth(),mulai.getDate()+i), h=hijriYMD(d);
    if(!h||h.m!==9)break;
    const j=hitungJadwal(d,L.lat,L.lng,opt), tgl=`${HARI[d.getDay()].slice(0,3)}, ${d.getDate()} ${BULAN[d.getMonth()].slice(0,3)}`;
    baris.push(`<tr class="${dkey(d)===tk?"hari-ini":""}"><td>${h.d}</td><td>${tgl}</td><td class="kunci">${jamStr(j.imsak)}</td><td>${jamStr(j.subuh)}</td><td>${jamStr(j.syuruq)}</td><td>${jamStr(j.zuhur)}</td><td>${jamStr(j.ashar)}</td><td class="kunci">${jamStr(j.maghrib)}</td><td>${jamStr(j.isya)}</td></tr>`);
    teks.push(`${h.d} Ramadhan (${tgl}): Imsak ${jamStr(j.imsak)}, Subuh ${jamStr(j.subuh)}, Terbit ${jamStr(j.syuruq)}, Zuhur ${jamStr(j.zuhur)}, Asar ${jamStr(j.ashar)}, Magrib/berbuka ${jamStr(j.maghrib)}, Isya ${jamStr(j.isya)}`);
  }
  if(!baris.length)return "";
  IMSAKIYAH_TEKS=teks.join("\n");
  return `<div class="sec-title"><h2>Jadwal imsakiyah ${th} H</h2><button class="more" onclick="salinImsakiyah()">Salin</button></div>
    <div class="card" style="padding:12px 0 6px">
      <div style="padding:0 16px 8px;font-size:12px;color:var(--ink-soft)">${esc(L.nama)} • ${esc((METHODS[SET.method]||METHODS.kemenag).nama)}</div>
      <div class="imsak-wrap"><table class="imsak"><thead><tr><th>Hari</th><th>Tanggal</th><th>Imsak</th><th>Subuh</th><th>Terbit</th><th>Zuhur</th><th>Asar</th><th>Magrib</th><th>Isya</th></tr></thead><tbody>${baris.join("")}</tbody></table></div>
      <div class="note" style="padding:8px 16px 4px">Jadwal mengikuti lokasi di pojok atas Beranda; ganti lokasi (kecamatan atau desa mana pun) lewat tombol lokasi. Geser tabel ke samping untuk melihat semua kolom.</div>
    </div>`;
}
function salinImsakiyah(){navigator.clipboard?.writeText(IMSAKIYAH_TEKS).then(()=>toast("Jadwal imsakiyah disalin"),()=>toast("Gagal menyalin"));}

async function unduhSemua(){
  const box=$("#unduhProg"),bar=$("#unduhBar"),txt=$("#unduhTxt"); box.style.display="block";
  let ada=await IDB.keys("surah"); ada=ada.map(Number);
  const sisa=SURAH.map(s=>s.n).filter(n=>!ada.includes(n));
  if(!sisa.length){txt.textContent="Semua surat sudah tersimpan.";bar.style.width="100%";return;}
  let ok=0,gagal=0;
  for(let i=0;i<sisa.length;i++){
    try{await ambilSurat(sisa[i]);ok++;}catch(e){gagal++;}
    bar.style.width=((i+1)/sisa.length*100)+"%";
    txt.textContent=`Mengunduh ${i+1}/${sisa.length} — berhasil ${ok}${gagal?", gagal "+gagal:""}`;
  }
  txt.textContent=gagal?`Selesai: ${ok} surat tersimpan, ${gagal} gagal. Coba lagi saat sinyal stabil.`:`Selesai. ${ok} surat kini bisa dibaca tanpa internet.`;
  RENDER.lainnya();
}

function impor(inp){
  const f=inp.files[0]; if(!f)return;

      if(d.track)TRACK=d.track; if(d.bookmarks)MARKS=d.bookmarks; if(d.lastread)LAST=d.lastread;
      if(d.tasbih)TASBIH=d.tasbih; if(d.dzikirdone)DZIKIRDONE=d.dzikirdone;
      if(d.khatam&&typeof d.khatam.read==="object"){KHATAM=Object.assign({mulai:today(),targetHari:30,read:{},riwayat:[]},d.khatam);khSimpan();}
      saveSet();LS.set("track",TRACK);LS.set("bookmarks",MARKS);LS.set("lastread",LAST);LS.set("tasbih",TASBIH);LS.set("dzikirdone",DZIKIRDONE);

let lastNotif=LS.get("lastnotif",""); let hariTerakhir=today();
/** Sapaan sekali sehari untuk awal Ramadhan, Idul Fitri, Idul Adha, dan Hari Arafah.
    Ditampilkan sebagai toast selalu; notifikasi sistem hanya bila pengingat diaktifkan. */
function cekHariBesar(){
  const st=statusHijriTanggal(new Date()); if(!st.h)return;
  const key=today()+":hb";
  if(LS.get("lasthb","")===key)return;
  let pesan=null;
  if(st.h.m===9&&st.h.d===1)pesan=`Marhaban ya Ramadhan ${st.h.y} H — puasa Ramadhan dimulai hari ini`;
  else if(st.isIdulFitri)pesan=`Selamat Idul Fitri ${st.h.y} H — Taqabbalallāhu minnā wa minkum`;
  else if(st.isIdulAdha)pesan=`Selamat Idul Adha ${st.h.y} H — Taqabbalallāhu minnā wa minkum`;
  else if(st.isArafah)pesan="Hari ini Hari Arafah — dianjurkan berpuasa Arafah";
  if(pesan){
    LS.set("lasthb",key); toast(pesan); buzz([30,60,30,60,30]);
    try{if(SET.notif&&"Notification" in window&&Notification.permission==="granted")new Notification("Nuur",{body:pesan,silent:false});}catch(e){}
  }
}
function cekPengingat(){
  if(today()!==hariTerakhir){hariTerakhir=today();tglPilih=today();if(RENDER[CUR])RENDER[CUR]();}
  cekHariBesar();
  if(!SET.notif)return;
  const now=new Date(), h=now.getHours()+now.getMinutes()/60; const j=jadwalHariIni(now);
  const st=statusHijriTanggal(now);
  if(st.dalamRamadhan){
    const key=today()+"imsak";
    if(h>=j.imsak&&h<j.imsak+2/60&&lastNotif!==key){
      lastNotif=key; LS.set("lastnotif",key); buzz([25,50,25]);
      toast("Waktu imsak — sahur berakhir, sebentar lagi Subuh");
      try{if("Notification" in window&&Notification.permission==="granted")new Notification("Waktu Imsak",{body:"Sahur berakhir, sebentar lagi masuk waktu Subuh",silent:false});}catch(e){}
    }
  }
  for(const p of PRAYERS){
    const key=today()+p.k;
    if(h>=j[p.k]&&h<j[p.k]+2/60&&lastNotif!==key){
      lastNotif=key; LS.set("lastnotif",key); buzz([40,80,40,80]);
      const buka=(st.dalamRamadhan&&p.k==="maghrib")?" — saatnya berbuka puasa":"";
      toast(`Waktu ${p.nama} telah masuk${buka}`);
      try{if("Notification" in window&&Notification.permission==="granted")new Notification("Waktu "+p.nama,{body:`Telah masuk waktu ${p.nama} di ${lokasi().nama}${buka}`,silent:false});}catch(e){}
    }
  }
}

});
window.addEventListener("appinstalled",()=>{
  appTerpasang=true; deferredInstall=null; toast("Nuur terpasang di perangkat"); if(CUR==="pengaturan")RENDER.pengaturan();
});
function iosPerangkat(){return /iphone|ipad|ipod/i.test(navigator.userAgent||"")||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);}
async function pasangApp(){
  if(deferredInstall){
    deferredInstall.prompt();
    const r=await deferredInstall.userChoice.catch(()=>null);
    deferredInstall=null; if(CUR==="pengaturan")RENDER.pengaturan();
    if(r&&r.outcome==="accepted")toast("Memasang Nuur…");
    return;
  }
  if(iosPerangkat()){
    openSheet("Pasang di iPhone / iPad",
     `<div style="font-size:13.5px;line-height:1.9;color:var(--ink-soft)">
        <p>Safari tidak mengizinkan pemasangan lewat tombol. Lakukan langkah ini:</p>
        <ol style="padding-left:20px;margin:0">
          <li>Ketuk ikon <b>Bagikan</b> (kotak dengan panah ke atas) di bilah Safari.</li>
          <li>Pilih <b>"Tambah ke Layar Utama"</b>.</li>
          <li>Ketuk <b>Tambah</b> di pojok kanan atas.</li>
        </ol>
        <p style="margin-top:10px">Setelah itu ikon Nuur muncul di layar utama dan terbuka tanpa bilah alamat, seperti aplikasi biasa.</p>
      </div>`);
    return;
  }
  openSheet("Pasang Nuur",
   `<div style="font-size:13.5px;line-height:1.85;color:var(--ink-soft)">
      <p>Peramban ini belum menawarkan pemasangan otomatis. Coba cara berikut:</p>
      <ul style="padding-left:20px;margin:0">
        <li><b>Chrome/Edge di Android atau desktop:</b> ketuk menu titik tiga → "Instal aplikasi" atau "Pasang Nuur".</li>
        <li>Pastikan halaman dibuka lewat alamat <b>https://</b>, bukan dibuka langsung dari berkas.</li>
      </ul>
    </div>`);
}
function daftarSW(){
  if(!("serviceWorker" in navigator))return;
  if(location.protocol!=="http:"&&location.protocol!=="https:")return; // file:// tidak didukung
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* ======================= INISIALISASI ======================= */
function init(){
  document.documentElement.dataset.theme=SET.theme;
  terapkanTipografi();
  buildShell();
  document.body.insertAdjacentHTML("beforeend",readerHTML());
  R.mode=SET.mushafMode?"mushaf":"terjemah";
  muatPeta(); daftarSW();
  go("beranda");
  setTimeout(()=>{$("#splash").classList.add("gone");setTimeout(()=>$("#splash").remove(),700);},900);
  setInterval(cekPengingat,20000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){cekPengingat();if(CUR==="beranda")RENDER.beranda();}});
  window.addEventListener("keydown",e=>{
    if(e.key==="Escape"){ if($("#sheet").classList.contains("on"))closeSheet(); else if($("#reader").classList.contains("open"))tutupBaca(); }
    if($("#reader").classList.contains("open")){
      if(e.key==="ArrowLeft")keHalaman(R.page+1,1); if(e.key==="ArrowRight")keHalaman(R.page-1,-1);
    }
  });
  window.addEventListener("error",e=>{console.error(e.error||e.message);toast("Ada yang tersendat — coba sekali lagi");});
  window.addEventListener("unhandledrejection",e=>{console.error(e.reason);});
  setTimeout(movePill,150);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init); else init();
</script>
