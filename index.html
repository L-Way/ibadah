function ringHTML(p){
  const c=2*Math.PI*30;
  return `<div class="ring"><svg viewBox="0 0 74 74"><circle class="bg" cx="37" cy="37" r="30"/><circle class="fg" cx="37" cy="37" r="30" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}"/></svg><div class="val">${Math.round(p)}%</div></div>`;
}
function waktuLalu(ts){
  const d=Math.floor((Date.now()-ts)/1000);
  if(d<60)return "baru saja"; if(d<3600)return Math.floor(d/60)+" menit lalu";
  if(d<86400)return Math.floor(d/3600)+" jam lalu"; return Math.floor(d/86400)+" hari lalu";
}
let cdTimer;
function tickCountdown(){
  clearInterval(cdTimer);
  const upd=()=>{
    const el=$("#cd"); if(!el){clearInterval(cdTimer);return;}
    const nx=salatBerikutnya(); let s=Math.max(0,Math.floor(nx.sisa));
    el.textContent=`${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)} lagi`;
    const wj=$("#wibJam"); if(wj){const w=jamWIB(); wj.textContent=w.jam; const wt=$("#wibTgl"); if(wt&&wt.textContent!==w.tgl)wt.textContent=w.tgl;}
    if(s<=0){clearInterval(cdTimer);setTimeout(()=>{if(CUR==="beranda")RENDER.beranda();},1500);}
  };
  upd(); cdTimer=setInterval(upd,1000);
}

  const box=$("#ayatHari"); if(!box)return;
  const hari=Math.floor(Date.now()/864e5);
  const pool=[[2,255],[3,190],[13,28],[14,7],[18,10],[39,53],[55,13],[65,3],[93,5],[94,6],[2,286],[16,97],[29,69],[49,13],[103,3]];

    box.innerHTML=`<div class="ayat-ar">${esc(ay.teksArab)}</div>

/* ======================= PEMBACA MUSHAF 604 HALAMAN ======================= */
const AYAT_TOTAL=6236, HAL_TOTAL=604;
const CUM=(()=>{let t=0;return SURAH.map(s=>{const c=t;t+=s.ayat;return c;});})();
const gIdx=(s,a)=>CUM[s-1]+(a-1);
function fromG(g){g=clamp(g,0,AYAT_TOTAL-1);for(let i=113;i>=0;i--)if(g>=CUM[i])return[i+1,g-CUM[i]+1];return[1,1];}
const JUZ_HAL=[1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];
let PAGES=null, PAGES_TEPAT=false, petaMenunggu=null, petaJanji=null;
function petaPerkiraan(){
  const p=new Array(HAL_TOTAL);
  for(let j=0;j<30;j++){
    const awal=JUZ_HAL[j], akhir=(j<29?JUZ_HAL[j+1]-1:HAL_TOTAL), n=akhir-awal+1;
    const g0=gIdx(JUZ[j][0],JUZ[j][1]), g1=(j<29?gIdx(JUZ[j+1][0],JUZ[j+1][1]):AYAT_TOTAL);
    for(let k=0;k<n;k++)p[awal-1+k]=fromG(Math.round(g0+(g1-g0)*k/n));
  }
  return p;
}
/** Peta perkiraan langsung dipakai supaya aplikasi tidak pernah menunggu.
    Peta mushaf asli menyusul di latar belakang lalu dipasang saat aman. */
function muatPeta(){
  if(!PAGES)PAGES=petaPerkiraan();
  if(petaJanji)return petaJanji;
  petaJanji=(async()=>{
    try{
      const c=await IDB.get("meta","pages");
      if(c&&c.peta&&c.peta.length===HAL_TOTAL){pasangPeta(c.peta,!!c.tepat);return PAGES;}
    }catch(e){}
    try{
      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),8000);
      const r=await fetch("https://api.alquran.cloud/v1/meta",{signal:ctl.signal}); clearTimeout(to);
      const j=await r.json();
      const ref=(((j.data||{}).pages||{}).references)||[];
      if(ref.length===HAL_TOTAL){
        const peta=ref.map(x=>[+x.surah,+x.ayah]);
        IDB.set("meta","pages",{peta,tepat:true});
        pasangPeta(peta,true);
      }
    }catch(e){}
    return PAGES;
  })();
  return petaJanji;
}
function pasangPeta(peta,tepat){
  if(!peta||peta.length!==HAL_TOTAL)return;
  if($("#reader")&&$("#reader").classList.contains("open")){petaMenunggu={peta,tepat};return;}
  PAGES=peta; PAGES_TEPAT=tepat; petaMenunggu=null;
}

/* ===== tata letak mushaf: maksimal 15 baris, tinggi baris sama, tiap baris rata kanan-kiri ===== */
const BASMALAH="بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ";
const BAS_RE=/^\s*بِسْمِ\s*اللّٰهِ\s*الرَّحْمٰنِ\s*الرَّحِيْمِ\s*/;
const MAKS_BARIS=15;
/* angka penanda ayat: metrik glyph LPMQ per digit (satuan font, 2048/em) — lebar maju, batas kanan tinta, batas bawah/atas tinta.
   Angka disusun dari glyph yang sama, lalu tinta angka dipusatkan tepat di titik tengah ornamen (50,50 dari 100)
   dan diskalakan agar sudut kotak tinta tetap di dalam lingkaran (jari-jari 26,7 dari 100), maksimum setara 1,9em huruf ayat. */
const DG={adv:[142,155,281,363,293,387,331,492,474,282],x1:[142,155,280,363,293,387,329,492,474,282],y0:[100,0,0,0,0,0,0,0,0,0],y1:[250,599,599,599,599,599,599,599,599,599]};
const glyphAngka=a=>{                    // susunan glyph angka (satuan font) + kotak tinta: lebar W, batas bawah y0, batas atas y1
  const ds=String(a).split("").map(Number); let x=0,y0=1e9,y1=-1e9,W=0;
  const u=ds.map((d,i)=>{
    const t=`<use href="#dg${d}" x="${x}"/>`;
    y0=Math.min(y0,DG.y0[d]); y1=Math.max(y1,DG.y1[d]);
    if(i===ds.length-1)W=x+DG.x1[d];
    x+=DG.adv[d]; return t;
  }).join("");
  return {u,W,y0,y1};
};
const penandaAyat=a=>{
  const {u,W,y0,y1}=glyphAngka(a);
  const S=Math.min(126.7/2048,53.4/Math.hypot(W,y1-y0));
  return `<span class="anum" role="img" aria-label="akhir ayat ${a}"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#orn-ayat"/><g fill="currentColor" transform="translate(50 50) scale(${S.toFixed(5)} ${(-S).toFixed(5)}) translate(${-W/2} ${-(y0+y1)/2})">${u}</g></svg></span>`;
};
/* nomor halaman di pita atas: angka Arab (glyph LPMQ, sama dengan ayat), tinggi tetap, lebar mengikuti jumlah digit;
   kotak label melebar mengikuti angka sehingga angka tidak mungkin keluar dari bingkainya */
const angkaHalaman=p=>{
  const {u,W,y0,y1}=glyphAngka(p), H=y1-y0;
  return `<svg viewBox="0 0 ${W} ${H}" style="--r:${(W/H).toFixed(4)}" role="img" aria-label="halaman ${p}"><g fill="currentColor" stroke="currentColor" stroke-width="20" stroke-linejoin="round" transform="matrix(1 0 0 -1 0 ${y1})">${u}</g></svg>`;
};
function susunBlok(){
  const blok=[]; let cur=null;
  R.ayat.forEach(ay=>{
    if(ay.a===1){
      blok.push({t:"kepala",s:ay.s});
      if(ay.s!==1&&ay.s!==9)blok.push({t:"basmalah"});
      cur=null;
    }
    if(!cur){cur={t:"teks",kata:[]};blok.push(cur);}
    let t=ay.teksArab||"";
    if(ay.a===1&&ay.s!==1&&ay.s!==9)t=t.replace(BAS_RE,"");
    const w=t.trim().split(/\s+/).filter(Boolean);
    w.forEach((k,i)=>cur.kata.push({k,s:ay.s,a:ay.a,akhir:i===w.length-1}));
  });
  return blok;
}
function kepalaMushaf(s){
  const i=SURAH[s-1];
  const med=`<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#orn-medali"/></svg>`;
  const tng=`<i>${med}</i>`;

function htmlTeks(b){

function htmlBlok(blok,rencana){

/* lebar tiap kata (termasuk penanda ayat) diukur sekali pada 100px, disimpan dalam em, lalu dikalikan ukuran huruf mana pun */
function ukurToken(kata){
  const F0=100, m=document.createElement("div");
  m.className="flow";
  m.style.cssText=`position:absolute;left:-99999px;top:0;visibility:hidden;white-space:nowrap;font-size:${F0}px;line-height:normal;text-align:start;text-align-last:auto;width:auto`;
  m.innerHTML=kata.map(w=>`<span>${esc(w.k)}${w.akhir?penandaAyat(w.a):""}</span>`).join("")+`<span>&nbsp;</span>`;
  document.body.appendChild(m);
  const kids=[...m.children], spasi=kids.pop().getBoundingClientRect().width/F0;
  const lebar=kids.map(x=>x.getBoundingClientRect().width/F0);
  m.remove();
  return {lebar,spasi};
}
/* pengisian baris serakah, sama dengan cara browser memenggal baris; k = ukuran huruf (px), lebar kata dalam em */
function hitungBaris(lebar,spasi,W,k){
  let n=0,cur=0,cnt=0;
  for(let i=0;i<lebar.length;i++){
    const w=lebar[i]*k;
    if(cnt===0){cur=w;cnt=1;n++;}
    else if(cur+spasi*k+w<=W){cur+=spasi*k+w;cnt++;}
    else{n++;cur=w;cnt=1;}
  }
  return {n,akhir:n?cur/W:0};
}
function paskanTeks(){
  const body=$("#pgBody"); if(!body||R.mode!=="mushaf"||!R.ayat.length)return;
  const hal=body.closest(".hal"); if(!hal)return;
  hal.style.height=""; body.classList.remove("bisaGulir");
  const H0=body.clientHeight; if(H0<80)return;
  const cs=getComputedStyle(body);
  const W=(body.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-2)*.985; // sisakan sedikit ruang: perkiraan lebar kata bisa meleset 1-2%
  const blok=susunBlok();
  const khusus=blok.filter(b=>b.t!=="teks").length;
  const isi=blok.filter(b=>b.t==="teks").map(b=>Object.assign(b,ukurToken(b.kata)));
  const jml=ff=>isi.reduce((n,b)=>n+hitungBaris(b.lebar,b.spasi,W,ff).n,khusus);
  // ukuran huruf terbesar yang masih muat: paling banyak 15 baris, tiap baris minimal 1,5x tinggi huruf
  const cap=Math.min(SET.arSize+4,(W+2)/16), MIN=11;
  let f=cap, L=jml(f);
  while(f>MIN&&(L>MAKS_BARIS||L*f*1.5>H0)){f-=.5;L=jml(f);}
  let rh=0, gulir=false, nyata=L;
  for(let g=0;g<40;g++){
    const rh0=Math.max(Math.ceil(f*1.5),Math.floor(Math.min(H0/L,f*2.15)));
    const rencana=new Map();
    isi.forEach(b=>{const h=hitungBaris(b.lebar,b.spasi,W,f);rencana.set(b,{n:h.n,pendek:h.akhir<.62});});
    body.style.fontSize=f+"px"; body.style.lineHeight=rh0+"px"; body.style.setProperty("--rh",rh0+"px");
    body.innerHTML=htmlBlok(blok,rencana);
    // hitung baris yang benar-benar terbentuk di browser, bukan hanya perkiraan
    nyata=khusus+[...body.querySelectorAll(".flow")].reduce((n,el)=>n+Math.max(1,Math.round(el.offsetHeight/rh0)),0);
    gulir=false; rh=Math.floor(Math.min(H0/nyata,f*2.15));
    if(rh<f*1.5){rh=Math.ceil(f*1.5);gulir=true;}
    if((nyata<=MAKS_BARIS&&!gulir)||f<=MIN)break;
    f-=.5; L=jml(f);
  }
  body.style.lineHeight=rh+"px"; body.style.setProperty("--rh",rh+"px");
  body.querySelectorAll(".kh-n").forEach(el=>{let z=1.08;while(el.scrollWidth>el.clientWidth+1&&z>.55){z-=.05;el.style.fontSize=z+"em";}});
  body.classList.toggle("bisaGulir",gulir||body.scrollHeight>body.clientHeight+2);
  if(!gulir)hal.style.height=(hal.offsetHeight-H0+nyata*rh)+"px";
  if(document.fonts&&document.fonts.status!=="loaded"&&!R.fontTunggu){
    R.fontTunggu=true; const p0=R.page;
    document.fonts.ready.then(()=>{R.fontTunggu=false;if(R.page===p0)paskanTeks();});
  }
}
/* pita atas: medali disusun utuh (diapit belah ketupat) di ruang antar label, jadi label terasa disisipkan ke dalam hiasan dan tidak memotong medali */
let PITA_RO=null;
function isiPita(sg){
  const k=sg.closest(".pembuka")?1.7:1.2, E=2.1, m=1.5;
  const av=sg.clientWidth/k-2*m-2*E;                        // ruang untuk jarak antar belah ketupat
  const n=Math.floor(av/16.5);
  if(n<1){                                                  // ruang sempit: satu medali saja di tengah, atau kosong bila tak muat
    sg.innerHTML=sg.clientWidth/k>=13?`<svg aria-hidden="true" width="${13*k}" height="${13*k}" viewBox="-6.5 -6.5 13 13"><use href="#pt-r"/></svg>`:"";
    return;
  }
  const P=av/n, vw=av+2*E; let u="";                        // jarak diregangkan sedikit agar deret medali pas memenuhi ruang
  for(let i=0;i<=n;i++){u+=`<use href="#pt-d" x="${i*P}"/>`;if(i<n)u+=`<use href="#pt-r" x="${i*P+P/2}"/>`;}
  sg.innerHTML=`<svg aria-hidden="true" width="${vw*k}" height="${13*k}" viewBox="${-E} -6.5 ${vw} 13">${u}</svg>`;
}
function paskanPita(){
  if(PITA_RO){PITA_RO.disconnect();PITA_RO=null;}
  const ruas=document.querySelectorAll(".hal .band.atas .ruas"); if(!ruas.length)return;
  ruas.forEach(isiPita);
  if("ResizeObserver" in window){PITA_RO=new ResizeObserver(es=>es.forEach(e=>isiPita(e.target)));ruas.forEach(s=>PITA_RO.observe(s));}
}

/* ---------- geser halaman ---------- */
/* Mushaf dibaca dari kanan ke kiri, jadi bukunya "dibuka" dari kiri ke kanan: usap jari ke KANAN = halaman berikutnya,
   usap ke KIRI = halaman sebelumnya (sama dengan tombol panah kiri = berikutnya). */
function prefetchTetangga(p){
  if(navigator.onLine===false||(navigator.connection&&navigator.connection.saveData))return;
  const jalan=()=>{ if(R.page!==p)return;
    [p+1,p-1].filter(q=>q>=1&&q<=HAL_TOTAL).forEach(q=>{const [g0,g1]=rentangHal(q);for(let x=fromG(g0)[0];x<=fromG(g1)[0];x++)Promise.resolve(ambilSurat(x)).catch(()=>{});});
  };
  (window.requestIdleCallback||((f)=>setTimeout(f,1200)))(jalan);
}
function pasangGeser(){
  const stage=$("#pstage"), card=$("#pcard"); if(!stage||!card)return;
  let x0=null,y0=null,dx=0,geser=false,W=360,raf=0,jejak=[];
  const ada=a=>a>0?R.page<HAL_TOTAL:R.page>1;                     // a>0: halaman berikutnya
  const terapkan=()=>{ raf=0;
    const a=dx>0?1:-1, x=dx*(ada(a)?1:.28), p=clamp(x/W,-1,1);       // di halaman pertama/terakhir: tertahan seperti karet
    card.style.transform=`translate3d(${x}px,0,0) rotateY(${-p*12}deg)`;
    card.style.opacity=String(1-Math.abs(p)*.5);
  };
  const balik=()=>{ cancelAnimationFrame(raf); raf=0;
    card.style.transition="transform .38s var(--ease),opacity .38s var(--ease)"; card.style.transform=""; card.style.opacity=""; };
  const batal=()=>{ const g=geser; x0=null; geser=false; if(g)balik(); };
  stage.ontouchstart=e=>{
    if(e.touches.length!==1){batal();return;}
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; geser=false; W=stage.clientWidth||360;
    jejak=[{t:e.timeStamp,x:x0}]; card.classList.remove("masukKiri","masukKanan");
  };
  stage.ontouchmove=e=>{
    if(x0==null)return;
    if(e.touches.length!==1){batal();return;}
    const cx=e.touches[0].clientX,cy=e.touches[0].clientY;
    if(!geser){
      if(Math.abs(cx-x0)>10&&Math.abs(cx-x0)>Math.abs(cy-y0)*1.2){geser=true;card.style.transition="none";card.style.willChange="transform,opacity";}
      else return;
    }
    dx=cx-x0; jejak.push({t:e.timeStamp,x:cx}); if(jejak.length>8)jejak.shift();
    if(!raf)raf=requestAnimationFrame(terapkan);
  };
  stage.ontouchend=e=>{
    if(x0==null)return; x0=null; if(!geser)return; geser=false;
    cancelAnimationFrame(raf); raf=0;
    const a=dx>0?1:-1, m=jejak[0], n=jejak[jejak.length-1];
    const laju=n&&m&&n.t>m.t?(n.x-m.x)/(n.t-m.t):0;                       // px/ms, kira-kira 100 ms terakhir
    const jauh=Math.abs(dx)>W*.24, cepat=Math.abs(laju)>.45&&Math.abs(dx)>24&&Math.sign(laju)===Math.sign(dx);
    if(ada(a)&&(jauh||cepat)){ terapkan(); keHalaman(R.page+a,a); }        // halaman lama diteruskan meluncur keluar dari posisi jari
    else{ balik(); if(!ada(a)&&jauh)keHalaman(R.page+a,a); }             // di ujung: kembali + pemberitahuan
  };
  stage.ontouchcancel=batal;
}

/* ======================= KHATAM ======================= */
let KHATAM=LS.get("khatam",null);
if(!KHATAM)KHATAM={mulai:today(),targetHari:30,read:{},riwayat:[]};
const khSimpan=()=>LS.set("khatam",KHATAM);
/* KHATAM.read[halaman] = tanggal baca (YYYY-MM-DD) atau "pra" bila ditandai selesai dari bacaan sebelum memakai aplikasi.
   Halaman "pra" ikut menghitung kemajuan khatam, tetapi bukan jatah hari ini dan bukan statistik tilawah. */
function khProgress(){
  const vals=Object.values(KHATAM.read), done=vals.length, pra=vals.filter(v=>v==="pra").length;
  const mulai=new Date(KHATAM.mulai+"T00:00:00");
  const lewat=Math.max(1,Math.floor((new Date(today()+"T00:00:00")-mulai)/864e5)+1);
  const sisaHari=Math.max(0,KHATAM.targetHari-lewat+1);
  const sisaHal=HAL_TOTAL-done;
  const hariIni=vals.filter(v=>v===today()).length;
  const kuota=sisaHari>0?Math.ceil((sisaHal+hariIni)/sisaHari):sisaHal+hariIni; // dihitung dari sisa di awal hari, jadi tidak menyusut saat membaca
  return {done,pra,sisaHal,lewat,sisaHari,kuota,hariIni,persen:done/HAL_TOTAL*100};
}
const khAdaBacaanNyata=()=>Object.values(KHATAM.read).some(v=>v!=="pra");
function khArsipParsial(){
  if(khAdaBacaanNyata()){const pr=khProgress();KHATAM.riwayat.unshift({mulai:KHATAM.mulai,selesai:today(),hari:pr.lewat,parsial:true,awal:pr.pra});}
}
/** Catat halaman p yang dibaca. Tilawah harian: sekali per halaman per hari (tujuan khatam dan biasa).
    Khatam: hanya bila tujuan "khatam", sekali per halaman per putaran. Mode menyimak tidak pernah sampai sini. */
function catatBaca(p,manual,tujuan){
  const k=today(), d=getDay(k);
  const sudahHariIni=d.halaman.includes(p)||KHATAM.read[p]===k;
  if(!sudahHariIni){d.halaman.push(p);d.tilawah=(d.tilawah||0)+1;simpanDay(k,d);}
  if(tujuan==="khatam"){
    const baru=!KHATAM.read[p];
    if(baru)KHATAM.read[p]=k;
    KHATAM.posisi=p; khSimpan();
    const pr=khProgress();
    if(pr.done>=HAL_TOTAL){selesaiKhatam();return;}
    if(baru&&pr.hariIni===pr.kuota&&pr.kuota>0){buzz([20,60,20]);toast(`Target khatam hari ini tercapai: ${pr.hariIni} halaman`);return;}
    if(manual||baru)toast(baru?`Halaman ${p} dicatat untuk khatam • ${pr.done}/${HAL_TOTAL}`:`Halaman ${p} sudah tercatat di khatam`);
    return;
  }
  if(manual)toast(sudahHariIni?`Halaman ${p} sudah tercatat hari ini`:`Halaman ${p} dicatat terbaca • ${d.tilawah} halaman hari ini`);
  else if(!sudahHariIni)toast(`Halaman ${p} tercatat terbaca`);
}
function selesaiKhatam(){
  KHATAM.riwayat.unshift({mulai:KHATAM.mulai,selesai:today(),hari:khProgress().lewat,awal:khProgress().pra});
  KHATAM.read={}; KHATAM.posisi=0; KHATAM.mulai=today(); khSimpan(); buzz([40,80,40,80,40]);
  toast("Alhamdulillah, khatam! Putaran baru dimulai.");
}
RENDER.khatam=function(){
  const pr=khProgress(); const juzs=[];
  for(let j=0;j<30;j++){
    const a=JUZ_HAL[j], b=(j<29?JUZ_HAL[j+1]-1:HAL_TOTAL); let n=0;

    juzs.push({j:j+1,n,t:b-a+1,a});
  }
  const nyata=pr.done-pr.pra; // laju hanya dari halaman yang benar-benar dibaca di aplikasi
  const laju=nyata/Math.max(1,pr.lewat);
  const perkiraan=nyata>=5&&laju>=1?Math.ceil(pr.sisaHal/laju):null;
  $("#pg-khatam").innerHTML=backHeader("Target khatam",`Mulai ${tglID(new Date(KHATAM.mulai+"T00:00:00"))}`,"lainnya")+
  `<div class="wrap">
    <div class="card" style="display:flex;align-items:center;gap:16px">
      ${ringHTML(pr.persen)}

  for(let p=1;p<P;p++)if(!KHATAM.read[p])KHATAM.read[p]="pra";

const FONT_ARAB_STACK={

/* ---------- Unduh font agar tersedia luring ----------
   File HTML ini sendiri tidak lagi membawa berkas font apa pun (lebih ringan untuk disimpan/dibagikan).
   LPMQ (lokal, dari fonts/LPMQ.woff di sebelah index.html) diunduh OTOMATIS sekali saat aplikasi
   pertama kali dibuka dengan internet, lalu disimpan di localStorage perangkat — sehingga jadi
   satu-satunya font yang dijamin tersedia offline sejak awal. Amiri & Amiri Quran diambil dari
   Google Fonts dan hanya diunduh kalau pengguna menekan tombolnya sendiri di Pengaturan. */
const FONT_UNDUH={
  lpmq:{nama:"LPMQ",lokal:"fonts/LPMQ.woff",family:"LPMQ",weight:"100 900",otomatis:true},
  amiri:{nama:"Amiri",query:"family=Amiri:ital,wght@0,400;0,700;1,400"},
  amiriquran:{nama:"Amiri Quran",query:"family=Amiri+Quran"}
};
function _ab2b64(buf){
  let bin=""; const by=new Uint8Array(buf), n=0x8000;
  for(let i=0;i<by.length;i+=n)bin+=String.fromCharCode.apply(null,by.subarray(i,i+n));
  return btoa(bin);
}
async function unduhFontOffline(fam,diam){
  const f=FONT_UNDUH[fam]; if(!f)return;
  const btn=$("#btn-font-"+fam);
  if(btn){btn.disabled=true;btn.textContent="Mengunduh…";}
  try{
    let css;
    if(f.lokal){
      const fr=await fetch(f.lokal); if(!fr.ok)throw 0;
      const b64=_ab2b64(await fr.arrayBuffer());
      const mime=f.lokal.endsWith(".woff2")?"font/woff2":"font/woff";
      const fmt=mime.endsWith("woff2")?"woff2":"woff";
      css=`@font-face{font-family:'${f.family}';src:url(data:${mime};base64,${b64}) format('${fmt}');font-weight:${f.weight||"400"};font-style:normal;font-display:swap}`;
    }else{
      const cssRes=await fetch(`https://fonts.googleapis.com/css2?${f.query}&display=swap`);
      if(!cssRes.ok)throw 0;
      css=await cssRes.text();
      const urls=[...css.matchAll(/url\((https:\/\/fonts\.gstatic\.com\/[^)]+)\)/g)].map(m=>m[1]);
      for(const url of urls){
        const fr=await fetch(url); if(!fr.ok)continue;
        const b64=_ab2b64(await fr.arrayBuffer());
        const mime=url.includes(".woff2")?"font/woff2":"font/woff";
        css=css.split(url).join(`data:${mime};base64,${b64}`);
      }
    }
    LS.set("fontcache_"+fam,{css,bytes:css.length,ts:Date.now()});
    terapkanFontOfflineTersimpan();
  }catch(e){
    if(!diam)alert("Gagal mengunduh font "+f.nama+". Pastikan perangkat terhubung ke internet, lalu coba lagi.");
  }
  if(!diam)RENDER.pengaturan();
}
function hapusFontOffline(fam){
  LS.del("fontcache_"+fam);
  const el=$("#style-font-"+fam); if(el)el.remove();
  RENDER.pengaturan();
}
function terapkanFontOfflineTersimpan(){
  Object.keys(FONT_UNDUH).forEach(fam=>{
    const data=LS.get("fontcache_"+fam,null), id="style-font-"+fam;
    let el=document.getElementById(id);
    if(data){
      if(!el){el=document.createElement("style");el.id=id;document.head.appendChild(el);}
      el.textContent=data.css;
    }else if(el)el.remove();
  });
}

/** Ubah koordinat menjadi nama desa/kelurahan, kecamatan, kabupaten/kota, provinsi

/** Susun "desa, kecamatan, kabupaten/kota, provinsi" dari alamat OpenStreetMap. */
function susunNamaAlamat(a,display){
  const desa=a.village||a.hamlet||a.suburb||a.neighbourhood||a.town||a.quarter;
  const kec=a.city_district||a.subdistrict||a.district||a.municipality||a.town_district;
  const kab=a.county||a.regency||a.city||a.state_district;
  const bagian=[desa,kec,kab,a.state].filter((v,i,arr)=>v&&arr.indexOf(v)===i);
  if(bagian.length)return bagian.join(", ");
  return display?display.split(",").slice(0,4).join(",").trim():null;
}
const _rev={};
function reverseOSM(lat,lng){
  const k=lat+","+lng;
  if(!_rev[k])_rev[k]=(async()=>{
    try{
      const ctrl=new AbortController(); const batal=setTimeout(()=>ctrl.abort(),9000);
      const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=16&addressdetails=1&accept-language=id`,{signal:ctrl.signal,headers:{"Accept":"application/json"}});
      clearTimeout(batal); if(!res.ok)return null; return await res.json();
    }catch(e){return null;}
  })().then(d=>{if(!d)delete _rev[k];return d;});
  return _rev[k];
}
async function namaWilayah(lat,lng){const d=await reverseOSM(lat,lng);return d?susunNamaAlamat(d.address||{},d.display_name):null;}
function deteksiLokasi(){
  if(!navigator.geolocation){toast("Perangkat tidak mendukung GPS");return;}
  if(location.protocol==="file:"){toast("Deteksi GPS tidak jalan saat berkas dibuka langsung — buka lewat https:// atau pasang sebagai aplikasi, lalu coba lagi");return;}
  const btn=$("#btnDeteksi"); if(btn)btn.style.opacity=".6";
  toast("Mencari sinyal GPS…");
  let terbaik=null, watchId=null, selesai=false;
  const berhenti=()=>{if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;} if(btn)btn.style.opacity="";};
  const pakaiHasil=(pos)=>{
    if(selesai)return; selesai=true; berhenti();
    const lat=pos.coords.latitude, lng=pos.coords.longitude, akurasi=pos.coords.accuracy;
    SET.coords={lat,lng,nama:"Lokasi saat ini",akurasi}; SET.lokasiOtomatis=false; saveSet(); closeSheet(); segarkanSemua(); ambilJadwalResmi();
    toast(akurasi?`Lokasi didapat (±${Math.round(akurasi)} m) — mencari nama wilayah…`:"Lokasi didapat — mencari nama wilayah…");
    namaWilayah(lat,lng).then(nama=>{
      if(!SET.coords||SET.coords.lat!==lat||SET.coords.lng!==lng)return; // lokasi sudah diganti user
      if(nama){SET.coords.nama=nama;saveSet();segarkanSemua();toast("Lokasi: "+nama);}
      else toast("Koordinat tersimpan, tapi nama wilayah tidak terbaca (mungkin koneksi internet terputus)");
    });
  };
  const gagal=(err)=>{
    if(selesai)return; selesai=true; berhenti(); if(CUR==="pengaturan")RENDER.pengaturan();
    const pesan={1:"Izin lokasi ditolak — aktifkan izin lokasi untuk halaman ini di peramban lalu coba lagi",
                 2:"Lokasi tidak terbaca — pastikan GPS & internet perangkat aktif",
                 3:"Pencarian lokasi lama — coba lagi di ruang terbuka dengan sinyal GPS lebih baik"};
    toast((err&&pesan[err.code])||"Lokasi gagal dideteksi — pilih kota saja");
  };
  // Pantau beberapa pembacaan GPS beberapa detik dan pakai yang paling akurat,
  // supaya tidak berhenti di titik pertama yang meleset jauh.
  try{
    watchId=navigator.geolocation.watchPosition(pos=>{
      if(!terbaik||pos.coords.accuracy<terbaik.coords.accuracy)terbaik=pos;
      if(pos.coords.accuracy<=30)pakaiHasil(pos); // sudah cukup akurat (≤30 m), langsung pakai
    },gagal,{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  }catch(e){gagal(null);return;}
  setTimeout(()=>{ if(!selesai){ if(terbaik)pakaiHasil(terbaik); else gagal({code:3}); } },10000);
}

/** Ikuti lokasi perangkat secara otomatis: saat aplikasi dibuka dan tiap kembali ke aplikasi (maks. tiap 15 menit).

function arahMataAngin(d){

function perbaruiInfoKompas(){

function loopKompas(){

function aktifkanKompas(){

/** Arah hadap ponsel dari sudut Euler. Ponsel mendatar: pakai sisi atas ponsel. Ponsel tegak: pakai arah belakang ponsel.
    Di antara keduanya dicampur mulus, sehingga tidak acak saat hampir mendatar. */
function headingEuler(al,be,ga){
  const a=al*D2R,b=be*D2R,g=ga*D2R, cA=Math.cos(a),sA=Math.sin(a),cB=Math.cos(b),sB=Math.sin(b),cG=Math.cos(g),sG=Math.sin(g);
  const zUp=cB*cG;                                   // 1 = mendatar layar ke atas, 0 = tegak
  const tE=-cB*sA, tN=cA*cB;                         // sisi atas ponsel (timur, utara)
  const bE=-(cG*sA*sB+cA*sG), bN=-(sA*sG-cA*cG*sB);  // belakang ponsel (timur, utara)
  const nt=Math.hypot(tE,tN)||1, nb=Math.hypot(bE,bN)||1;
  const w=clamp((Math.abs(zUp)-0.5)/0.3,0,1);        // 0 = tegak penuh, 1 = mendatar
  const E=w*tE/nt+(1-w)*bE/nb, N=w*tN/nt+(1-w)*bN/nb;
  return fixA(Math.atan2(E,N)*R2D);
}
function onOrient(e){

    h=(typeof e.beta==="number"&&typeof e.gamma==="number")?headingEuler(e.alpha,e.beta,e.gamma):fixA(360-e.alpha);
  }else return; // sudut relatif (bukan utara) diabaikan supaya tidak bercampur dan bergoyang
  if(!isFinite(h))return;
  h=fixA(h+((screen.orientation&&typeof screen.orientation.angle==="number")?screen.orientation.angle:(window.orientation||0)));

}

  /* musafir: penanda harian "sedang bepergian (safar)" — membuka opsi Jamak & Qasar (rukhsah musafir).
     QS. An-Nisa' 4:101 (qasar) dan HR. Muslim/Mu'adz bin Jabal (praktik jamak Nabi ﷺ saat safar). */
  return {fardhu:f,rawatib:r,sunnah:s,amalan:a,jumat:jm,musafir:false,tilawah:0,halaman:[],puasa:"-",istighfar:0,shalawat:0,catatan:""};
}
function getDay(k){
  const d=TRACK[k]?JSON.parse(JSON.stringify(TRACK[k])):blankDay();
  const b=blankDay();
  d.fardhu=Object.assign(b.fardhu,d.fardhu||{}); d.rawatib=Object.assign(b.rawatib,d.rawatib||{});
  d.sunnah=Object.assign(b.sunnah,d.sunnah||{}); d.amalan=Object.assign(b.amalan,d.amalan||{}); d.jumat=Object.assign(b.jumat,d.jumat||{});
  if(d.tilawah==null)d.tilawah=0; if(!Array.isArray(d.halaman))d.halaman=[]; if(!d.puasa)d.puasa="-"; if(d.musafir==null)d.musafir=false;
  return d;
}
function simpanDay(k,d){TRACK[k]=d;LS.set("track",TRACK);}
function skorHari(k){
  const d=getDay(k);
  const fardu=PRAYERS.filter(p=>d.fardhu[p.k]&&d.fardhu[p.k].cara&&d.fardhu[p.k].cara!=="tidak").length;
  const rawatib=RAWATIB.filter(r=>d.rawatib[r.k]).length;
  const sunah=SUNNAH.filter(s=>d.sunnah[s.k]>0).length;
  const amalan=AMALAN.filter(a=>d.amalan[a.k]).length;
  const jamaah=PRAYERS.filter(p=>isJamaahCara((d.fardhu[p.k]||{}).cara)).length;
  const persen=clamp(Math.round((fardu/5*55)+(rawatib/6*15)+(sunah/SUNNAH.length*14)+(amalan/AMALAN.length*10)+(d.tilawah>0?6:0)),0,100);
  const label=persen>=90?"Masya Allah, hari yang penuh":persen>=70?"Alhamdulillah, hari yang baik":persen>=40?"Terus rapikan, sedikit lagi":persen>0?"Baru dimulai — lanjutkan":"Belum ada catatan hari ini";
  return {fardu,rawatib,sunah,amalan,jamaah,persen,label,tilawah:d.tilawah};
}
function streakHari(){
  let n=0; const d=new Date();
  for(let i=0;i<400;i++){
    const k=dkey(d);
    const s=skorHari(k);
    if(s.fardu>=5){n++;}
    else if(i===0){/* hari berjalan tidak memutus */}
    else break;
    d.setDate(d.getDate()-1);
  }
  return n;
}

   - Qada = tambahan untuk salat yang dikerjakan di luar waktunya: Sendiri + Qada atau Berjamaah + Qada.
   - Masbuk dan Qada tidak bisa digabung (masbuk hanya ada pada salat berjamaah di waktunya).
   - Terlewat berdiri sendiri: tidak bisa digabung dengan Masbuk maupun Qada.
   Maksimal dua pilihan. Data tetap disimpan sebagai cara: jamaah | masbuk | sendiri | tidak, plus
   qada: true/false (masbuk = jamaah + masbuk), sehingga catatan lama tetap kompatibel. */

function pilihTanggal(k){tglPilih=k;RENDER.ibadah();buzz(6);}

function setCaraFardhu(k,v){
  mutasi(d=>{
    const cur=d.fardhu[k]||{};
    const aktif=v==="jamaah"?isJamaahCara(cur.cara):cur.cara===v; // masbuk juga dihitung berjamaah

    if(v==="tidak"){d.fardhu[k]={cara:v,qada:false};return;} // terlewat: tak ada salat, masbuk, maupun qada
    if(cur.cara&&cur.cara!=="tidak"){d.fardhu[k]={...cur,cara:v};return;} // ganti cara: jam tetap, masbuk gugur, qada tetap

    // setJamakFardhu/toggleQasarFardhu) tidak ikut terhapus saat cara baru pertama kali dicatat.
    d.fardhu[k]=selarasQada({...cur,cara:v,qada:false,ts:c.ts,jam:c.jam,level:c.lvl.k},c.lvl.k);

/** Masbuk hanya sub-pilihan dari berjamaah: jamaah <-> masbuk. Di luar itu diabaikan. */
function toggleMasbuk(k){

    const cur=d.fardhu[k]||{};
    if(cur.cara==="jamaah"){if(!cur.qada)d.fardhu[k]={...cur,cara:"masbuk"};} // masbuk & qada tidak digabung
    else if(cur.cara==="masbuk")d.fardhu[k]={...cur,cara:"jamaah"};
  });

}
function toggleQadaFardhu(k){
  mutasi(d=>{
    const cur=d.fardhu[k]||{};
    if(!cur.cara||cur.cara==="tidak")return; // jaga-jaga: qada butuh cara salat dulu
    if(cur.cara==="masbuk"&&!cur.qada)return; // masbuk & qada tidak digabung
    const qadaBaru=!cur.qada;
    d.fardhu[k]={...cur,qada:qadaBaru,qadaOto:false,qadaAlasan:qadaBaru?(cur.qadaAlasan||null):null};
  });

}

    dan tidak berlaku untuk yang Terlewat (tidak ada tempat pelaksanaan). */
function setTempatFardhu(k,v){
  mutasi(d=>{
    const cur=d.fardhu[k]||{}; if(!cur.cara||cur.cara==="tidak")return;
    d.fardhu[k]={...cur,tempat:cur.tempat===v?null:v};
  });

}
/** Nyalakan/matikan penanda "musafir" harian — membuka opsi Jamak & Qasar. Lihat dalil lengkap di
    komentar JAMAK_PASANGAN/JAMAK_ARAH. Mematikannya TIDAK menghapus jamak/qasar yang sudah tercatat
    di hari itu (biar riwayat tak berubah bila tak sengaja diketuk); hanya menyembunyikan opsi baru. */
function toggleMusafir(){mutasi(d=>{d.musafir=!d.musafir;});RENDER.ibadah();}
/** Niat jamak untuk salat k, dipilih SEBELUM/SESUDAH cara salat ditentukan (boleh keduanya — mengikuti
    kebiasaan niat jamak yang idealnya sudah ada sejak salat pertama dari pasangan yang dijamak). Ketuk
    opsi yang sama = batalkan. Hanya SATU arah yang sah per salat (lihat JAMAK_ARAH); pemanggilan dengan
    arah yang salah diabaikan agar tak pernah tersimpan kombinasi yang secara fikih tidak berlaku. */
function setJamakFardhu(k,v){
  if(JAMAK_ARAH[k]!==v)return; // arah tak sah utk salat ini, abaikan
  mutasi(d=>{
    const cur=d.fardhu[k]||{cara:null,qada:false};
    d.fardhu[k]={...cur,jamak:cur.jamak===v?null:v};
  });
  RENDER.ibadah();
}
/** Batalkan niat jamak salat k (tombol "Tidak dijamak"). Aman dipanggil kapan pun, termasuk saat
    belum ada catatan sama sekali. */
function clearJamakFardhu(k){
  mutasi(d=>{const cur=d.fardhu[k]; if(cur&&cur.jamak)d.fardhu[k]={...cur,jamak:null};});
  RENDER.ibadah();
}
/** Tandai qasar (meringkas 4 rakaat jadi 2). Hanya bermakna bila cara salat sudah tercatat (perlu tahu
    salat ini sungguh dikerjakan), dan hanya utk Zuhur/Asar/Isya (lihat QASAR_BOLEH). */
function toggleQasarFardhu(k){
  if(!QASAR_BOLEH.includes(k))return;
  mutasi(d=>{
    const cur=d.fardhu[k]||{}; if(!cur.cara||cur.cara==="tidak")return;
    d.fardhu[k]={...cur,qasar:!cur.qasar};
  });

/** Catat sebab qada: uzur (lupa/tertidur/sakit, tidak berdosa) atau sengaja ditunda tanpa uzur. */

function hitungKetepatan(d,dt){

    const lvl=fi.level||levelKetepatan(p.k,hmToDec(jam),dt).k;

/* ======================= RAMADHAN & HARI BESAR ======================= */
/** Hari besar Hijriah berikutnya untuk (bulan,hari) tertentu, dihitung dari tahun Hijriah 'sekarang'
    dan otomatis digeser setahun jika ternyata sudah lewat. 'acuan' hanya mempercepat & mengarahkan pencarian. */
function hariBesarBerikutnya(m,d,label,acuan){
  const now=new Date(); const h=hijriYMD(now); if(!h)return {label,tgl:null};
  let tgl=tanggalDariHijri(h.y,m,d,acuan||now);
  if(tgl&&dkey(tgl)<dkey(now))tgl=tanggalDariHijri(h.y+1,m,d,new Date(now.getTime()+330*864e5));
  return {label,tgl};
}
function acaraIslamBerikutnya(){
  const h=hijriYMD(new Date()); if(!h)return null;
  const ramadhan=hariBesarBerikutnya(9,1,"Awal Ramadhan");
  const fitri=hariBesarBerikutnya(10,1,"Idul Fitri",ramadhan.tgl);
  const tarwiyah=hariBesarBerikutnya(12,8,"Tarwiyah",fitri.tgl);
  const arafah=hariBesarBerikutnya(12,9,"Hari Arafah",tarwiyah.tgl);
  const adha=hariBesarBerikutnya(12,10,"Idul Adha",arafah.tgl);
  const tasua=hariBesarBerikutnya(1,9,"Tasu'a",adha.tgl);
  const asyura=hariBesarBerikutnya(1,10,"Asyura",tasua.tgl);
  return {ramadhan,fitri,tarwiyah,arafah,adha,tasua,asyura,sekarang:h};
}
/** n tanggal Ayyamul Bidh (13-15 tiap bulan Hijriah) terdekat mulai hari ini, melompati Ramadhan
    (sudah wajib puasa) dan 13 Dzulhijjah (Tasyrik, puasa dilarang). Dipakai di halaman Ramadhan &amp; hari besar. */
function ayyamulBidhBerikutnya(n){
  const now=new Date(); const h0=hijriYMD(now); if(!h0)return [];
  const hasil=[]; let acuan=now;
  for(let step=0;step<24&&hasil.length<n;step++){
    const mm=((h0.m-1+step)%12)+1, yy=h0.y+Math.floor((h0.m-1+step)/12);
    if(mm!==9){
      for(const dd of [13,14,15]){
        if(mm===12&&dd===13)continue;
        const tgl=tanggalDariHijri(yy,mm,dd,acuan);
        if(tgl&&dkey(tgl)>=today())hasil.push({tgl,hari:dd,bulan:mm});
      }
    }
    acuan=new Date(acuan.getTime()+29*864e5);
  }
  hasil.sort((a,b)=>a.tgl-b.tgl);
  return hasil.slice(0,n);
}
/* "Imsak" (di sini fajr−10 menit) HANYA ihtiyat/kehati-hatian lokal (kebiasaan Kemenag RI dkk), BUKAN
   batas syar'i berakhirnya sahur. Batas sesungguhnya adalah masuknya waktu Subuh: QS. Al-Baqarah 2:187
   "...makan minumlah hingga jelas bagimu benang putih dari benang hitam, yaitu fajar" — dan HR. Bukhari
   (Zaid bin Tsabit): jarak sahur beliau ﷺ dengan masuknya salat Subuh hanya sekitar bacaan 50 ayat,
   jauh lebih mepet dari 10 menit. Karena itu fase antara Imsak dan Subuh diberi label sendiri yang
   tidak menyiratkan sahur sudah tidak boleh, bukan langsung dianggap "menuju berbuka". */
function faseRamadhanHariIni(j,now){
  const h=now.getHours()+now.getMinutes()/60+now.getSeconds()/3600;
  if(h<j.imsak)return {label:"MENUJU IMSAK",target:j.imsak};
  if(h<j.subuh)return {label:"SAHUR MASIH BOLEH",target:j.subuh};
  if(h<j.maghrib)return {label:"MENUJU BERBUKA",target:j.maghrib};
  return {label:"PUASA SELESAI",target:null};
}
function sisaJamMenit(now,jamTarget){
  let s=(jamTarget-(now.getHours()+now.getMinutes()/60+now.getSeconds()/3600))*3600;
  if(s<0)s+=86400; s=Math.max(0,Math.floor(s));
  return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;
}
/** Kartu status musim untuk beranda & halaman Ramadhan: Ramadhan berjalan, hari raya, Arafah, Tasyrik,
    atau hitung mundur ke acara terdekat. Mengembalikan string kosong bila kalender Hijriah tak didukung. */
function kartuMusimBeranda(){
  const now=new Date(); const st=statusHijriTanggal(now); if(!st.h)return "";
  if(st.dalamRamadhan){
    const acara=acaraIslamBerikutnya(); if(!acara||!acara.fitri.tgl)return "";
    const total=Math.max(29,Math.round((acara.fitri.tgl-acara.ramadhan.tgl)/864e5));
    const j=jadwalHariIni(now); const fase=faseRamadhanHariIni(j,now);
    const sudahPuasa=getDay(today()).puasa==="ramadhan";
    return `<div class="card" style="margin-top:12px;border:1.4px solid color-mix(in srgb,var(--gold) 45%,transparent);cursor:pointer" onclick="go('ramadhan')">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <b style="font-size:15px">🌙 Ramadhan ${st.h.y} H — hari ke-${st.hariKeRamadhan} dari ${total}</b>
        ${svg(IC.fwd,"")}
      </div>
      <div style="display:flex;gap:20px;margin-top:10px;align-items:flex-end">
        <div><div style="font-size:10.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.03em">IMSAK</div><div style="font-size:17px;font-weight:800">${jamStr(j.imsak)}</div></div>
        <div><div style="font-size:10.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.03em">BERBUKA</div><div style="font-size:17px;font-weight:800">${jamStr(j.maghrib)}</div></div>
        <div style="flex:1;text-align:right">
          <div style="font-size:10.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.03em">${fase.label}</div>
          <div style="font-size:14px;font-weight:700;color:var(--emerald-3)">${fase.target!=null?sisaJamMenit(now,fase.target)+" lagi":"Tarawih &amp; tadarus"}</div>
        </div>

let IMSAKIYAH_TEKS="";
function imsakiyahHTML(acara,st){
  const L=lokasi(), now=new Date(); let mulai=null;
  if(st.dalamRamadhan)mulai=new Date(now.getFullYear(),now.getMonth(),now.getDate()-(st.hariKeRamadhan-1));
  else if(acara&&acara.ramadhan&&acara.ramadhan.tgl){const t=acara.ramadhan.tgl;mulai=new Date(t.getFullYear(),t.getMonth(),t.getDate());}
  if(!mulai)return "";
  const opt={method:SET.method,asrFactor:SET.asrFactor,ihtiyati:SET.ihtiyati,dhuhaMin:SET.dhuhaMin}, tk=today();
  const th=(hijriYMD(mulai)||{}).y||""; const baris=[], teks=[`Jadwal imsakiyah Ramadhan ${th} H - ${L.nama}`];
  for(let i=0;i<30;i++){
    const d=new Date(mulai.getFullYear(),mulai.getMonth(),mulai.getDate()+i), h=hijriYMD(d);
    if(!h||h.m!==9)break;
    const j=hitungJadwal(d,L.lat,L.lng,opt), tgl=`${HARI[d.getDay()].slice(0,3)}, ${d.getDate()} ${BULAN[d.getMonth()].slice(0,3)}`;
    baris.push(`<tr class="${dkey(d)===tk?"hari-ini":""}"><td>${h.d}</td><td>${tgl}</td><td class="kunci">${jamStr(j.imsak)}</td><td>${jamStr(j.subuh)}</td><td>${jamStr(j.syuruq)}</td><td>${jamStr(j.zuhur)}</td><td>${jamStr(j.ashar)}</td><td class="kunci">${jamStr(j.maghrib)}</td><td>${jamStr(j.isya)}</td></tr>`);
    teks.push(`${h.d} Ramadhan (${tgl}): Imsak ${jamStr(j.imsak)}, Subuh ${jamStr(j.subuh)}, Terbit ${jamStr(j.syuruq)}, Zuhur ${jamStr(j.zuhur)}, Asar ${jamStr(j.ashar)}, Magrib/berbuka ${jamStr(j.maghrib)}, Isya ${jamStr(j.isya)}`);
  }
  if(!baris.length)return "";
  IMSAKIYAH_TEKS=teks.join("\n");

    <div class="card" style="padding:12px 0 6px">

      <div class="imsak-wrap"><table class="imsak"><thead><tr><th>Hari</th><th>Tanggal</th><th>Imsak</th><th>Subuh</th><th>Terbit</th><th>Zuhur</th><th>Asar</th><th>Magrib</th><th>Isya</th></tr></thead><tbody>${baris.join("")}</tbody></table></div>
      <div class="note" style="padding:8px 16px 4px">Jadwal mengikuti lokasi di pojok atas Beranda; ganti lokasi (kecamatan atau desa mana pun) lewat tombol lokasi. Geser tabel ke samping untuk melihat semua kolom.</div>
    </div>`;
}

let KAL_Y,KAL_M; // tahun & bulan Masehi (0-indeks) yg sedang ditampilkan; diisi saat pertama dibuka
function ubahBulanKalender(dir){
  KAL_M+=dir;
  if(KAL_M<0){KAL_M=11;KAL_Y--;}else if(KAL_M>11){KAL_M=0;KAL_Y++;}
  RENDER.kalender();
}
function keBulanIniKalender(){const n=new Date();KAL_Y=n.getFullYear();KAL_M=n.getMonth();RENDER.kalender();}
function bukaHariKalender(k){tglPilih=k;go("ibadah");}
RENDER.kalender=function(){
  const now=new Date();
  if(KAL_Y==null){KAL_Y=now.getFullYear();KAL_M=now.getMonth();}
  const daysInMonth=new Date(KAL_Y,KAL_M+1,0).getDate();
  const startDow=new Date(KAL_Y,KAL_M,1).getDay();
  const todayKey=dkey(now);
  const cells=[];
  for(let i=0;i<startDow;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++){
    const dt=new Date(KAL_Y,KAL_M,d);
    const h=hijriYMD(dt);
    let ev=h?EVENTS_HIJRI.find(e=>e[0]===h.m&&e[1]===h.d):null;
    if(!ev&&h&&h.m!==9&&[13,14,15].includes(h.d))ev=[h.m,h.d,"Ayyamul Bidh — dianjurkan puasa","puasa"];
    cells.push({d,dt,h,ev,today:dkey(dt)===todayKey});
  }
  while(cells.length%7!==0)cells.push(null);
  const isi=cells.filter(Boolean);
  const hFirst=isi[0]&&isi[0].h, hLast=isi[isi.length-1]&&isi[isi.length-1].h;
  const rangeHijri=hFirst&&hLast?(hFirst.m===hLast.m?`${hFirst.d}–${hLast.d} ${HIJRI_BULAN[hFirst.m-1]} ${hFirst.y} H`:`${hFirst.d} ${HIJRI_BULAN[hFirst.m-1]} ${hFirst.y} – ${hLast.d} ${HIJRI_BULAN[hLast.m-1]} ${hLast.y} H`):"";
  const eventsInMonth=isi.filter(c=>c.ev);
  const warnaDot=t=>t==="besar"?"var(--gold)":t==="puasa"?"var(--emerald-3)":"var(--amethyst)";
  const bulanHijriUnik=[...new Set(isi.map(c=>c.h&&c.h.m).filter(Boolean))];
  const labelBulanHijri=bulanHijriUnik.map(m=>HIJRI_BULAN[m-1]).join(" / ");
  $("#pg-kalender").innerHTML=backHeader("Kalender Hijriah",rangeHijri,"lainnya")+
  `<div class="wrap">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <button class="icon-btn" onclick="ubahBulanKalender(-1)">${svg(IC.back)}</button>

async function unduhSemua(){
  const box=$("#unduhProg"),bar=$("#unduhBar"),txt=$("#unduhTxt"); box.style.display="block";
  let ada=await IDB.keys("surah"); ada=ada.map(Number);
  const sisa=SURAH.map(s=>s.n).filter(n=>!ada.includes(n));
  if(!sisa.length){txt.textContent="Semua surat sudah tersimpan.";bar.style.width="100%";return;}
  let ok=0,gagal=0;
  for(let i=0;i<sisa.length;i++){
    try{await ambilSurat(sisa[i]);ok++;}catch(e){gagal++;}
    bar.style.width=((i+1)/sisa.length*100)+"%";
    txt.textContent=`Mengunduh ${i+1}/${sisa.length} — berhasil ${ok}${gagal?", gagal "+gagal:""}`;
  }
  txt.textContent=gagal?`Selesai: ${ok} surat tersimpan, ${gagal} gagal. Coba lagi saat sinyal stabil.`:`Selesai. ${ok} surat kini bisa dibaca tanpa internet.`;
  RENDER.lainnya();
}

function impor(inp){
  const f=inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{

      if(d.settings)SET=Object.assign({},DEFAULTS,d.settings);
      if(d.track)TRACK=d.track; if(d.bookmarks)MARKS=d.bookmarks; if(d.lastread)LAST=d.lastread;
      if(d.tasbih)TASBIH=d.tasbih; if(d.dzikirdone)DZIKIRDONE=d.dzikirdone;
      if(d.khatam&&typeof d.khatam.read==="object"){KHATAM=Object.assign({mulai:today(),targetHari:30,read:{},riwayat:[]},d.khatam);khSimpan();}
      saveSet();LS.set("track",TRACK);LS.set("bookmarks",MARKS);LS.set("lastread",LAST);LS.set("tasbih",TASBIH);LS.set("dzikirdone",DZIKIRDONE);

let lastNotif=LS.get("lastnotif",""); let hariTerakhir=today();
/** Sapaan sekali sehari untuk awal Ramadhan, Idul Fitri, Idul Adha, dan Hari Arafah.
    Ditampilkan sebagai toast selalu; notifikasi sistem hanya bila pengingat diaktifkan. */
function cekHariBesar(){
  const st=statusHijriTanggal(new Date()); if(!st.h)return;
  const key=today()+":hb";
  if(LS.get("lasthb","")===key)return;
  let pesan=null;
  if(st.h.m===9&&st.h.d===1)pesan=`Marhaban ya Ramadhan ${st.h.y} H — puasa Ramadhan dimulai hari ini`;
  else if(st.isIdulFitri)pesan=`Selamat Idul Fitri ${st.h.y} H — Taqabbalallāhu minnā wa minkum`;
  else if(st.isIdulAdha)pesan=`Selamat Idul Adha ${st.h.y} H — Taqabbalallāhu minnā wa minkum`;
  else if(st.isArafah)pesan="Hari ini Hari Arafah — dianjurkan berpuasa Arafah";
  if(pesan){
    LS.set("lasthb",key); toast(pesan); buzz([30,60,30,60,30]);
    try{if(SET.notif&&"Notification" in window&&Notification.permission==="granted")new Notification("Lima Waktu",{body:pesan,silent:false});}catch(e){}
  }
}
/* Cek pd tanggal 29 bulan Hijriah yg mendahului bulan penting (lihat BULAN_ISBAT_BERIKUTNYA di atas). */
function cekSidangIsbat(){
  const st=statusHijriTanggal(new Date()); if(!st.h||st.h.d!==29)return;
  const target=BULAN_ISBAT_BERIKUTNYA[st.h.m]; if(!target)return;
  const key=today()+":ib";
  if(LS.get("lastib","")===key)return;
  LS.set("lastib",key);
  const pesan=`Malam ini (29 ${HIJRI_BULAN[st.h.m-1]}) kemungkinan sidang isbat Kemenag menentukan awal ${HIJRI_BULAN[target-1]}. Cek pengumuman resminya, lalu sesuaikan Koreksi Hijriah di halaman Ramadhan & hari besar bila berbeda.`;
  toast(pesan); buzz([20,40,20]);
  try{if(SET.notif&&"Notification" in window&&Notification.permission==="granted")new Notification("Lima Waktu",{body:pesan,silent:false});}catch(e){}
}
function cekPengingat(){
  if(today()!==hariTerakhir){hariTerakhir=today();tglPilih=today();if(RENDER[CUR])RENDER[CUR]();}
  cekHariBesar();
  cekSidangIsbat();
  if(!SET.notif)return;
  const now=new Date(), h=now.getHours()+now.getMinutes()/60; const j=jadwalHariIni(now);
  const st=statusHijriTanggal(now);
  if(st.dalamRamadhan){
    const key=today()+"imsak";
    if(h>=j.imsak&&h<j.imsak+2/60&&lastNotif!==key){
      lastNotif=key; LS.set("lastnotif",key); buzz([25,50,25]);
      /* Imsak BUKAN batas syar'i akhir sahur (lihat dalil di faseRamadhanHariIni) — teks ini sengaja
         tidak menyebut "sahur berakhir" agar tidak keliru dipahami sebagai batas haram makan-minum. */
      toast("Waktu imsak — batas ihtiyat, sahur sesungguhnya masih boleh sampai masuk waktu Subuh");
      try{if("Notification" in window&&Notification.permission==="granted")new Notification("Waktu Imsak",{body:"Ini batas kehati-hatian, bukan batas syar'i. Sahur tetap sah hingga adzan Subuh.",silent:false});}catch(e){}
    }
  }
  for(const p of PRAYERS){
    const key=today()+p.k;
    if(h>=j[p.k]&&h<j[p.k]+2/60&&lastNotif!==key){
      lastNotif=key; LS.set("lastnotif",key); buzz([40,80,40,80]);
      const buka=(st.dalamRamadhan&&p.k==="maghrib")?" — saatnya berbuka puasa":"";
      toast(`Waktu ${p.nama} telah masuk${buka}`);
      try{if("Notification" in window&&Notification.permission==="granted")new Notification("Waktu "+p.nama,{body:`Telah masuk waktu ${p.nama} di ${lokasi().nama}${buka}`,silent:false});}catch(e){}
    }
  }
}

/* ======================= PWA: PASANG APLIKASI ======================= */
let deferredInstall=null, appTerpasang=false;
try{appTerpasang=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;}catch(e){}
window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault(); deferredInstall=e;
  if(CUR==="pengaturan")RENDER.pengaturan();
});
window.addEventListener("appinstalled",()=>{
  appTerpasang=true; deferredInstall=null; toast("Lima Waktu terpasang di perangkat"); if(CUR==="pengaturan")RENDER.pengaturan();
});
function iosPerangkat(){return /iphone|ipad|ipod/i.test(navigator.userAgent||"")||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);}
async function pasangApp(){
  if(deferredInstall){
    deferredInstall.prompt();
    const r=await deferredInstall.userChoice.catch(()=>null);
    deferredInstall=null; if(CUR==="pengaturan")RENDER.pengaturan();
    if(r&&r.outcome==="accepted")toast("Memasang Lima Waktu…");
    return;
  }
  if(iosPerangkat()){
    openSheet("Pasang di iPhone / iPad",
     `<div style="font-size:13.5px;line-height:1.9;color:var(--ink-soft)">
        <p>Safari tidak mengizinkan pemasangan lewat tombol. Lakukan langkah ini:</p>
        <ol style="padding-left:20px;margin:0">
          <li>Ketuk ikon <b>Bagikan</b> (kotak dengan panah ke atas) di bilah Safari.</li>
          <li>Pilih <b>"Tambah ke Layar Utama"</b>.</li>
          <li>Ketuk <b>Tambah</b> di pojok kanan atas.</li>
        </ol>
        <p style="margin-top:10px">Setelah itu ikon Lima Waktu muncul di layar utama dan terbuka tanpa bilah alamat, seperti aplikasi biasa.</p>
      </div>`);
    return;
  }
  openSheet("Pasang Lima Waktu",
   `<div style="font-size:13.5px;line-height:1.85;color:var(--ink-soft)">
      <p>Peramban ini belum menawarkan pemasangan otomatis. Coba cara berikut:</p>
      <ul style="padding-left:20px;margin:0">
        <li><b>Chrome/Edge di Android atau desktop:</b> ketuk menu titik tiga → "Instal aplikasi" atau "Pasang Lima Waktu".</li>
        <li>Pastikan halaman dibuka lewat alamat <b>https://</b>, bukan dibuka langsung dari berkas.</li>
      </ul>
    </div>`);
}
function daftarSW(){
  if(!("serviceWorker" in navigator))return;
  if(location.protocol!=="http:"&&location.protocol!=="https:")return; // file:// tidak didukung
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* ======================= TOMBOL KEMBALI =======================
   Tombol/gestur kembali di ponsel: tutup sheet, lalu tutup pembaca, lalu mundur satu halaman aplikasi.
   Di Beranda, tekan dua kali (dalam 2 detik) untuk keluar. Satu entri riwayat "penjaga" dipasang setelah
   sentuhan pertama (peramban mengabaikan entri riwayat yang dibuat tanpa interaksi pengguna). */
let GUARD=false, EXIT_ARMED=false, EXIT_T=0;
function tanganiKembali(){
  const sh=$("#sheet"), rd=$("#reader");
  if(sh&&sh.classList.contains("on")){closeSheet();return true;}
  if(rd&&rd.classList.contains("open")){tutupBaca();return true;}
  if(NAVSTACK.length>1){NAVSTACK.pop();go(NAVSTACK[NAVSTACK.length-1],false,true);return true;}
  if(CUR!=="beranda"){NAVSTACK=["beranda"];go("beranda",false,true);return true;}
  return false;
}
function kembaliUI(to){if(!tanganiKembali())go(to||"lainnya");}
function pasangGuard(){
  if(GUARD)return; GUARD=true;
  try{
    if(history.state&&history.state.nuur==="app")return; // dimuat ulang: penjaga sudah ada
    history.replaceState({nuur:"dasar"},"",location.href);
    history.pushState({nuur:"app"},"",location.href);
  }catch(e){GUARD=false;}
}
function pasangKembali(){
  const EV=["pointerup","click","keydown","touchend"];
  const mulai=()=>{EV.forEach(t=>window.removeEventListener(t,mulai,true));pasangGuard();};
  if(navigator.userActivation&&navigator.userActivation.hasBeenActive)pasangGuard();
  else EV.forEach(t=>window.addEventListener(t,mulai,true));
  window.addEventListener("popstate",e=>{
    if(!GUARD)return; const st=e.state;
    if(!st||st.nuur!=="dasar")return; // maju ke entri aplikasi atau entri lain: abaikan
    const jaga=()=>{try{history.pushState({nuur:"app"},"",location.href);}catch(_){}};
    if(tanganiKembali()){jaga();return;}
    if(EXIT_ARMED){EXIT_ARMED=false;clearTimeout(EXIT_T);GUARD=false;history.back();return;}
    EXIT_ARMED=true;toast("Tekan kembali sekali lagi untuk keluar");
    clearTimeout(EXIT_T);EXIT_T=setTimeout(()=>{EXIT_ARMED=false;},2200);jaga();
  });
}

/* Ayat satu blok: bila lebih dari satu baris, ratakan rata kanan-kiri (baris terakhir tetap rata kanan
   secara alami, agar tidak merenggangkan sisa kata yang sedikit); bila hanya satu baris pendek, tetap
   rata kanan supaya kata tidak direnggangkan berlebihan. */
const SEL_ARAB=".tcard .ar,.dz .ar,.ayat-ar,.jfa,.ar";
function rapikanArab(){
  const els=[...document.querySelectorAll(SEL_ARAB)];
  const hasil=els.map(e=>{
    const wasJ=e.classList.contains("jf"); if(wasJ)e.classList.remove("jf");
    const lh=parseFloat(getComputedStyle(e).lineHeight)||0;
    const banyak=lh>0&&e.scrollHeight>lh*1.6;
    return [e,banyak];
  });
  hasil.forEach(([e,b])=>e.classList.toggle("jf",b));
}
let _rj=0; const jadwalRapikan=()=>{cancelAnimationFrame(_rj);_rj=requestAnimationFrame(rapikanArab);};
new MutationObserver(jadwalRapikan).observe(document.body,{childList:true,subtree:true});
window.addEventListener("resize",jadwalRapikan);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(jadwalRapikan);

/* ======================= INISIALISASI ======================= */
function init(){
  document.documentElement.dataset.theme=SET.theme;
  terapkanTipografi();
  terapkanFontOfflineTersimpan();
  Object.keys(FONT_UNDUH).forEach(fam=>{
    if(FONT_UNDUH[fam].otomatis&&!LS.get("fontcache_"+fam,null))unduhFontOffline(fam,true);
  });
  buildShell();
  document.body.insertAdjacentHTML("beforeend",readerHTML());
  R.mode=SET.mushafMode?"mushaf":"terjemah";
  muatPeta(); daftarSW();
  go("beranda"); pasangKembali();
  setTimeout(()=>{$("#splash").classList.add("gone");setTimeout(()=>$("#splash").remove(),700);},5600);
  setInterval(cekPengingat,20000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){cekPengingat();if(CUR==="beranda")RENDER.beranda();}});
  window.addEventListener("keydown",e=>{
    if(e.key==="Escape"){ if($("#sheet").classList.contains("on"))closeSheet(); else if($("#reader").classList.contains("open"))tutupBaca(); }
    if($("#reader").classList.contains("open")){
      if(e.key==="ArrowLeft")keHalaman(R.page+1,1); if(e.key==="ArrowRight")keHalaman(R.page-1,-1);
    }
  });
  window.addEventListener("error",e=>{console.error(e.error||e.message);toast("Ada yang tersendat — coba sekali lagi");});
  window.addEventListener("unhandledrejection",e=>{console.error(e.reason);});
  setTimeout(movePill,150);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init); else init();
